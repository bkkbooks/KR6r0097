front:
  text: 禪苑蒙求目録卷上千八百四十二則一百八十六人釋迦七步達磨九年靈山密付少室單傳青原與斧南嶽磨磚大雄創寺百丈開田溈仰體用曹洞正遍雲門數句臨濟三玄世尊良久維摩默然帝釋插草布袋乞錢黃蘗一掌大愚三拳李翱問道陳操論禪靈雲見花香嚴擊竹沙彌尋思道者覔宿鳥窠吹毛龍潭滅燭孚公搖頭居士翹足三角禾豆南華稻粟婆子作齋草贄設粥灌溪劈箭疏山囓鏃天鉢花開九峯麥熟啞子延僧則天賜浴尚書打毬大夫雙陸行者失笑陸亘合哭大寂吹耳尊者撥眉寒山茄串解脫粥篦陳老蒲鞋龐蘊漉籬悟本紙撚法眼香匙光仁女子玄則童兒九峯拽擺保福扶犂玄泰布衲克符紙衣菴主不顧良邃盡知常侍擲筆太傅過泥于頔失色李渤懷疑石鞏張弓禾山打鼓歸宗拽石木平搬土宣鑑斫牌白雲搖艫道吾起拜迦葉作舞涌泉騎牛牧菴跨虎徑山蟭螟地藏鸚鵡石霜侍師慈覺養母谷泉配役長興遭虜宣老為男信公作女四賢問道三佛下語真際庭柏守初麻斤浮石鬻卜王老賣身香嚴原夢普化描真婆子偷筍行者施銀莊宗得寶船子獲鱗趙州狗子臨濟真人華林二虎青原一麟道吾裝鬼拾得呵神大覺潑水興教墮薪三師行説二老疏親文殊白槌百丈捲席太達妄想洛瓶消息藥山曲調青原階級夾山揮劍隱峰飛錫洞山寒暑谷山聲色元祐回牒鹿門辭勑華亭藏身雲門聞頞北禪烹牛三角喝賊保寧摑口洪英掐膝恭語不灰玄言上石滿號銀山秀名鐵壁龍牙禪版長慶蒲團槃山肉案蜆子臺盤巴陵銀碗雲岩寶冠荊門犢鼻疏山布單芭蕉拄杖資福剎竿祿清紅莧惠稜牡丹南泉玩月保福遊山寶林冷笑韶陽熱謾乾峰一路兜率三關谷泉逐遇圓照戲端志公難邈六祖難塑章敬撥空雲門抽顧悟本稱奇大禪呌悟義存歸菴老觀閉戶尚座觀魚師伯見兔明教薑杏馬祖鹽醋竹林麻鞋木平草履地藏種田懶瓚煨芋天蓋浴室侍者巡鋪老諗四門師備三句彥從不會法達不去道吾舞笏祕魔擎杈雲岩摸枕南泉指花曹山白酒真際清茶懸泉皂角洞山苧麻祐禪拈柿從展度瓜導師金鎖象骨鐵枷祖心叱狗靈祐餵鴉元圭放戒竈墮翻邪玄沙指虎歸宗斬蛇古德火抄靈樹風車卷中千九百二十則一百九十二人能仁雙趺達磨隻履盧能賣薪懶融負米黃蘗吐舌丹霞掩耳龍牙行拳俱胝竪指提婆赤幡玄沙白紙茂源掩鼻石霜咬齒汾陽六人洞山三子招慶煎茶雲岩掃地禪鑑符讖青州應記首山綱要明安宗旨法華赴齋德普預祀長沙猛虎百丈野狐汾陽師子江西馬駒紫胡獰狗三聖瞎驢懶安白牯佛嶴花奴南山鱉鼻東海鯉魚國師塔樣資福襪模鹽官索扇仰嶠呈珠長慶淘金伏牛下書惠然透網希運捋鬚傳明散衆慈受棄徒三峰玉琯大哥金鋤德山行棒臨濟下喝趙州布衫普化直裰佛日茶籃道者酒榼香林一燈賢女三物石頭碌磚雲門屎橛二僧捲簾三老玩月惠滿二針古德三襪演師禮字行者睡佛東坡解帶裴休納笏舜老民衣芙蓉束髮思大吞佛大士講經老盧幡動僧伽鈴鳴麻谷振錫普化搖鈴隱山晦迹洞山除名盧陵米價偃溪水聲大士側坐道者橫行智岩懸囊惠忠挂鐺佛日豆𪹼典座蟲生惠可了了瑞岩惺惺慈道罐破文悅盆傾宮人千衆惠安單丁清涼十願達磨四行長髭功德黃梅佛性善財採藥大慈識病馬祖展足大覺引頸靈祐踢瓶寂子撲鏡悟本钁頭烏臼杓柄良禪破關女子出定曇照呌苦亡僧索命大容林蟬古德爛杏翠岩把梢風穴據令石鞏趂鹿南泉斬貓祇林揮劍藥嶠抽刀實際頂笠惠圓腰包上座鼻孔翠岩眉毛杉山拈尺義存斫槽座主鬼窟夾嶺鳳巢泐潭苦瓜香林甜桃義玄拄钁惠寂插鍬靈源真告玄泰山謠紹銑設館福國戕橋六祖負金神光償債洛浦投師沙彌求戒蔣山三障華藏四礙鎮州蘿蔔普化生菜永嘉一宿雲蓋半載王嶽四玄溈仰三昧桐峯虎聲投子牛在鏡清失利趙州下載歸宗插標興化擲拐清豁歸山性空沒海黃龍三關浮山九帶青州正座普明不拜仁儉短偈永嘉長歌老龐及第慶諸登科陳操驗僧真際勘婆道士背坐疏山倒屙義存漆桶師備飯籮安國折筯鹿門破鍋雲岩出糞寂子擔禾雲門花欄陸亘瓶鵝石室蹈碓天目撞羅雪竇按劒韶山亞戈古靈揩背從諗洗腳青林死蛇泐潭活玄沙三病天平兩錯水蓮池趙州略彴太陽錢財清平杓索白犬銜書青猿洗鉢飲光坐禪布袋落魄推倒回頭躍翻不托道者休休塔主莫莫太守病痊君王臂落次公點眼駙馬索藥卷下千八百四十則一百七十六人隱峰倒化領衆坐亡歸宗拽杖普化踢床雪峯過嶺洛浦還鄉法遠繡毬文邃香囊鵝湖比較佛日抑揚崇壽登子守芝石幢羅山飯白雲蒿湯慈明詐病法華佯狂方會雪屋倚遇煙房平終虎嚙僧被蛇傷古紹雲門青續大陽多羅轉經俱胝誦呪神會義解石頭真吼惟儼不為從諗仍舊老讓開胸道符縮手豐干饒舌憩鶴多口雲嶽殘羹泐潭酸酒谷泉巴鼻真歇筯徒惠可斷臂神觀安頭王老水牯中邑獼猴茱萸釘橛象骨輥毬龍潭送餅投子沽油嚴陽飼虎惠藏牧牛宣鑒出浴師鼐登樓雲菴奪席浮照隨舟國師三喚趙州一掐大隋蓋龜百丈野鴨曹嶠靈衣疏山壽塔百會不會法達不達楊岐八棒臨濟四喝匾頭被罵水潦遭踏死心下火自禪挂塔天然口啞大耳心通文益書字曉聰栽松禾山義虎瑞岩臥龍翠岩唾地寶壽釘空一城人瞎三日耳聾東山餕餡楊岐栗蓬惠南主法居訥扶宗洪濟師子遼陽大蟲趙州掬水百丈夾火金峰行餅布袋拈果中邑鳴㖿青山骨銼明招目眇雲門腳跛四處謾人三翻懡㦬韶陽九九文殊三三金牛飯桶靈照菜籃丹霞爇佛婆子焚庵雲蓋論議德山小參芙蓉妙唱常察玄談二祖安心洞山見影藥嶺榮枯夾山人境香嚴樹上仰山出井趙州接客價老看病南泉油餈韶陽胡餅德山托鉢象骨覆盆婆子眷屬王老兒孫雲居送袴道吾得裩九峯頭尾洞山功勳楊岐七事元靜十門老安作用馬祖勞倦鏡清雨聲龐公雪片雪豆靈臺鼓山聖箭鐵面退席克賓出院池陽百門佛陀三勸天然剗草提婆投針藥山長嘯般若狂吟師備果子智勤林檎佛果嗽口婆子點心蠱毒之鄉荊棘之林本寂滲漏克符料揀佛日骰盆國師水碗祖心背觸道一長短石樓無耳貞溪具眼可真點胸昌禪擔版德山招扇迦葉剎竿佛光錦帳祐國金襴湑終海嶋亮隱西山大道松妖黃龍赤斑黃牛拒戒師子遇姦石頭路滑五祖機峻明招虎尾老宿鼠糞法演四戒守初三頓成禪一喝太宗十問耽章寶鏡南衙題辭新開雞鴨石門鈎錐無餘唱道萬卦題詩蚊鑽鐵牛鋸解稱槌龐蘊是非清平豐儉大顛佛光雪峰火焰大惠還僧寂音遭貶首山竹篦玄冥木劍禪苑蒙求目録終總計五千六百二則考合五百六十二祖禪苑瑤林注卷上燕京大萬壽寺無諍德諫注少林樂真子志明撰嵩山少林錯庵志明禪師字伯昏雅號樂真子安州郝氏子性忽繩墨外簡朴而內精慜始為粳禪四祖作貫花標月集有潔首座者激礪乃雉髮師香林淨公受具日夕咨參咨扣勝靜普之室後徹證於東林嘗懸木槌拭手謂之槌巾拄一拐去留自適人莫能親疏之東林遷超化衆請補少林師打籌自誓長歌而去歌曰五乳峯前店開饅頭如斗餅如篩洛陽城裏多檀信墮珥遺簪競作齋窮跛子淡淵才老來因甚舞三臺拄笻徑上嵩陽道笑指青山歸去來挽留不可諸方咸仰其高致雪堂和尚注禪苑瑤林引吾萬松老師以無上機讀盡天下書嘗謂余曰記事者必提其要纂言者必鉤其玄韓子之云良有以也嗣子雪堂諫公和尚以玉溪老取樂真禪苑瑤林欲板行之公為之注釋焉幾六萬言或者怪其繁以師言告之公喝云東風吹落杏花枝箇裡紅香在何處乙卯年二月二日龍山居士鴈門呂伯𬵝夫書禪苑蒙求錯庵所製錯庵者即比丘中李瀚王令也此書貫串二千言發明五百事其言辨而載其學淵而博可以為禪門節事法海聯題使後學省十載之勞成半藏之記公慈悲足見以夫錯庵謂誰乃不搽紅紛拂袖於小林者也正大乙酉臘前五日友人幅巾男子樗軒居士題後禪苑蒙求引樂真禪師為初機後學而設也師以正法眼作文字禪駢以對偶諧以韻語凡五百餘則以使學者觀覽豫且讀且笑曰師把定要津不通凡聖何區區乎此書無乃為蛇畫足耶師曰子言誠是雖然童稚無識未能參叩使成誦在口粗知問津則吾此書不為助譬猶教雷大使作舞雖非本色且要兒孫不墜素業耳於是笑謝而為引時正大三年正月二十六日間居士書
