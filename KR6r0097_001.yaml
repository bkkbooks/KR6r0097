body:
  text: 釋迦七步普曜經世尊降生一手指天一手指地周行七步目顧西方云天上天下唯我獨尊和補曰普曜經云佛初生剎利王家放大智光明照十方界地湧金蓮華自捧雙足東西及南北各行於七步分手指天地作師子吼聲上下及四維能尊我者達磨九年傳燈三初祖於嵩山少林寺面壁九年人莫測之時謂之壁觀婆羅門和補曰傳燈第三云師自梁涉魏至洛陽少林面壁而坐經九年方得二祖傳法靈山密付會元一世尊在靈山會上拈華示衆是時皆默然唯迦葉尊者破顏微笑世尊曰吾有正法眼藏涅槃妙心實相無相微妙法門不立文字教外別傳付屬摩訶迦葉世尊至多子塔前命摩訶迦葉分座令坐以僧伽梨圍之遂告曰吾以正法眼藏密付於汝汝當護持傳付將來少室單傳傳燈三傳法諸祖初以三藏教乘兼行後達磨祖師單傳心印破執顯宗所謂教外別傳不立文字直指人心見性成佛也和補曰傳燈三云達磨於少林顧惠可告之曰昔如來以正法眼藏方付迦葉展轉而至我我今付汝青原與斧六祖法嗣會元五吉州青原行思禪師令石頭馳書往南嶽讓和尚處乃云回來與汝鈯斧子去石頭到彼便問不慕諸聖不重己靈時如何嶽曰子問太高生何不向下問頭曰寧可永劫沈淪不求諸聖解脫便回原曰返何速乎頭曰書亦不達信亦不通去時蒙許鈯斧子住山便請思垂下一足頭便禮拜歸南嶽住菴南嶽磨磚會元三懷讓禪師居南嶽時馬祖在彼住菴日唯坐禪因往問曰在此何為祖曰坐禪何所圖曰圖作佛讓一日將磚一片於菴前磨祖曰磨此何為嶽曰要作鏡祖曰磨磚豈得成鏡曰坐禪豈得成佛祖曰如何即是曰如人駕車車若不行打車即是打牛即是祖於是悟旨於言下遂印心傳法符西祖之讖馬駒踏殺天下人之語南宗闡於江西大雄創寺馬祖法嗣傳燈六洪州百丈懷海禪師一日以禪宗肇自少室至曹溪已來多居律寺雖云別院然於説法住持未合規度故常爾介懷乃曰佛祖之道欲誕布化元冀來際不泯者豈當與諸部阿笈摩教為隨行邪遂制叢林清規禪門獨行自百丈始今略敘其大要遍示後學令不忘本也其諸軌度山門備焉大雄者大雄山以居處岩巒嵕檖故號之百丈百丈開田懷海法嗣會元四百丈山涅槃和尚一日謂衆曰汝等與我開田我與汝説大義衆開田了歸請説大義師乃展兩手衆罔措溈仰體用百丈法嗣傳燈九溈山與仰山摘茶次溈曰終日只聞子聲不見子形仰遂撼茶樹溈曰子只得其用不得其體仰曰和尚如何溈良久仰曰和尚只得其體不得其用溈云放子三十棒仰曰和尚棒某甲喫某甲棒教誰喫溈曰放子三十棒玄覺云且道過在甚麼處曹洞正偏人天眼目曹洞家有五位君臣謂正中偏偏中正正中來偏中至兼中到雲門數句雪峰法嗣人天眼目韶州雲門文偃禪師示衆曰人人自有光明在看時不見暗昏昏作麼生是諸人自己光明自代云厨庫三門又云好事不如無又示衆云聞聲悟道見色明心觀世音菩薩將錢買胡餅放下手元來却是饅頭僧問如何是祖師西來意師云日裏看山僧問如何是透法身句師云北斗裏藏身僧問如何是諸佛出身處師云東山水上行僧問如何是正法眼藏師云普僧問不起一念還有過也無師云須彌山僧問如何是啐之機師云響僧問如何是學人自己師云遊山玩水僧問如何是吹毛劒師云祖僧問殺父殺母佛前懺悔殺佛殺祖向什麼處懺悔師云露僧問佛法如水中月是否師云清波無透路僧云和尚從何得師云再問復何來僧云便恁麼去時如何師云重疊關山路臨濟三玄黃檗法嗣傳燈十二鎮州臨濟義玄禪師曰夫一句語須具三玄一玄門須具三要有權有用汝等諸人作麼生會三玄者體中玄玄中玄句中玄世尊良久會元一外道問佛不問有言不問無言世尊良久外道讚歎云世尊大慈大悲開我迷雲令我得入外道去後阿難問佛外道有何所證而言得入佛言如世良馬見鞭影而行維摩默然會元二維摩會上三十二菩薩各説不二法門文殊曰我於一切法無言無説無示無識離諸問答是為菩薩入不二法門於是文殊問維摩詰我等各自説已仁者當説何等是菩薩入不二門時維摩詰默然無言文殊歎曰善哉善哉乃至無有文字語言菩薩真入不二法門帝釋插草僧寶傳中佛以手指地曰此處宜建梵剎天帝釋將一莖草插其處曰建梵剎竟佛乃微笑布袋乞錢傳燈二十七佛祖統紀有傳明州奉化縣布袋和尚者未詳氏族自稱名契此形裁腲烏罪反脮奴罪反蹙額皤腹出語無定寢臥隨處常以杖荷一布囊凡供身之具盡貯囊中入肆聚落見物則乞或醠魚葅才接入口分少許投囊中時號長汀子布袋師也有一僧在師前行師乃拊背一下僧回頭師曰乞我一文錢曰道得即與汝一文師放下布囊叉手而立黃蘗一掌傳燈十二見百丈野狐處在卷之中大愚三拳歸宗常法嗣傳燈二臨濟初在黃蘗斷際禪師會中第一座勉令問話濟乃上問曰如何是佛法的的大意黃蘗便打如是三問三回被打將辭往諸方第一座告黃蘗曰義玄上座雖是後生却甚奇特來辭和尚願更垂提誘來日濟上辭黃蘗指往高安見大愚濟到大愚愚問曰什麼處來濟曰黃蘗來愚曰黃蘗有何言句濟曰義玄三度問西來的的意三度蒙賜棒不知過在什麼處愚曰黃蘗恁麼老婆心為汝得徹猶覔過在濟於言下大悟云元來黃蘗佛法無多子愚忸住濟曰者尿床鬼子適道過在什麼處如今却道黃蘗佛法無多子你見箇什麼道理速道道濟於大愚肋下築三拳大愚托開云汝師黃蘗非干我事濟辭大愚回黃蘗蘗云汝回太速生濟云祇為老婆心切便人事了侍立次黃蘗云大愚有何言句濟遂舉前話蘗云這大愚老漢待見痛與一頓濟云説什麼待即今便與隨後便打黃蘗一掌黃蘗云這風顛漢却來這裏捋虎鬚濟便喝蘗云侍者引這風顛漢參堂去李翱問道傳燈十四唐李翱字習之參藥山問道山以手指上下曰會麼翱曰不會山云雲在青天水在瓶翱乃述偈云鍊得身形似鶴形千株松下兩函經我來問道無餘説雲在青霄水在瓶陳操論禪陳尊宿弟子傳燈九睦州刺史陳操尚書飯雲門偃而問曰儒書即不問三乘十二分教自有講師如何是衲僧行腳事曰曾問幾人來曰即今問上座偃曰即今且置作麼生是教意曰黃卷赤軸偃曰此是文字語言作麼生是教意曰口欲談辭喪心欲緣而慮忘偃曰口欲談辭喪為對有言心欲緣而慮忘為對妄想作麼生是教意尚書無以酬之偃曰聞公常看法華經是否曰不敢曰經曰治生産業皆與實相不相違背且道非非想天有幾人退位又無以酬之偃呵譏之而去靈雲見花溈山法嗣傳燈十一福州靈雲志勤禪師初在溈山因見桃花啓悟乃曰三十年來尋劒客幾逢落葉又抽枝自從一見桃花後直到如今更不疑溈山一日曰從緣得入永無退轉後玄沙聞曰諦當甚諦當敢保老兄未徹在香嚴擊竹傳燈十一鄧州香嚴智間禪師初參溈山不契辭抵南陽忠國師遺迹憩焉一日因山中芟除草木以瓦礫擊竹作聲俄失笑間廓然自省乃述偈曰一擊忘所知更不假修治處處無蹤迹聲色外威儀諸方達道者盡言上上機沙彌尋思傳燈五石頭希遷禮六祖為師未受具屬祖將示滅遷曰和尚百年後希遷當何所依祖曰尋思去及祖順世遷每於靜處端坐寂若忘生第一座問曰汝師已逝空坐奚為遷曰我稟遺誡故尋思爾座曰汝有師兄行思在青原汝當依焉師言甚直汝自迷爾遷遂詣靜居即嗣青原之道道者覓宿會元一五祖弘忍大師者蘄州黃梅人也先為破頭山中栽松道者嘗請於四祖曰法道可得聞乎祖曰汝已老脫有聞其能廣化耶儻若再來吾尚可遲汝乃去行水邊見一女子浣衣揖曰寄宿得否女曰我有父兄可往求之曰諾我即敢行女首肯之遂回䇿而去女周氏季子也歸輒孕父母大惡逐之女無所歸日傭紡里中夕止於衆館之下已而生一子以為不詳因拋濁港中明日見之泝流而上氣體鮮明大驚遂舉之成童隨母乞食里人呼為無姓兒逢一智者歎曰此子缺七種相不逮如來後遇信大師得法嗣化於破頭山鳥窠吹毛道欽法嗣會元二杭州鳥窠道林禪師因棲樹上時為鳥窠有侍者會通辭去師謂曰汝今何往曰諸方學佛法去師曰若是佛法吾此間亦有少許曰如何是和尚佛法師於身上拈起布毛吹之會通便悟龍潭滅燭天皇道吾法嗣傳燈十五德山因造龍潭崇信禪師即時辭去龍潭留之一夕於室外默坐龍問何不歸來山對曰黑龍潭乃點燭與山山擬接龍便吹滅山乃禮拜龍曰見什麼曰從今向去不疑天下老和尚舌頭也至明日便發龍潭謂諸徒曰可中有一箇漢牙如劒樹口似血盆一棒打不回頭他時向孤峯頂上立吾道在孚公搖頭會元七太原孚上坐遍歷諸方名聞宇內嘗遊浙中登徑山法會一日於大佛殿前有僧問上座曾到五臺否師曰曾到曰還見文殊麼師曰見曰什麼處見師曰徑山佛殿前見其僧後適閩川舉似雪峯曰何不教伊入嶺來師聞乃趨裝而邁初上雪峯廨院憩錫因分甘子與僧長慶稜和尚問什麼處將來師曰嶺外將來曰遠涉不易擔負得來師曰甘子甘子方上參雪峯禮拜訖立于座右雪峯才顧視師便下看主事異日雪峯見師乃指日示之師搖手而出雪峯曰汝不肯我師曰和尚搖頭某甲擺尾什麼處不肯和尚曰到處須諱却師不出世諸方目為太原孚上座居士翹足三角禾豆馬祖法嗣會元三潭州三角山德印禪師僧問如何是三寶師曰禾麥豆曰學人不會師曰大衆欣然奉持南華稻粟婆子作齋會元六龐行婆入鹿門寺設齋維那請意旨婆拈梳子插向髻後曰回向了也便出去甘贄設粥南泉弟子傳燈十池州甘贄行者入寺設粥仍請南泉念誦泉乃白槌曰請大衆為狸奴白牯念摩訶般若波羅蜜多甘拂袖便出南泉粥後問典座行者在甚麼處座曰當時便去也泉便打破鍋子灌溪劈箭臨濟法嗣傳燈十二魏府灌溪志間禪師因僧問久響灌溪到來只見漚麻池師曰汝只見漚麻池不見灌溪僧曰如何是灌溪師曰劈箭急踈山嚙鏃傳燈十七撫州踈山圓照𭅕仁禪師身相短陋精辨冠衆洞山門下時有嚙鏃之機激揚玄奧咸以仁為能詮量者諸方三昧可以詢乎矮師叔天鉢花開九峰麥熟延壽法嗣九峯道詮禪師僧問承聞和尚親見延壽來是否詮曰山前麥熟未也亞子延僧則天賜浴事苑一唐武則天皇后嵩山老安北宗神秀入襟中供養因澡浴次宮姬給侍獨安怡然無他后歎曰入水始知有長人云云尚書打毬禪林類聚一和補曰王常侍睦州蹤禪師一日師問今日何放入院追王云為看馬打毬所以來追師云人打毬馬打毬王云人打毬師云人困麼云困師云馬困麼師云露柱困麼王恤然無對歸至私第中夜間忽然省得明日見師云某會得昨日事也師云露柱困麼王云困師遂許之大夫雙陸傳燈八唐陸亘大夫與南泉見人雙陸遂拈起骰子云恁麼不恁麼只與麼信彩去時如何泉曰臭骨頭十八行者失笑明安玄法嗣僧寶傳中雪竇初在大陽玄禪會中典客與僧夜語雌黃古今至趙州柏樹子因緣爭辨不已有行者立其傍失笑而去客退雪竇呼至數之曰對賓客敢笑耶對曰知客有古今之辨無定古今之眼故敢笑曰且趙州意你作麼生會因以偈對曰一兔橫身當古路蒼鷹才見便生擒後來獵犬無靈性空向枯樁舊處尋雪竇大驚乃與結友或云即承天宗禪師也豫謂聞此可以想見當時法席之盛也陸亘合哭傳燈十陸亘大夫因南泉示寂院主問曰大夫何不哭先師亘曰道得即哭主無語長慶代云合笑不合哭大寂吹耳馬祖法嗣會元三洪州泐潭惟建禪師一日在馬祖法堂後坐禪祖見乃吹建耳兩吹建起定見是和尚却復入定祖歸方丈令侍者持一碗茶與建建不顧便自歸堂也尊者撥眉傳燈七賓頭盧尊者赴阿育王宮大會王問承聞尊者親見佛來是否尊者以手撥開眉毛曰會麼王曰不會尊者曰阿耨達池龍王請佛齋時貧道亦預其數賓頭盧指吾身曰如何是寒山茄串會元二天台山寒山子因衆僧炙茄次將茄串向一僧背上打一下僧回首山呈起茄串云是甚麼僧曰這風顛漢山向傍僧曰你道這僧費却我多少鹽醋解脫粥篦牛頭忠法嗣會元二古清涼傳大隋五臺縣昭果寺解脫禪師自文殊示心印之後乃謙卑自牧專精侍衆厥後文殊躬臨試驗解脫每清旦為衆營粥文殊忽見於前脫殊不顧視文殊警之曰吾是文殊脫以攪粥篦便打曰文殊自文殊解脫自解脫殊乃説偈曰苦瓠連根苦甜瓜徹蒂甜修行三大劫却被老僧嫌陳老蒲鞋黃蘗法嗣睦州龍興寺道蹤禪師即陳尊宿也見黃蘗造悟住高安米山寺以母老東歸鬻草屨以給侍後住龍興寺龐蘊漉籬馬祖弟子傳燈襄州龐蘊居士一女名靈照常隨製竹漉籬令鬻之以供朝夕悟本紙撚雲岩晟法嗣會元十五和補曰洞山守初禪師僧問如何是正法眼師曰紙撚無油初嗣雲門洞山悟本傳中無紙撚之事法眼香匙桂琛法嗣傳燈草四升州清涼院文益大法眼禪師與悟空禪師向火拈起香匙問悟空云不得喚作香匙兄喚作什麼空云香匙師不肯悟空却後二十餘日方明此語光仁女子良價法嗣傳燈十七踈山握木蛇有僧問手中是什麼師提起曰曹家女玄則童兒天益法嗣傳燈草四金陵報恩院玄則禪師初問青峰如何是佛青峰曰丙丁童子來求火師得此語藏之於心及謁淨惠詰其悟旨師對曰丙丁是火而更求火亦似玄則將佛問佛淨惠曰幾放過元來錯會師雖蒙開發頗懷猶豫復退思既殆莫曉玄理乃投誠請益淨惠曰汝問我與汝道師乃問如何是佛淨惠曰丙丁童子來求火師豁然知歸後住報恩院九峰拽擺智門祚嗣僧寶傳下九峯長老勤公曰揚岐牽犁九峯拽把保福扶犁雪峰法嗣傳燈十潭州保福院從展禪師因舉盤山道光境俱忘復是何物洞山道光境未忘復是何物師曰據此二尊宿商量猶未得勦絶乃問長慶如今作麼生道得勦絶慶良久師曰情知和尚向鬼窟裏作活計慶却問作麼生師云兩手扶犁水過膝玄泰布衲石霜諸嗣傳燈十六南嶽玄泰上坐不知何許人也沈靜寡言未嘗衣帛衆謂之泰布衲克符紙衣臨濟法嗣會元十一涿州紙衣克符和尚也庵主不顧臨濟法嗣傳燈十二蓮華峰祥庵主拈拄杖示衆云古人到這裡為什麼不肯住衆無語自代云為他途路不得力復云畢竟如何又自云楖𣗖橫擔不顧人直入千峰萬峰去楖𣗖拄杖也良邃盡知會元四壽州良邃座主參麻谷蒙印可返都城講肆散席告諸徒曰諸人知處良邃總知良邃知處諸人不知常侍擲筆溈山弟子會元九襄州王敬初常侍視事次米和尚至常侍乃舉筆米曰還判得虗空否常侍擲筆入廳更不出米致疑至明日憑鼓山供養主入探其意米隨之潛立屏蔽間傎伺供養主才坐便問昨日米和尚有甚麼言句便不得見常侍曰師子咬人韓獹逐塊米師聞得即省前謬遽出即笑曰我會也我會也侍曰會即不無你試道米曰請常侍舉侍乃竪起一隻筯米曰這野狐精公曰這漢徹也太傅過泥會元九和補曰溈山因泥壁次李軍容來具公裳直至至師背後端笏而立師回首見便側泥盤作接泥勢李便轉笏作進泥勢師便拋下泥盤同歸方丈于頔失色會元三于頔相公問紫玉山道通禪師如何是黑風吹其船舫漂墮羅剎鬼國師云于頔客作漢問恁麼事恁麼于公失色師乃指云遮箇是漂墮羅剎鬼國于又問如何是佛師喚于頔頔應諾師云更莫別求李勃懷疑傳燈七江州刺史李勃問歸宗嘗聞須彌納芥子則不疑芥子納須彌莫是妄談否宗云人傳史君李萬卷是否刺曰不敢宗以手摩頂至踵乃曰都如椰子大萬卷詩書向甚處著刺俯首而已石鞏張弓傳燈十四撫州石鞏惠藏禪師常以弓箭接人三平到師作挽弓勢云看箭三平作避勢師云平生架一張弓一隻箭只射得半箇聖人禾山打鼓九峰虔法嗣碧岩九禾山澄源無殷和尚垂語云習學謂之聞絶學謂之鄰過此二者是為真過僧出問如何是真過師云解打鼓又問如何是真諦師云解打鼓又問即心即佛不問如何是非心非佛師云解打鼓又問上人來時如何接師云解打鼓歸宗拽石馬祖法嗣傳燈事苑二雲門所謂雪峯輥毬歸宗拽石木平般土蟠龍可文法嗣傳燈表州善道木平和尚凡有新到未容參禮先令般土三擔示與頌曰東山路側西山低新到莫辭三擔泥嗟汝在途經日久明明向道却成迷宣鑒斫牌會元七德山卓牌於閙市牌上書字曰佛來也打祖來也打傳燈巖頭卓牌岩頭廢教後在鄂州湖邊作渡子兩岸立板牌一所書云如有渡者請擊此牌一下凡有擊者師乃舞橈而渡之然德山卓牌未見所出和補曰祖庭事苑會元云雪峰一日見玄沙來三箇木毬一齊輥玄沙便作斫牌勢雪峰深肯之故宣鑑作玄沙白雲搖艫道吾起拜關南道嘗法嗣傳燈十一襄州關南道吾和尚僧問如何是和尚深深處師下禪床作女人拜云謝子遠來無可祇對迦葉作舞會元一世尊因乾闥婆王獻樂其時山河大地盡作琴聲迦葉起作舞王問迦葉豈不是阿羅漢諸漏已盡何更有餘習佛曰實無餘習莫謗法也王又撫琴三遍迦葉亦三度作舞王曰迦葉作舞豈不是佛曰實不曾作舞王曰世尊何得妄語佛曰不妄語汝撫琴山河大地木石盡作琴聲豈不是王曰是佛曰迦葉亦復如是所以實不曾作舞王乃信受涌泉騎牛石霜諸嗣傳燈十六台州涌泉景欣禪師有疆德二禪客到於路次見師騎牛不識師曰蹄角甚分明爭奈騎者不識師驟牛而去二禪客憩於樹下煎茶師回下牛近前不審與坐喫茶師問二禪客近離什麼處曰離那邊師曰那邊事作麼生彼提起茶盞師曰此猶是遮邊那邊事作麼生二人無對師曰莫道騎者不識好牧庵跨虎佛眼法嗣普燈十六隆興府黃龍牧庵法忠禪師居南嶽每跨虎出遊儒釋望塵而拜徑山蟭螟溈山法嗣傳燈十一杭州徑山洪諲禪師徑山第三祖僧問如何是長師云千聖不能量問如何是短師云蟭螟眼裏著不滿其僧不肯便去舉似石霜霜云只為太近實頭僧云如何是長霜云不屈曲云如何是短霜云雙六盤中不喝采地藏鸚鵡玄沙法嗣會元八障州羅漢院桂琛禪師障牧王公請於閩城西之石山建精舍曰地藏請師駐錫焉僅逾一紀後遷止障州羅漢院大闡玄要學徒臻湊師問僧什麼處來曰秦州來師曰將得什麼物來曰不將得物來師曰汝為什麼對衆漫語其僧無語師却問秦州豈不是鸚鵡僧曰鸚鵡出在隴西師曰也不較多石霜侍師道吾法嗣傳燈十五潭州石霜慶諸禪師道吾將捨衆順世以師為嫡嗣躬至石霜而就之師日勤侍全于師禮暨道吾歸寂學侶雲集盈五百衆慈覺養母谷泉配役僧寶傳衡嶽谷泉禪師嘉祐中男子冷清夭言誅師坐清曾經由庵中決杖配郴州牢城盛暑負土經通衢放擔説偈曰今朝六月六谷泉被氣𡎺不是上天堂是入地獄言訖微笑泊然如蟬蛻長興遭虜泉仁法嗣會元十三和補曰重雲智暉禪師歸終南圭峯舊居建寺後唐明宗賜額曰長興上坐僧問如何是隨照失宗師云家遭劫賊宣老為男琅瑘覺法嗣會元十二歸宗宣禪師漢州人琅瑘廣照之嗣與郭功甫厚善忽一日南康守以事臨之宣令人馳書與功甫且祝送書者云莫令縣君見功甫時任南昌尉書云某更有六年世緣未盡今日不奈抑逼何欲託生君家望君相照乃化去功甫得書驚喜盈懷中夜某妻夢𥧌髣佛見宣入臥內不覺失聲云此不是和尚來處功甫問其故妻答所見功甫呼燈以宣書示之果有娠及生即名宣光才周歲記問如昔逮三歲白雲端和尚過其家功甫喚出相見望見便呼師姪端云與和尚相別幾年耶宣屈指云四年也端云在甚處相別宣云白蓮莊端云以何為驗宣云爹爹媽媽明日請和尚齋忽門外推車過端云門外什麼聲宣作推車勢端云過如何宣云平地一條溝甫及六歲無疾而化信公作女天皇法嗣傳燈十四海印信和尚嗣琅瑘桂府人也住蘇州定惠寺年八十餘平日受朱防禦家供養屢到其宅一日朱問曰和尚後世能來弟子家中託生否師微笑諾之及歸寺得病數日而化其遷化日朱家生一女子圓照本禪師時住瑞光聞其事往訪之方出月抱出一見便笑圓照云海印儞銷了也女子哭數聲化去四賢問道會元十九于頔相公見紫玉裴休相國問黃蘗高僧楊億內翰參透廣惠李遵勗太尉見石門大悟三佛下語會元十九三佛在五祖時嘗於一亭上夜話歸方丈燈已滅五祖乃於暗中曰各人下轉語佛鑑對云彩鳳舞丹霄佛眼曰鐵蛇橫古路佛果云看腳下五祖曰滅吾宗者乃克勤圓悟也爾真際庭柏會元四趙州觀音院亦曰東院從諗禪師曹州郝鄉人也姓郝氏諡真際大師僧問如何是祖師西來意師云庭前柏樹子僧云和尚莫將境示人師云我不將境示人僧云如何是祖師西來意師云庭前柏樹子守初麻斤雲門法嗣傳燈草三洞山守初禪師僧問如何是佛師云麻三斤浮石鬻卜子湖蹤法嗣傳燈十一障州浮石和尚因上堂云山僧開箇卜鋪能斷人貧富定人生死時有僧出云離却生死貧富不落五行請師直道師云金木水火土王老賣身王南泉俗姓傳燈八池州南泉普願禪師示衆云王老師賣身去也還有人買得麼有僧出云某甲買泉云不作貴不作賤作麼生買酬價僧無對香嚴原夢傳燈九溈山臥次仰山問訊溈山轉面後仰云某甲是和尚弟子何用形迹溈山作起勢仰山便出溈山喚回云我適來得一夢汝試原看仰山將一盆水并手巾度與溈山溈山遂洗面香嚴至溈云我適來與寂子作一上禪通不同小小嚴云某甲下面一一知得溈云試道看嚴點一碗茶與溈山溈云二子神通過於鶖子舍利弗也普化描真會元三普化和尚幽州盤山寶積和尚法嗣山臨遷化謂衆云還有人描得吾真麼衆皆寫真呈山山皆叱之普化出云某甲描得山云何不呈似老僧普化便打筋斗而出山云這漢向後如風狂接人去在山乃奄化婆子偷笋會元四趙州路逢一婆子問曰甚處去婆云偷趙州笋去忽遇老僧又作麼生婆便與一掌州休去行者施銀傳燈十四藥山令供養主化甘贄行者問什麼處來僧曰藥山來甘曰來作麼僧曰教化甘曰還將藥來麼僧曰行者有什麼病甘便捨銀兩挺曰若有人即送來無人即休山怪其僧回急僧曰佛法相當得兩挺銀山令舉其語舉了山令僧速送銀還行者家行者見僧回云猶來遂添銀施之莊宗得寶傳燈十二後唐莊宗車駕幸河北回至魏府行宮詔興化存獎禪師問云朕收中原獲得一寶未曾有人酬價獎曰請陛下寶看帝以兩手舒幞頭腳獎曰君王之寶誰敢酬價玄覺徵曰且道興化肯莊宗若肯莊宗興化眼在甚麼處若不肯莊宗過在甚麼處龍顏大悅賜紫衣師號獎皆不受乃賜馬與師乘騎馬忽驚師墜傷足帝復賜藥救療師喚院主與我做箇木棒拐子主做了將來師接得繞院行問僧曰汝等還識老僧麼曰爭得不識和尚師云𨁸腳法師説得行不得船子得鱗藥山儼法嗣會元五透州華亭船子德誠禪師節操高邈度量不群自印心於藥山與道吾雲岩為同道交洎離藥山乃謂二同志曰公等應各據一方建立藥山宗旨豫率性踈野唯好山水樂情自遣無所能也他後知我所止之處若遇靈利座主指一人來或堪雕琢將生平所得以報先師之恩遂分携至透州華亭泛一小舟隨緣度日以接四方往來之者時人莫知其高蹈因號船子和尚一日泊船岸邊間坐有官人問如何是和尚日用事師竪起橈子曰會麼官人曰不會師云棹撥清波金鱗罕遇師有偈曰三十年來坐釣臺鈎頭往往得黃能金鱗不遇空勞力收取絲綸歸去來道吾後到京口遇夾山上堂僧問如何是法身山曰法身無相曰如何是法眼山云法眼無瑕道吾不覺失笑山便下座請問道吾某甲適來祇對這僧話必有不是致令上座失笑望上座不吝慈悲吾曰和尚一等是出世未有師在山曰某甲甚處不是望為説破吾云某甲終不説請和尚却往華亭船子處去山云此人如何吾曰此人上無片瓦下無卓錐和尚若去須易服而往山乃散衆束裝直造華亭船子才見便問大德住甚麼寺山云寺即不住住即不似師云不似似箇甚麼山曰不是目前法師曰甚處學得來山云非耳目之所到師云一句合頭語萬劫繫驢橛師又問垂絲千尺意在深潭離鈎三寸子何不道山擬開口被師一橈打落水中山才上船師又曰道道擬開口師又打山豁然大悟乃點頭三下師云竿頭絲線從君弄不犯清波意自殊山遂問拋綸擲釣師意如何師云絲懸淥水浮定有無之意山云語帶玄而無路舌頭談而不談師云釣盡江波金鱗始遇山乃掩耳師云如是如是遂屬云汝向去直須藏身處沒蹤迹沒蹤迹處莫藏身吾二十年在藥山祇明斯事汝今既得他後莫住城隍聚落但向深山裏钁頭邊覔取一箇半箇無令接續斷絶山乃辭行頻頻回顧師遂喚闍梨山乃回首師竪起橈子曰汝將謂別有乃覆船入水而逝也和補曰三十年來海上遊水清魚現不吞鈎釣竿斫盡重栽竹不計功程得便休船子誠之頌趙州狗子南泉法嗣大惠書趙州僧問狗子還有佛性也無州云無又問一切衆生皆有佛性因甚狗子却無州云有業識在臨濟真人傳燈十二臨濟上堂云赤肉團上有一無位真人常從汝等諸人面門出入未證據者看看時有僧問如何是無位真人師下禪床把住云道道其僧擬議師托開云無位真人是什麼乾屎橛便歸方丈華林二虎馬祖法嗣傳燈八潭州華林善覺禪師常持錫夜出林麓間七步一振錫一稱觀音名號一日觀察使裴休訪之問云師還有侍者否師云有一兩箇裴曰在甚麼處師乃喚大空小空時二虎自庵後而出裴休視之驚悸師語之云有客且去二虎哮吼而去裴問云師作何行業感得如此師良久曰會麼曰不會師云山僧常念觀音青原一麟會元五石頭遷問青原思禪師曹溪大師還識和尚不思曰汝今識吾否曰識亦爭識得思曰衆角雖多一麟足矣道吾裝鬼三聖到道吾吾預知以緋抹額持神杖於門下立聖曰小心祇候吾應喏聖參堂了再上人事吾具威儀方丈內坐聖才近前吾曰有事相借問得麼聖曰也是適來野狐精出去拾得呵神傳燈草七天台拾得者不言名氏因豐干禪師山中經行至赤城道側聞兒啼聲遂尋之見一子可數歲初謂牧羊子及問之云孤棄于此豐干乃名為拾得携至國清寺付典座僧曰或人來認必可還之有護伽藍神庿每日僧厨下食為鳥所有拾得以杖扶之曰汝食不能護安能護伽藍乎此夕神附夢于合寺僧曰拾得打我詰旦諸僧説夢符同一寺紛然牒申州縣群符至云賢士隱遁菩薩應身宜用旌之號拾得為賢士隱石而逝大覺潑水泐潭法嗣會元十五明州育王山懷璉大覺禪師障州龍溪陳氏子誕生之夕夢僧伽降室因小字泗州既有異兆僉知祥應齠齓出家丱角圓頂篤志道學寢食無廢一日洗面潑水于地微有省發即慕參尋遠造泐潭法席投機印可興教墮薪韶國師法嗣會元十杭州興教洪壽禪師同國師普請次聞墮薪有省作偈曰撲落非他物縱橫不是塵山河及大地全露法王身三師行説杭州大慈寰中禪師嗣百丈海示衆曰説得一丈不如行取一尺説得一尺不如行取一寸洞山曰我不恁麼道僧曰作麼生洞山曰説取行不得底行取説不得底雲居曰行時無説路説時無行路不説不行時合行什麼路二老踈親傳燈七夾山與定山同行言話次夾山云生死中有佛即不迷生死定山云生死中無佛即無生死二人往返不決上山參禮夾山便舉前話問大梅未審那箇親梅云一親一踈夾山云那箇親梅且去明日來夾山明日再上問梅云親者不問問者不親文殊白槌會元一世尊升座文殊白槌曰諦觀法王法法王法如是世尊便下座百丈捲席會元三百丈海一日與馬祖遊山見野鴨子祖問曰是甚麼丈曰野鴨子曰甚處去丈云飛過去祖遂引手扭百丈鼻頭丈作痛聲祖曰何曾飛過丈於是大悟至明日祖升座丈出卷却面前禮拜席祖便下座大達妄想馬祖法嗣傳燈八汾州無業禪師諡大達國師凡有學者致問答曰莫妄想洛缶消息會元五洛缶到天仙仙問甚處來缶云南溪來仙云還將得南溪消息來麼缶云消即消息則未息仙云最苦是未息缶云且道未息箇什麼仙云一回見面千載不忘名缶拂袖便出仙云弄死蛇手有甚限藥山曲調石頭法嗣傳燈十四高沙彌住庵後雨裏來相看藥云你來也師云是藥云是藥云可殺濕師云不打遮箇鼓笛雲岩云皮也無打什麼鼓道吾云鼓也無打什麼皮藥云今日大好曲調青原階級傳燈五青原往曹溪作禮問曰當何所務即不落階級祖云汝曾作什麼來原曰聖諦亦不為何階級之有祖深器之謂有二祖見少林氣象夾山揮劒華亭法嗣會元五夾山僧問撥塵見佛時如何師云直須揮劒若不揮劒漁父捿巢僧後問石霜撥塵見佛時如何霜云渠無國土甚處渠逢僧回舉似師師上堂舉了乃曰門庭施設不如老僧入理深談猶較石霜百步隱峰飛錫馬祖法嗣傳燈八五臺山隱峯禪師姓鄧氏時稱鄧隱峯唐元和中荐登五臺路出淮西屬吳元濟阻兵違拒王命官軍與賊交鋒未決勝負師云吾當去解其患乃擲錫空中飛身而過兩軍將士仰觀事符預夢鬪心頓息洞山寒暑傳燈八僧問洞山寒暑到來如何回避山云何不向無寒暑處回避僧云如何是無寒暑處山云寒時寒殺闍梨熱時熱殺闍梨谷山聲色傳燈八谷山問透溪和尚聲色純真如何是道溪云亂道作麼谷山却從東邊過西邊立溪云若不恁麼即禍事也谷山却過東邊溪乃下禪床方行兩步被谷山捉住云聲色純真事作麼生溪便掌谷山谷山云十年後要箇人下茶也無在溪云要谷山老漢什麼谷山呵呵大笑三聲元祐回牒黃龍南法嗣僧寶傳下雲居元祐禪師住玉澗寺時徐王聞其名奏賜紫方袍師作偈辭之曰為僧六十鬢先素無補空門愧出家願乞封回禮部牒免辜盧老衲袈裟鹿門辭勑華亭藏身藥山法嗣會元五見前船子得鱗處雲門聞頞雪峰法嗣北禪烹牛福嚴良雅嗣會元十五潭州北禪賢和尚除夜小參云年窮歲暮無可與諸人分歲且烹一頭露地白牛炊黍米飯煮野菜羹向榾柮火唱村田何故免見倚它門戶傍它墻剛被時人喚作郎下座歸方丈少頃倚遇上坐即法昌也入方丈云和尚門外有公人長賢曰作什麼遇曰和尚納皮角賢拈頭帽擲在地上遇便去拾賢下禪床捉住云捉賊捉賊遇將頭帽褁向賢頭上云天寒且還和尚賢呵呵大笑遇便出去三角喝賊溈山祐法嗣傳燈十八蘄州三角山法遇庵主因荒亂魁師入山執刃而問和尚有甚財寶師曰僧家之寶非君所宜魁曰是何寶師振聲一喝魁不悟以刀加之保寧摑口楊岐法嗣普燈四和補曰保寧仁勇禪師再受保寧請上堂拍掌三下摑口搖手三下便下座洪英掐膝黃龍南法嗣林間録上翠巖真點胸好問僧文殊是七佛之師因甚麼出女子定不得罔明從下方來因甚出得女子定莫有對者獨英邵武方其問時以手掐其膝而去真笑曰賣匙箸客未在恭語不灰黃龍南法嗣見宗門武庫拾遺黃龍恭首座出世住禪林訪法昌遇和尚遇問曰見説你為黃龍燒香是否曰不敢遇云龍生龍子須是解興雲吐霧始得恭曰隨家豐儉遇曰你未拈香早鈍置黃龍了也恭曰且莫多口遇曰你且道黃龍實頭處作麼生恭提起坐具遇喚行者討坐具來行者提在手中遇便打曰你三十年後也道見老僧來恭後住衡之華光乃有坦率之風罹有司民其衣華光既遭回祿而恭語録於灰燼中字畫無損餘紙悉盡信般若之明驗矣玄言上石梁山緣觀嗣僧寶傳中野州大陽山警玄禪師遊方初到梁山問如何是無相道場山指觀音曰這箇是吳處士畫師擬進語山急索曰這箇是有相底那箇是無相底師遂有省便禮拜山曰何不道取一句師云道即不辭恐上紙筆山笑曰此語上去在滿號銀山秀名鐵壁天衣懷法嗣僧寶下法雲圓通法秀禪師叢林號為秀鐵面龍牙禪板悟本法嗣傳燈十七湖南龍牙山居道禪師在翠微時問云如何是祖師意微云與我過禪板來師便過禪板與微微接得便打師云打即任打要且無祖師意又問臨濟如何是祖師意濟曰與我過蒲團來師乃過蒲團與濟濟接得便打師云打即任打要且無祖師意後有僧問和尚行腳時問二尊宿祖師意未審二尊宿道眼明也未師云明即明也要且無祖師意東禪齊云衆中道佛法即有只是無祖師意若恁麼會有何交涉別作麼生會無祖師意底道理長慶蒲團雪峰法嗣會元七福州長慶惠稜禪師歷參禪苑後參靈雲問如何是佛法大意雲云驢事未去馬事到來師如是往來雪峯玄沙十二年間坐破七箇蒲團不明此事一日捲簾忽然大悟乃有頌曰也大差矣也大差矣捲起簾來見天下有人問我解何宗拈起拂子劈口打峯舉謂玄沙曰此子徹去也沙曰未可此是意識著述更須勘過始得至晚衆僧上來問訊峯謂師云備頭陀未肯汝在汝實有正悟對衆舉來師又有頌云萬象之中獨露身唯人自肯乃方親昔時謬向途中覔今日看來火裡氷峯乃顧汝曰不可更是意識著述師問峯云從上諸聖傳受一路請師垂示峯良久設禮而退峯乃微笑師入方丈參峯曰是甚麼師云今日天晴好普請自此酬問未嘗爽於玄旨盤山肉案馬祖法嗣會元三盤山一日於街市見人在肉肆買肉云精底割一斤來屠兒放下刀叉手云長史那箇不是精底山聞之忽然大悟告馬祖祖又印可之蜆子臺盤良價法嗣傳燈十七京兆府蜆子和尚不知何許人也事迹頗異居無定所自印心於洞山混俗閩川不畜道具不循律儀冬夏唯披一衲逐日江岸採掇蝦蜆以充其腹暮即宿東山白馬庿紙錢中居民目為蜆子和尚華嚴靜禪師聞之欲決真假先潛入紙錢中深夜師歸嚴把住曰如何是祖師西來意師遽答云神前酒臺盤嚴放手曰不虗與我同根生嚴後赴莊宗詔入長安師亦先至每日歌唱自拍或乃佯狂深雪去來俱無蹤迹厥後不知所終巴陵銀碗雲門偃法嗣傳燈草二新開巴陵禪師僧問如何是提婆宗師云銀碗裡盛雪雲巖寶冠馬祖法嗣會元三和補曰池州魯祖寶雲禪師僧問如何是諸佛師云頭上有冠者不是曰如何即是師曰頭上無寶冠荊門犢鼻北塔忠廣法嗣會元十五荊門軍玉泉承皓禪師遊方參北塔發明心要得大自在三昧製犢鼻裩書歷代祖師名字乃曰唯有文殊普賢較些子且書於帶上故叢林目為皓布裩元豐間首衆於襄陽谷隱有卿僧亦效之師見而詬曰汝具何道理敢以為戲事耶嘔血無及耳尋於鹿門如所言而逝踈山布單良價法嗣會元十三踈山聞福州大溈安和尚示衆曰有句無句如藤倚樹師特入嶺到彼值溈泥壁便問承聞和尚道有句無句如藤倚樹是否溈曰是師曰忽遇樹倒藤枯句歸何處溈放下泥盤呵呵大笑歸方丈師云某甲三千里賣却布單特為此事而來和尚何得相弄溈喚侍者取三百錢與這上座去遂囑曰向後有獨眼龍為子點破在溈山次日上堂師出問法身之理理絶玄微不奪是非之境猶是法身邊事如何是向上事溈舉起拂子師云此猶是法身邊事溈曰如何是法身向上事師奪拂子摺折擲向地上便歸衆溈曰龍蛇易辨衲子難瞞後聞務州明招謙和尚出世徑往禮拜招問甚處來師云閩中來招曰曾到大溈否師曰到招曰有何言句師舉前話招曰溈山可謂頭正尾正祇是不遇知音師亦不省復問忽遇樹倒藤枯句歸何處招曰却使溈山笑轉新師於言下大悟乃曰溈山元來笑裡有刀遙望禮拜悔過芭蕉拄杖南塔光涌法嗣郢州芭蕉山惠清禪師上堂拈拄杖示衆曰你有拄杖子我與你拄杖子你無拄杖子奪却你拄杖子靠拄杖下座資福剎竿如寶法嗣吉州資福真邃禪師第二世住謂衆云隔江見資福剎竿便回去腳跟也好與三十棒況過江來時有僧才出師曰不堪共語問如何是古佛心師曰山河大地祿清紅莧圓智法嗣傳燈十五祿清和尚僧問不落道吾機請師道師云庭前紅莧樹生葉不生花良久云會麼僧云不會師云正是道吾機因什麼不會僧禮拜師便打云須是老僧打你始得惠稜牡丹雪峯法嗣會元八地藏與長慶保福入州見牡丹障子保福云好一朵牡丹花長慶云莫眼花地藏曰可惜許一朵花南泉玩月會元三南泉玩月次趙州問幾時得似這箇時節泉云王老師二十年前亦曾恁麼來保福遊山雪峯法嗣會元七長慶稜和尚與保福遊山保福問古人道妙峯山頂莫即遮箇便是也無慶曰是即是可惜許寶林冷笑韶陽熱謾僧寶傳上雲門以拄杖擊繩床曰適來許多葛藤貶向什麼處去也靈利底見不靈利底著我熱謾乾峯一路良價法嗣會元十三乾峯僧問十方薄伽梵一路涅槃門未審路頭在甚麼處峯拈拄杖劃一劃云在這裡僧請益雲門門拈起扇子云扇子𨁝跳上三十三天𡎺著帝釋鼻孔東海鯉魚打一棒雨似盆傾兜率三關真淨文法嗣會元十七兜率從悅禪師設三關以問學者一日撥草參玄只圖見性即今上人性在什麼處二曰識得自性方脫生死眼光落地時作麼生脫三曰脫得生死知去處四大分離向什麼處去谷泉逐遇汾陽昭法嗣會元十二南嶽芭蕉庵大道谷泉禪師因倚遇上坐來參遇後住法昌寺名也問庵主在麼師曰誰曰行腳僧師曰作甚麼曰禮拜庵主師曰恰值庵主不在曰你聻師曰向道不在説甚麼你我拽捧趂出遇次日再來師又趂出遇一日又來問庵主在麼師曰誰曰行腳僧揭簾便入師欄胸桶住曰我這裡狼虎縱橫尿屎鬼子三回兩度來討甚麼曰人言庵主親見汾陽來師解衣抖擻曰你道我見汾陽有多少奇特曰如何是庵中主師曰入門須辨取曰莫祇這便是麼師曰賺却幾多人曰前言何在師曰聽事不真喚鐘作甕曰萬法泯時全體現君臣合處正中邪去也師曰驢漢不會便休亂統什麼曰未審客來將何祇待師曰雲門糊餅趙州茶曰恁麼則謝師供養去也師叱曰我這裡大種也未有早言謝供養圓照戲端天衣懷法嗣僧寶傳圓照禪師元祐初自京師惠林寺退歸姑蘇見端師子於甘露曰汝非端師子乎曰是師戲之曰村裡師子耳端應聲曰村裏師子村裏弄眉尾與眼一齊動開却口肚裏直籠統不愛人取奉直饒弄到帝王宮也是一場乾打閧師粹美不悟其譏也志公難邈會元二寶志禪師初金陵東陽民朱氏之婦上巳日聞兒啼鷹巢中梯樹得之舉以為子七歲依鍾山大沙門僧檢出家專修禪觀宋太始二年髮而徒跣著錦袍往來皖山劒水之下以剪尺拂子柱杖頭負文而行天鑑二年梁武帝詔問弟子煩惑未除何以治之答曰十二帝問其旨如何答曰在書字時節刻漏中益不曉帝嘗詔畫工張僧繇寫師像僧繇下筆輒不自定師遂以指𠢐面門分披出十一面觀音妙相殊麗或慈或威僧繇竟不能寫六祖難塑傳燈五六祖因蜀僧名方辨來謁祖云善揑塑祖正色曰試塑看方辨不領旨乃塑祖真可高七寸曲盡其妙祖觀之曰汝善塑性不善佛性酬以衣物僧禮謝而去章敬撥空馬祖法嗣傳燈七京兆府章敬寺懷惲禪師或問禪師所傳心地法門為是真如心妄想心非真非妄心為是三乘教外別傳底心師云汝見目前虗空麼曰信知常在目前人自不見師曰汝莫認影像曰和尚作麼生師以手撥空三下曰作麼生即是師曰汝向後會去在雲門抽顧人天眼目雲門每顧見僧即曰鑒咦而録之者曰顧鑒咦德山密禪師刪去顧字但曰鑒咦叢林目以為抽顧頌北塔祚禪師作偈曰雲門顧鑒笑嘻嘻擬議遭渠顧鑒咦任是張良多智巧到頭於是也難施悟本稱奇雲岩晟法嗣會元十三瑞州洞山良價悟本禪師參溈山問云頃聞南陽忠國師有無情説法話某甲未究其微溈曰闍黎莫記得麼師云記得溈曰汝試舉一編看師遂舉僧問如何是古佛心國師曰墻壁瓦礫曰豈不是無情國師曰是僧云還解説法否國師云常説熾然説無間歇僧云某甲為甚麼不聞國師云汝自不聞不可妨他聞者也僧曰未審甚麼人得聞國師曰諸聖得聞僧云和尚還聞否國師云我不聞僧云和尚既不聞爭知無情解説法國師曰賴我不聞我若聞即齊於諸聖汝即不聞我説法也僧曰恁麼則衆生無分去也國師云我為衆生説不為諸聖説僧云衆生聞後如何國師云即非衆生僧云無情説法據何典教國師云灼然言不該典非君子之所談汝豈不見華嚴經云剎説衆生説三世一切説師舉了溈曰我這裏亦有祇是罕遇其人師云某甲未明乞師指示溈竪起拂子曰會麼師云不會請和尚説溈曰父母所生口終不為子説師曰還有與師同時慕道者否溈曰此去澧陵攸縣石室相連有雲岩道人若能撥草瞻風必為子之所重師云未審此人如何溈云他曾問老僧學欲奉師去時如何老僧對他道直須絶滲漏始得他道還得不違師旨也無老僧道第一不得道老僧在這裏師遂辭歸溈山徑造雲岩舉前因緣了便問無情説法甚麼人得聞岩云無情得聞師云和尚聞否岩曰我若聞汝即不聞吾説法也師云某甲為甚麼不聞岩竪起拂子云還聞麼師云不聞岩云我説法汝尚不聞豈況無情説法乎師云無情説法該何典教岩曰豈不見彌陀經云水鳥樹林悉皆念佛念法於此有省乃述偈曰也太奇兮也太奇無情説法不思議若將耳聽終難會眼處聞時方得知大禪呌悟歸宗常法嗣會元四五臺山大禪佛智通禪師在歸宗常和尚會下禪宗有二大禪佛一名景通嗣仰山一曰智通嗣歸宗常忽一夜呌云我大悟也衆駭之次日歸宗上堂集衆云昨夜大悟出來禪佛出曰某甲宗云汝見箇什麼道理言大悟禪佛曰師初元來女人作宗默而異之義存歸庵會元七雪峯義存禪師住庵時有兩僧禮拜峯見來以手托庵門放身出云是什麼僧亦云是什麼峯低頭歸庵老觀閉戶黃檗法嗣傳燈十二福州鳥岩山靈觀禪師時稱老觀尋常扃戶人罕見之唯一信士每至食時送供方開一日雪峯伺便扣門師開門峯驀胸搊住曰是凡是聖師唾曰這野狐精便推出閉却門峯曰也祇要識老兄尚座觀魚禪林類聚深明二上坐同行見捕魚見一魚透出網深云俊哉大似箇衲僧相似明曰爭似當時不入他網深云你猶欠悟在明行三十里方省師伯見兔雲岩晟法嗣潭州禪山師伯僧密禪師與洞山行次忽見白兔走過師曰俊哉洞曰作麼生師云大似白衣拜相洞曰老老大大作這箇説話師曰你作麼生洞曰積代簪纓暫時落魄明教薑杏洞山聰法嗣禪林類聚九明教嵩禪師初自洞山遊康山托迹開先法席主者以其住少年鋭文字命掌書記笑曰我豈為汝一杯薑杏湯耶因去之林間録馬祖鹽醋馬祖闡化於江西南嶽讓問衆曰道一為衆説法否衆曰已為衆説法讓曰總未見人持箇消息來衆無對因遣一僧去囑曰待伊上堂時但問作麼生伊道底言語記將來僧去一如讓旨回謂讓曰馬祖云自從胡亂後三十年不曾少鹽醬讓然之竹林麻鞋木平草屨地藏種田玄沙法嗣會元八福州地藏桂琛禪師因插鋤次見僧便問什麼處來僧云南方來師云南方佛法如何僧曰商量浩浩地師云爭似我這裏種田博飯喫僧云爭奈三界何師云汝喚什麼作三界僧無語懶瓚煨芋四祖法嗣唐南嶽山明瓚禪師者未知氏族生緣初遊方詣嵩山普寂盛行禪法師往從焉然則默證寂之心契人牢推量尋於衡嶽間居衆僧營作我則晏如縱被詆詞殊無愧耻時目之懶瓚也唐德宗聞其名遣使詔之使者至其室宣言天子有詔尊者當起謝恩師方撥牛糞火尋煨芋而食寒涕垂頤未嘗答使者笑曰且勸尊者拭涕師曰我豈有工夫為俗人拭涕耶竟不起使回奏德宗甚欽嘆之天蓋浴室侍者巡鋪會元四趙州因與文遠侍者行乃指一片地曰這裏好造箇巡鋪文遠便去路傍立曰把將公驗來師遂與一摑遠曰公驗分明過老諗四門碧岩一趙州上堂正人説邪法邪法悉皆正邪人説正法正法悉皆邪諸方難見易識我這裡易見難識問如何是趙州師曰東門西門南門北門師備三句僧寶傳四福州玄沙宗一大師法名師備本州閩縣人也姓謝氏疾大法難舉罕遇上根學者依語生解隨照失宗乃示綱宗三句曰第一句且自承當現成具足盡十方世界更無他故祇是仁者更教誰見誰聞都來是汝心王所為全成不動智只欠自承當喚作開方便門使汝信有一分真常流注亘古亘今未有不是未有不非者然此句只成平等法何以故但是以言遣言以理逐理平常性相接物利生耳且於宗旨猶是明前不明後號為一味平實分證法身之量未有出格之句死在句下未有自由分若知出格量不被心魔所使入到平中便轉換落落地言通大道不墮平懷之見是謂第一句綱宗也第二句回因就果不著平常一如之理方便喚作轉位投機生殺自在縱奪隨宜出生入死廣利一切逈脫色欲愛見之境方便喚作頓超三界之佛性此名二理雙明二義齊照不被二邊之所動妙用現前是謂第二句綱宗也第三句知有大智性相之本通其過量之見明陰洞陽廓周沙界一真體性大用現前應化無方全用全不用全生全不生方便喚作慈定之門是謂第三句綱宗也彥從不會元安法嗣會元六澧州洛浦元安禪師一日謂門弟子曰吾旦夕行矣有問問諸人若對得分付鉢袋子曰若道這箇是即是頭上安頭若道不是即斬頭覔活堂中第一座對曰青山不舉足日下不挑燈安曰去汝扶吾宗不起有彥從上坐曰去此二途請和尚不問安曰未在更道彥從曰彥從道不盡安曰我不管汝道不盡曰彥從無侍者祇對和尚安乃歸方丈中夜喚彥從至曰汝今日祇老僧甚有道理據汝合體得先師意旨先師道目前無法意在目前不是目前法非耳目所到且道那句是賓那句是主彥從茫然不知答安曰苦苦三更時衆請安代答安曰慈舟不泛滄波上劒峽徒勞放木鵝泊然而化法遠不去溈山法遠也葉縣省和尚嚴冷枯淡衲子敬畏之浮山遠與天衣懷在衆時特往參扣正值雪寒省訶罵驅逐以至將水潑旦過衣服皆濕其他僧皆怒而去唯遠懷併疊敷具整衣復坐於旦過中省到訶曰你更不去我打你遠近前云某二人數千里特來參和尚禪豈以一扚水潑之便去若打殺也不去省笑曰你兩箇要參禪却去挂塔道吾舞笏會元四和補曰衮州關南道吾和尚僧問如何是祖師西來意師以簡笏也揖曰喏雲頂山德敷禪師頌古今大意曰道吾舞笏同人會石鞏彎弓作者諳傳燈草九祕魔擎杈靈湍法嗣傳燈十宋傳曰名常遇姓陰范陽人出家於燕北安國寺來居五臺山之祕魔岩即文殊降龍之所因以為名焉常持一木叉每見僧來禮拜即叉却僧頸云那箇魔魅教你去出家那箇魔魅教你行腳道得也叉下死道不得也叉下死速道學者少有酬對唯晉州霍山景通即大禪佛也才到便跳入懷中坐師於霍山背撫三下山便走出云三千里外賺我來雲岩摸枕藥山儼法嗣道吾問雲岩大悲千手眼那箇是正眼岩曰如人夜間背手摸枕子吾曰我會也岩曰作麼生會吾曰遍身是手眼岩曰道也太煞道祇道得八成吾曰師兄作麼生岩曰通身是手眼南泉指花傳燈八陸亘大夫與南泉語話次夫曰肇法師道天地與我同根萬物與我一體也甚奇怪南泉指庭前牡丹花召大夫云時人見此一株花如夢相似曹山白酒良價法嗣傳燈十七曹山清鋭問某甲孤貧乞師拯濟師曰鋭闍梨近前來鋭近前師云泉州白家酒三盞曰猶道未霑唇玄覺曰什麼處是與他酒喫真際清茶傳燈十趙州問僧曾到此間否僧云曾到州云喫茶去又問僧曾到此間否僧云不曾到州云喫茶去院主問曾到且從不曾到如何喫茶去州乃喚院主主應諾州云喫茶去懸泉皂角岩頭法嗣會元八黃龍山誨機超惠禪師初參岩頭問如何是祖師西來意頭曰你還救糍麼惠曰解頭曰且救糍去後到玄泉問如何是祖師西來意泉拈起一莖皂角曰會麼惠曰不會泉放下皂角作洗衣勢惠便禮拜曰信知佛法無別泉曰你見甚麼道理惠曰某甲曾問岩頭頭曰你還解救糍麼救糍也祇是解粘和尚提起皂角亦是解粘所以道無別泉呵呵大笑惠遂有省洞山苧麻祐禪拈柿傳燈十一仰山隨溈山遊山到盤陀石上坐仰侍立次忽鴉銜一紅柿落在面前溈拾與仰仰接得洗了度與溈溈曰子甚處得來仰曰此是和尚道德所感溈云汝也不得無分即分半與仰玄沙云大小溈山被仰山一坐至今起不得從展度瓜雪峯法嗣會元七保福簽瓜次大原孚至師云道得與汝瓜喫孚曰獨將來師度與一片孚接得便出導師金鎖會元三導師云法本不相礙三際亦復然無為無事人猶是金鎖難象骨鐵枷會元十五雲門謁雪峯峯方堆桅坐為衆説法門犯衆出熟視曰項上三百斤鐵枷何不脫却峯曰因甚到與麼門以手自拭其目趍出峯心異之明日升座曰南山有鱉鼻蛇諸人出入好看門以拄杖攛出又自驚懷自是輩流改觀象骨即雪峯之別山以形似而稱祖心叱狗黃龍南法嗣僧寶傳下隆興府黃龍寶覺初心禪師與轉運判官夏倚公立至論肇論會萬物為自己者及情與無情共一體時有狗臥香卓下師以壓尺擊狗又擊香卓曰狗有情即去香卓無情自住情與無情如何得成一體公立不能對師云才入思惟便成剩法何曾會萬物為己哉靈祐餵鴉會元九溈山餧鴉生飯回頭見仰山曰今日為伊上堂一上仰曰某甲隨倒得聞溈曰聞底事作麼生仰曰鴉作鴉鳴鵲作鵲噪溈曰爭奈聲色何仰曰和尚適來道甚麼溈曰我祇道為伊上堂一上仰曰為甚麼喚作聲色溈曰雖然如此驗過也無妨仰云大事因緣又作麼生驗溈竪起拳仰曰終是指東畫西溈曰子適來問甚麼仰曰問和尚大事因緣溈曰為甚麼喚作指東畫西仰曰為著聲色故某甲所以問過溈曰並未曉了此事溈曰寂子聲色老僧東西元圭放戒惠安國師法嗣會元二嵩嶽元圭禪師謁安國師頓悟玄旨遂卜居嶽之龐塢一日有異人峩冠袴褶而至從者極多輕步徐舒你謁大師大師覩其容貌奇偉非常乃諭之曰善來仁者胡為而至彼曰師寧識我耶師云吾觀佛與衆生等吾一目之豈分別耶曰我此嶽神也能生死於人師安得一目我哉師曰吾不生汝焉能死吾吾視身與空等視吾與汝等汝能壞空與汝乎苟能壞空及壞汝吾則不生不滅汝尚不能如是又焉能生死吾耶神稽首曰我亦聰明正直於餘神詎知師有廣大智辨乎顧授以正戒令我度世師曰汝既乞戒即既戒也所以者何戒外無戒又何戒哉神曰此理也我聞茫昧止求師戒我身為門弟子師即為張座秉爐正几與授五戒酒肉淫殺盜等語師曰如上佛戒而無心拘執以有心為物而無心想身如是則先天地生不為精後天地死不為老乃至無我無汝孰為戒之語神曰我神通亞佛師云汝神通十句五能五不能佛則十句七能三不能神竦然避席跪啓曰可得聞乎師云汝能戾上帝東天行而西七曜乎曰不能師云汝能奪地祇融五嶽而結四海乎曰不能師曰是謂五不能也佛能空一切相成萬法智而不能即滅定業佛能知群有性窮億劫事而不能化導無緣能度無量有情而不能盡衆生界是謂三不能也定業亦不罕久無緣亦謂一明衆生界本無增減亘古無一人能主有法有法無主是謂無法無法無主是謂無心如我解佛亦無神通也但能以無心通達一切法爾神曰我誠淺昧未聞空義師所授戒我當奉行今願報德展我小神通而使已發心初發心未發心不信心必信心五等人因我神蹤知有佛有神有能有不能有自然非自然者師云無為是無為是神曰佛亦使神護法師寧隳叛佛耶願如意垂誨師不得已而言曰東岩寺之障莾然無樹北岫有之而背非屏擁汝能移北樹於東嶺乎神曰已聞命矣然昏夜間必有喧動願師無駭作禮而退師門送嵐靄煙霞紛紜間錯幢幡環珮凌空出沒焉其夕果有暴風迅雷奔雲振電棟宇搖蕩宿鳥聲喧師謂衆曰無怪神與我約矣詰旦和霽則北岩松栝盡移東嶺森然行植竈墮翻邪會元二嵩嶽破竈墮和尚不稱名氏言行叵測隱居嵩嶽山塢有廟甚靈庿中唯安一竈遠近祭不輟牟殺物命甚多師一日領侍僧入廟以杖敲三下咄云汝本泥瓦合成聖從何來靈從何起又打三下竈乃傾破須臾有青衣峩冠設拜師前師曰汝是何人云我本此庿神久受業報今日蒙師説無生法得脫此處特來致謝師云是汝本有之理非吾強言神再拜而沒侍僧云某甲久在和尚左右未蒙指示竈神有何所得遂得升濟師云我別無道理為他只向他道汝本泥瓦合成聖從何來靈從何起侍僧默然師云會麼云不會本有之性為甚不會侍僧禮拜師曰破也墮也安國師號為破竈墮玄沙指虎玄沙一日普請往海坑斫柴見一虎僧云和尚虎師曰是汝虎歸院後僧問適來見虎云是汝未審尊意如何師曰娑婆世界有四重障若人透得許汝出陰界東禪齊云上座古人見了道我身心如大地虗空如今還透得麼歸宗斬蛇馬祖法嗣傳燈七廬山歸宗寺智常禪師有座主來參值師鋤草次忽見一條蛇師以鋤便钁主云久嚮歸宗到來只見箇粗行沙門師云你粗我粗主云如何是細師作斬勢主云恁麼則依而行之師云依而行之則且置你什麼處見我斬蛇主無語古德火抄會元九巴州魯祖山寶雲禪師尋常見僧來便面壁南泉聞云我尋常向僧道向佛未出世時會取尚不得一箇半箇他恁麼地驢年去玄覺云為復唱和語不肯語保福問長慶只如魯祖節文在什麼處被南泉恁麼道長慶云退己讓於人萬中無一箇羅山云陳老師當時若見背上與五火抄何故如此為伊解放不解放玄沙云我當時若見也與五火抄雲居錫云羅山玄沙總恁麼道為復一般別有道理若擇得出許上坐佛法有去處玄覺云且道玄沙五火抄打伊著不著靈樹風車傳燈十一韶州靈樹如敏禪師僧問如何是西來意師云童子莫徭兒僧云乞指示師云汝從虔州來問是什麼得恁麼難會師云火官頭上風車子
