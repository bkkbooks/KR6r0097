body:
  text: 能仁雙趺傳燈一梵云釋迦此言能仁涅槃經爾時迦葉與諸弟子在耆闍崛山入于正定於正受中忽然心驚舉身戰懷從定中出見諸山地皆大振動即知如來已入涅槃於是將諸弟子尋路疾行悲哀速往正滿七日至拘尸那城右繞寶棺七匝盈目流淚說偈讚嘆其偈云世尊我今大苦痛情亂昏悶迷濁心我今為禮世尊頂為復哀禮如來肩為復敬禮大聖手為復悲禮如來腰為復敬禮如來臍為復深心禮佛足何因不見佛涅槃唯願示我敬禮處世尊大悲即現千輻輪相出於棺外回示迦葉從千輻輪放千光明遍照十方一切世界然後還自入棺封閉如故達磨隻履傳燈三初祖自付法傳衣之後凡九載示有涅槃葬於熊耳山吳坂後三年有魏使宋雲奉使西域還見祖於葱嶺手携隻履語宋雲曰汝主已厭代我歸西國去雲初不解既歸帝果崩遂聞奏後魏孝莊帝帝乃令發塔但見一履遂奉勑取於少林寺供自開元十二年被竊去臺華嚴寺中後亦失所在盧能賣薪傳燈五惠能大師俗姓盧氏三歲喪父其母守志鞠養及長家尤貧師樵采以給一日鬻薪於市中聞客讀金剛經至應無所住而生其心悚然有省直抵黃梅東山五祖見而器之懶融負米四祖法嗣會元二牛頭山法融禪師者潤州延陵人也姓韋氏年十九學通經史尋閲大部般若曉達真空忽一日歎曰儒道世典非究竟法般若正觀出世舟航遂隱茅山投師落髮後入牛頭山幽棲寺北岩之石室有百鳥㗸花之異唐貞觀中四祖遙觀氣象知彼山有奇異之人乃躬自尋訪問寺僧此間有道人否曰出家兒那箇不是道人祖曰阿那箇是道人僧無對別僧曰此去山中十里許有一懶融見人不起亦不合掌莫是道人麼祖遂入山見師端坐自若曾無所顧祖問在此作甚麼師曰觀心祖曰觀是何人心是何物師無對便起作禮曰大德高樓何所祖曰貧道不決所止或東或西師曰還識道信禪師否祖曰何以問他師曰嚮德滋久冀一禮謁祖曰道信禪師貧道是也師曰因何降此祖曰特來相訪莫更有宴息之處否師指後面曰別有小菴遂引祖至庵前繞菴唯見虎狼之類祖乃舉兩手作怖勢師曰猶有這箇在祖曰這箇是甚麼師無語少選祖却於宴坐石上書一佛字師視之竦然祖曰猶有這箇在未曉乃稽首請說真要祖曰夫百千法門同歸方寸河沙妙德總在心源一切戒門定門慧門神通變化悉自具足不離汝心一切煩惱業障本來空寂一切因果皆如夢幻無三界可出無菩提可求人與非人性相平等大道虗曠絶思絶慮如是之法汝今已得更無闕少與佛何殊更無別法汝但任心自在莫作觀行亦莫澄心莫起貪嗔莫懷愁慮蕩蕩無礙任意縱橫不作諸善不作諸惡行住坐臥觸目遇緣總是佛之妙用快樂無憂故名為佛師曰心既具足何者是佛何者是心祖曰非心不問佛問佛非不心師既不許作觀行於境起時心如何對治祖曰境緣無好醜好醜起於心心若不強名妄情從何起妄情既不起真心任遍知汝但隨心自在無復對治即名常住法身無有變異吾受璨大師頓教法門今付於汝汝今諦受吾言只住此山向後當有五人達者紹汝玄化祖付法訖遂返雙峯終老師自爾法席大盛唐永徽中徒衆乏糧師往丹陽緣化去去山八十里躬負米一石八斗朝往暮還供僧三百二時不闕三年會元二璨大師者三祖也黃蘗吐舌會元三百丈大智再參馬祖祖見來竪起拂子丈云只觸此用離此用祖以拂子掛舊處良久云汝以後開兩片皮將何為人丈亦竪起拂子祖云只觸此用離此用丈亦掛舊處祖便振威一喝丈大悟直得三日耳聾後黃蘗來參舉此遂聞吐舌丹霞掩耳傳燈十四鄧州丹霞天然禪師初參石頭因緣相契躬執㸑役凡三年忽一日石頭告衆曰來日剗佛殿前草至來日大衆與童行各備鍬钁剗草唯師以盆盛水洗頭於和尚前胡跪石頭見而笑之便與剃髮方與說戒法師乃掩耳而去後謁馬祖入僧堂騎聖僧項衆皆驚呼祖見之曰我子天然下來師下作禮曰謝賜名龍牙行拳悟本法嗣傳燈草七龍牙僧問十二時中如何著力師曰如無手人欲行拳始得俱胝竪指天龍法嗣傳燈十一務州金華山俱胝和尚始以庵居以尼實際激厲其志方有慕大之心俄然天龍至菴因是具陳實際到菴之緣扣之天龍竪一指示之師即領悟將示寂之秋謂衆曰吾得天龍一指頭禪一生用不盡言訖奄化提婆赤幡碧巖二第十五祖迦那提婆大士初得法已至巴連弗城聞諸外道欲障佛法許之既久大士乃執長幡入彼衆中其幡八尺竿長丈二於彼而立更不移步外道曰汝何不前曰汝何不後外道曰汝似賤者曰汝似良人外道曰汝解何法曰汝百不解外道曰我欲得佛曰我灼然得外道曰汝不合得曰元道我得汝實不得外道曰汝既不得云何言得曰汝有我故所以不得我無我故自當得佛彼既辭屈乃問曰汝名何等曰我名提婆外道素聞其名乃悔過致謝梵曰提婆此云天玄沙白紙會元七玄沙令僧馳書僧上雪峯峯上堂開緘見三幅白紙乃呈示大衆云會麼良久云不見道君子千里同風僧歸舉似玄沙沙曰山頭老漢蹉過也不知茂源掩鼻性空法嗣傳燈十五天台平田普岸禪師嘗訪歙州茂源和尚源才起迎岸近前把住云開口即失閉口即喪去此二途請師別道源以手掩鼻岸放開云一步較易兩步較難源云著甚死急岸云若不是師不免諸方撿點石霜咬齒傳燈五石霜僧問如何是祖師西來意師乃咬齒示之僧不會後問九峯曰先師咬齒意旨如何峯曰我寧可截舌不犯國諱又問雲蓋蓋曰我與先師有甚麼冤讎汾陽六人會元十一汾州太子院善照禪師天下道俗慕仰不敢名同曰汾州并汾池苦寒師罷夜參有異比丘振錫而至謂師曰會中有大士六人奈何不說法言訖升堂而去師密記以偈曰胡僧金錫光請法到汾陽六人成大器勸請為敷揚洞山三子雲岩曇晟嗣碧岩九洞山曰貪嗔癡太無知賴我今朝識得伊行時便打坐時便捶分付心王子細推無量劫來不解脫問汝三人知不知神鼎諲曰古人與麼道神鼎則不然貪嗔癡實無知十二時中任從伊行時即往坐時即隨分付心王擬何為無量劫來元解脫何須更問知不知招慶煎茶道間法嗣傳燈草二王太傅入招慶煎茶時朗上坐與明招把茶銚朗翻却茶銚太傅見問上坐茶爐下是什麼朗云捧爐神太傅云既是捧爐神為什麼翻却茶銚朗云仕官千日失在一朝太傅拂袖便去明招云朗上坐招慶飯了却去江外打野榸朗云和尚作麼生招云非其人得其便雲岩拂地藥山儼法嗣傳燈十四雲岩掃地次道吾曰太區區生師云須知有不區區者吾曰恁麼則有第二月也師竪起掃帚曰是第幾月吾便行玄沙聞云正是第二月禪鑑符讖青州應記大陽玄法嗣下卷在青續太陽處和補曰僧寶傳第十七云投子義青禪師本社人李氏子也移住投子云云初開山慈濟有記曰吾塔若紅是吾再來人偶修飾其塔作瑪瑙色未幾青領院事首山綱要風穴法嗣僧寶傳三汝州首山省念禪師綱宗偈曰咄哉拙郎君汾陽注曰素潔條然巧妙無人識運機非面目打破鳳林關蕩盡玲瓏性著靴水上立塵泥自異咄哉巧女兒汾陽曰妙智理分融攛梭不解織無間巧不立看他鬪雞人旁觀審騰距爭功不自傷水牛也不識全力能負不露頭角明安宗旨梁山靈觀嗣僧寶傳十三明安曰體妙失宗者滯在語路句失宗旨機昧終始者謂當機暗昧只在語中宗旨不圓句句須是有語中無語無語中有語始得妙旨密圓也法華赴齊僧寶二十法華志言大士者莫知其所從來初見之於景德寺七俱胝院梵相奇古直視不瞬口袞袞不可識相傳言誦法華經故以為名至和三年仁宗始不豫國嗣未立天下寒心上夜焚香默禱曰翌日化成殿具齊䖍請法華大士俯臨無却清旦上道衣凝立以待俄馳奏言法華自右腋門徑趨至𥨊殿侍衛呵止不可上笑曰朕請而來也有頃至輒升御榻跏趺而坐受供訖將去上曰朕以儲嗣未立大臣咸以為言侵尋晚暮嗣息有無法華其一決之師索筆引紙連書曰十三十三凡數十行擲筆無他語皆莫測其意其後英宗登極乃𨆯安懿王第十三子方驗前言也德普預祀夾山善會嗣僧寶傳草九禾山德普禪師元祐五年十二月草五日謂左右曰諸方尊宿死叢林必祭吾以為徒虗設吾若死汝曹當先祭乃令從今辦祭衆以其老又好戲語復云和尚幾時遷化曰汝輩祭絶即行於是幃寢堂坐師其中置祭讀文跪揖上食師飫餐自如自門弟子下及莊力日次為之至明年元日祭絶曰明日雪晴乃行至時晴忽雪雪止師安坐焚香而化長沙猛虎南泉法嗣傳燈十湖南長沙景岑禪師與仰山玩月次山曰人人盡有者箇只是用不得師云恰是請汝用山云汝作麼生用師攔胸一踏踏倒山起來云你直下似箇大蟲自此諸方號為岑大蟲百丈野狐會元三百丈禪師每上堂有一老人隨衆聽法一日衆退唯老人不去師問汝是何人老人曰某非人也於過去迦葉佛時曾住此山因學人問大修行底人還落因果也無某對曰不落因果遂五百生墮野狐身今請和尚代一轉語貴脫野狐身師云汝問老人曰大修行底人還落因果也無師云不昧因果老人於言下大悟作禮曰某已脫野狐身住在山後敢乞依亡僧法送師令維那白椎告衆食後送亡僧大衆聚議一衆皆安涅槃堂又無病人何故如是食後師領衆至山後岩下以杖挑出一死野狐乃依法火葬師至晚上堂舉前因緣黃蘗便問古人錯祇對一轉語墮五百生野狐身轉轉不錯合作箇甚麼師曰近前來向汝道蘗近前打師一掌師拍手笑云將謂胡鬚赤更有赤鬚胡溈山舉問仰山仰云黃蘗常用此機溈云汝道天生得從人得仰曰亦是稟受師承亦是自性宗通溈曰如是如是時溈山在會下作典座司馬頭陀舉野狐話問典座作麼生座撼門扇三下司馬曰大粗生座曰佛法不是這箇道理汾陽師子會元十一汾州上堂謂衆曰汾陽門下有西河師子當門踞坐但有來者即便咬殺有何方便入得汾陽門見得汾陽人若見汾陽人者堪與祖佛為師不見汾陽人盡是立地死漢江西馬駒會元三馬大師諱道一生漢州什仿姓馬氏六祖謂南嶽曰向後佛法從汝邊去生一馬駒子蹈殺天下人師道行江西時人稱之為馬祖紫胡獰狗南泉法嗣會元四衢州子湖岩利蹤禪師一日上堂云子湖有一隻狗上取人頭中取人心下取人足擬議即喪身失命也僧問如何是子湖一隻狗師曰嘷嘷三聖瞎驢臨濟法嗣會元十一臨濟臨遷化時據坐云吾滅後不得滅却吾正法眼藏三聖出云爭敢滅却和尚正法眼藏濟云已後有人問你向他道什麼三聖便喝濟云誰知吾正法眼藏向這瞎驢邊滅却言訖端然示寂懶安白牯百丈海法嗣傳燈九福州長慶大安禪師號懶安郡之陳氏子受業於黃蘗山習律乘嘗自念言我雖勤苦而未聞玄極之理乃孤錫遊方將往洪井路出上元逢一老父謂師曰師往南昌當有所得師即造百丈禮而問曰學人欲來識佛何者即是曰大似騎牛覔牛師曰識得後如何丈曰如人騎牛至家師曰未審始終如何保任丈曰如牧牛人執杖視之不令犯人苗稼師自茲領旨更不馳求同參祐禪師創居溈山師躬耕助道及祐歸寂衆請接踵住持上堂汝諸人總來就安求覔甚麼若欲作佛汝自是佛擔佛傍家走如渴鹿趂陽𦦨相似何時得相應去汝欲作佛但無許多顛倒攀緣妄想惡覺垢淨衆生之心便是初心正覺佛更向何處別討所以安在溈山卅年來喫溈山飯屙溈山屎不學溈山禪祇看一頭水牯牛若落路入草便把鼻孔拽轉來才犯人苗稼即鞭撻調伏既久可憐生受人言詮今變作箇露地白牛常在面前終日露逈逈地趂不去佛㠗花奴馬祖法嗣傳燈八溫州佛㠗和尚僧問如何是異類師敲碗云花奴花奴喫飯來南山鱉鼻傳燈十六見前象骨鐵枷之處東海鯉魚雲門録見前乾峯一路之下國師塔樣六祖法嗣會元二西京光宅寺惠忠國師以化緣將畢涅槃時至乃辭代宗代宗曰師滅後弟子將何所託師曰告檀越造取一所無縫塔曰就師請取塔樣良久曰會麼曰不會師云貧道去後有侍者應真却知此事師滅後代宗詔應真入內舉問前話真良久曰聖上會麼曰不會述偈曰湘之南潭之北中有黃金充一國無影樹下合同船琉璃殿上無知識資福襪模如寶法嗣禪林類聚十五和補曰鴿湖禪師初開堂日資福令人送襪模與師師書火字封還資福開封見皺眉久不語鹿苑和尚畫一圓相福云拘尸那國親行此令鹽官索扇馬祖法嗣會元三杭州鹽官鎮國海昌禪院齊安禪師一日喚侍者與我將犀牛扇子來者云扇子已破師曰扇子既破還我犀牛兒來者無對仰嶠呈珠傳燈九東邑因仰山來參問云汝何處人山云廣南人邑云廣南有鎮海明珠是否山云是明邑云此珠作何形山曰白月則現黑月則隱邑曰汝將得來否山云將得來邑云何不呈似老僧山云昨到溈山亦就惠寂索此珠直得無言可對無理可伸邑云真師子兒作大師子吼長慶淘金雪峯法嗣會元七長慶僧問衆生淘金誰是得者師曰有伎倆者曰學人還得也無師曰大遠在伏牛下書伊闕伏牛山自在禪師與大寂送書與忠國師國師問曰馬大師以何法示徒對曰即心即佛國師曰是甚麼語話良久又問此外更有甚麼言教師曰非心非佛或云不是心不是佛不是物國師云馬大師即恁麼不審和尚此間如何國師曰三點如流水曲似刈禾鎌師後隱于伏牛山此二句心字也惠然透網傳燈十二鎮州三聖院惠然禪師問雪峯云透網金鱗以何為食峯云待你透出網來即向你道師云一千五百人善知識話頭也不識希運捋鬚會元十一見前黃蘗一掌之下傳明散衆船子法嗣傳燈十五夾山會禪師諡傳明大師散衆之事見船子得鱗處慈受棄徒會元十六東京惠林懷深慈受禪師祝髮後四年訪道方外依淨照於嘉禾資聖照舉良遂見麻谷因緣問曰如何是良遂知處師即洞明出住資福屨滿戶外蔣山佛鑑勤禪師行化至退師引巡寮至千人街坊鑑問既是千人街坊為甚麼祇有一人師云多虗不如少實鑑云恁麼那師赧然偶朝廷以資福為神霄宮道士宮也因棄往蔣山留西庵陳請益鑑曰資福知是般事便休師云某實未穩望和尚不外鑑舉倩女離魂話反覆窮之大豁疑礙呈偈曰祇是舊寺行履處等間舉著便誵訛夜半一陳狂風起吹落桃花知幾多鑑拊几曰這底豈不是活祖師意未幾被旨住焦山三峰玉琯會元十一臨濟行腳時到三峯平和尚處平問甚處來濟曰黃蘗來平曰黃蘗有何言句濟曰金牛昨夜遭塗炭直至如今不見蹤平曰金風吹玉管那箇是知音濟曰直透萬重關不住青霄內平曰子這一問太高生濟曰龍生金鳳子衝破碧琉璃平曰且坐喫茶大哥金鋤青林䖍嗣會元十三襄州石門獻蘊禪師京兆人也初問青林如何用心得齊於諸聖林仰面良久曰會麼師曰不會林曰去無子用心處師禮拜乃契悟更不他遊遂作園頭一日歸侍立次林曰子今日作甚麼來師云種菜來林曰遍界是佛身子向甚處來種師云金鉏不動土靈苗在處生林欣然來日入園喚蘊闍梨師應諾林曰剩栽無影樹留與後人看師曰若是無影樹豈受栽耶林曰不受栽且止你曾見他枝葉麼師云不曾見林曰既不曾見爭知不受栽師云祇為不曾見所以不受栽林曰如是如是初住南嶽蘭若未幾遷夾山道由潭州時楚王馬氏出城延接便問如何是祖師西來大意師云好大哥御駕六龍千古秀玉街桃仗出金門王大喜延入天𠕋府供養數日方至夾山僧問如何是西來意師曰玉璽不離天子手金箱豈許外人知問不落機關請師便道師曰湛月還機無可比君今曾問幾人來曰即今問和尚師云好大哥雲綻不須落九尾怒君殘壽速歸絲師以蠻夷作亂遂離夾山至襄州創石門寺再振玄風僧問月生雲際時如何師曰三箇孫兒抱華鼓好大哥莫來攔我毬門路師應機多云好大哥時稱大哥和尚德山行棒傳燈十五朗州德山宣鑒禪師凡見僧入門便棒和補曰傳燈第十五云師云尋常遇僧到參多以拄杖打臨濟聞之遣侍者來參德山若打汝但接取拄杖當胸一拄侍者到方禮拜乃打侍者接得拄杖與一拄師歸方丈侍者回舉似臨濟云從來疑遮箇漢臨濟下喝人天眼目臨濟凡見僧入門便喝和補曰人天眼目云師謂僧曰有時一喝如金剛王寶劒有時一喝如踞地師子有時一喝如探竿影草有時一喝不作一喝用汝作麼生會僧擬議師便喝趙州布衫傳燈十趙州僧問萬法歸一一歸何處師云我在青州作一領布衫重七斤普化直裰傳燈十普化一日於街市中就人乞直裰人皆與之師俱不要臨濟令院主買棺一具師歸來濟云與汝做得箇直裰了也師便自擔去繞街市呌云臨濟與我做直裰了也我往東門遷化去市人競隨看之師云我今日未來日往南門遷化去如是三日人皆不信至第四日無人隨看獨出城外自入棺內倩路行人釘之即時傳布市人競往開棺乃見全身脫去祇聞空中鈴響隱隱而去佛日茶籃會元十三杭州佛日本空禪師行腳時到夾山夾山一日普請次維那命師送茶師云某為佛法來不為送茶來那云和尚令請上座師云和尚即得師乃將茶去作務處見夾山遂撼茶碗作聲山不顧師云釅茶三五碗意在钁頭邊山云瓶有傾茶勢籃中幾箇漚師云瓶有傾茶勢籃中無一漚便傾茶大衆俱以目視之師云大衆鶴望乞師一言山云路逢死蛇莫打殺無底籃子盛將來師云手執夜明符幾箇知天曉山召大衆已有人也歸去來乃住普請道者酒榼林間録下宗道者不知何許人往來舒蘄間多留於投子性嗜酒無日不醉村民愛敬之每飽以醇醪居一日方入浴聞有尋宗者度其必送榼至課而出得酒徑去人皆大笑而宗傲然不作嘗散衣下山有逆而問者如何是道者家風對云袈裟褁草鞋意旨如何曰赤腳下相城陳退夫初赴省愇過宗戲問曰瓘此行欲作狀元得否宗熟視曰無時即得莫測其言也而退夫果以第三名上第時彥作魁方悟無時之語宗見雪竇而超放自如言法華之流也香林一燈雲門法嗣傳燈草二益州青城香林院澄遠禪師僧問如何是室內一盞燈師云三人證龜成鱉賢女三物會元一七賢聖女姊妹同遊尸陀林一姊指尸曰尸在這裏人在甚處諸姊諦觀悉皆悟道感帝釋雨花贊歎曰諸姊有何所須我能給施女曰我家四事七珍具足唯要三般物一無根樹一株二無陰陽地一片三呌不應谷一所帝釋曰一切所須我悉有之若此三物我實無之遂同往白佛佛言我諸弟子不解此義唯諸菩薩乃解此義石頭碌磚青原法嗣傳燈十四南嶽石頭希遷禪師於唐天寶荐之衡山南寺寺之東有石狀如臺乃結菴其上時號石頭和尚僧問如何是禪師云碌磚問如何是道師云木頭雲門屎橛雲門録僧問雲門如何是佛師云乾屎橛二僧卷簾傳燈草四法眼因僧齊前上參師以手指簾時有二僧同去卷簾師云一得一失三老玩月會元三馬祖與百丈西堂南泉玩月次祖曰正當與麼時如何堂曰正好修行丈曰正好供養泉拂袖便行祖曰經入藏禪歸海唯有南泉獨超物外惠滿二針傳燈三相州隆化寺惠滿禪師志存儉約唯畜二針冬則乞補夏則捨之自云一生心無怯怖身無螽虱睡而不夢常行乞食住無再宿所至伽藍破紫製履古德三襪會元三和補曰藥山惟儼禪師一日馬祖問子近日見處作麼生師曰皮膚脫落盡唯一真實存祖曰子之所得可謂協於心體布於四肢既然如是將三條篾束取肚皮隨處住去演師禮字五祖法演禪師在受業寺逐字禮蓮經一夕遇屎字欲唱禮遽疑乃白諸老宿曰如何屎字亦稱為法寶某禮至此疑不自解老宿曰據汝所問可以南詢汝正是宗門中根器也祖遂南遊行者唾佛會元六有一行者隨法師入佛殿行者向佛而唾法師曰行者少去就何以唾佛行者曰將無佛處來與某甲無對東坡解帶東林弟子會元十六南康軍雲居山了元佛印禪師一日與學徒入室次適東坡居士到面前師云此間無坐榻居士來此作甚麼士曰暫借佛印四大為坐榻師云山僧有一問居士若道得即請坐道不得即輸腰下玉帶子士欣然曰便請師云居士適來道暫借山僧四大為坐榻祇如山僧四大本空五陰非有居士向甚麼處坐士不能答遂留玉帶師却贈以雲山衲衣士乃作偈曰百千燈作一燈光盡是恆沙妙法王是故東坡不敢惜借君四大作禪床病骨難堪玉帶圍鈍根仍落箭鋒機會當乞食歌姬院奪得雲山舊衲衣此帶閲人如傳舍流傳到我亦悠哉錦袍錯落猶相稱乞與佯狂老萬回裴休納笏黃蘗弟子禪林類聚十七石霜諸禪師裴相國來師拈起裴笏問在天子手中為圭在老僧手中且道喚作甚麼裴無對師乃留下笏舜老民衣洞山聰法嗣僧寶傳中雲居舜老夫住棲賢郡將貪墨師不忍以常住物結情固位尋有讚於郡將民其衣乃寓太平庵仁廟聞其道行復以僧服寵銀鉢盂再領棲賢入院有偈曰無端被讚枉遭迍半載有餘作俗人今日再歸三峽寺幾多道好幾多嗔芙蓉束髮投子青法嗣僧寶傳中和補曰芙蓉道揩禪師大觀元年開封尹李孝壽奏楷道行卓冠叢林宜有以褒顯即賜紫伽梨號定照禪師云云後遭罪著縫掖束髮楷焚香謝恩罷上表辭之曰伏蒙聖慈特差彰善閣祗候談𧜖賜臣定照禪師號及紫衣牒一道臣感戴睿恩已即時焚香升座仰祝聖壽訖伏念臣行業迂疏道力綿薄常發誓願不受利名堅持此意積有歲年庶幾如此傳道後來使人專意佛法令雖蒙吳恩若遂忝冒則臣自違素願何以教人豈能仰稱陛下所以命臣住持之意所有前件恩牒不敢祗受伏聖慈察臣微悃非敢飾詞特賜俞𠃔臣沒齒行道上報天恩下下聞之以付李孝壽躬往諭朝旌善之意而楷碓然不回開封尹具以聞上怒以付有司有司知楷忠誠而適犯天威問曰長老枯悴有乎楷曰平日有疾今實無又曰言有疾即於免罪譴楷曰豈敢僥幸而求脫罪譴乎吏太息於受罰著縫掖編管溜州都成道俗見者流思大吞佛北齊惠文弟子會元二寶志令人傳語與思大曰何不下山教化衆生目視雲漢作甚麼師曰三世諸佛被我一口吞盡有何衆生可度大士講經傳燈草七梁武帝請傅大士講金剛經大士才升座以尺揮案一下便下座武帝愕然志公問陛下還會麼帝云不會志公云大士講經竟老盧幡動會元七六祖自傳衣之後至儀鳳初屆南海遇印宗法師於法性寺講涅槃經祖寓止廊廡間因風揚剎竿幡動聞二僧對論一云幡動一云風動往復數回曾未契證祖云可容俗士預高論不僧曰試為說看祖云不是風動不是幡動仁者心動僧於言下大悟印宗竊聆此語竦然異之僧伽鈴鳴會元十一伽耶舍多初見十七祖僧伽難提時持一寶鑑趨迎於前難提問云汝持圓鑑意欲何為舍多童子乃以偈答曰諸佛大圓鑑內外無瑕翳兩人同得見心眼皆相似父母以其與難提應對有異遂使之出家難提受之携還精舍他日風撼其殿之銅鈴鐺然發聲復問曰鈴鳴乎風鳴耶答曰非風非鈴我心鳴爾麻谷振錫馬祖法嗣傳燈五麻谷持錫到章敬繞禪床三匝振錫一下卓然而立敬云是是麻谷又到南泉繞禪床三匝振錫一下卓然而立泉云不是不是麻谷云當時章敬道是和尚為什麼道不是泉云章敬即是是你不是此是風力所轉終成敗壞普化搖鈴傳燈十鎮州普化和尚者不知何許人也師事盤山密受真訣而佯狂出言無度暨盤山順世乃於此地行化或城中或冢間振一鐸曰明頭來明頭打暗頭來暗頭打四方八面來旋風打虗空來連架打一日臨濟令僧捉住曰總不恁麼來時如何師拓開云來日大悲院裡有齊僧回舉似濟濟曰我從來疑著這漢凡見人無高下皆振鐸一聲時號普化和尚或將鐸就人耳邊振之或拊其背有回顧者即展手曰乞我一錢師嘗於闤闠間搖鐸唱云覔箇去處不可得時道吾遇之把住問曰汝擬去甚處師曰汝從甚麼處吾無語師製手便去隱山晦迹馬祖法嗣傳燈八潭州龍山禪師亦名隱山洞山價禪師初遊方與密伯師者偕行經長沙龍山之下見溪流菜葉價回瞻峯巒深透謂密曰箇中必有隱者乃並溪而進十許里有老僧癯甚以手加額呼曰此間無路汝輩何自而至價曰無路且置庵主自何而入曰我不曾雲水價曰庵主住山幾計時曰春秋不涉價曰庵主先住耶曰不知價曰為什麼不知曰我不曾人天來價曰得何道理便爾住山曰我見泥牛鬪入海直至而今無消息價即班密之下而拜之問如何是主中賓曰青山覆白雲又問如何是主中主曰長年不出戶又問主賓相去幾何曰長江水上波又問賓主相見有何言說曰清風拂白月價再拜求依止老僧笑云三間茆屋從來住一道神光萬境間莫作是非來辨我浮生穿鑿不相關於是自焚其庵深入層峯洞山除名曇晟法嗣傳燈十五洞山將圓寂謂衆云吾間名世誰為吾除得衆皆無對時沙彌出曰請和尚法號師曰吾間名已謝盧陵米價會元五青原僧問如何是佛法大意師云盧陵米作什麼價偃溪水聲會元七玄沙因鏡清來參問學人乍入叢林乞師指箇入處沙云還聞偃溪水聲麼清云聞沙云從者裏入清忽大悟大士側坐雙林傳云善惠大士受武帝請於重雲殿講三惠般若王公貴人或見大士坐不正問曰何不正坐答曰正人無正性側人無側心道者橫行德山遠法嗣會元十五廬山開先善暹禪師臨江軍人也操行清苦遍游師席以明悟為志參德山見山上堂顧視大衆曰師子嚬呻象王回顧師忽有省入室陳所解山曰子作麼生會師回顧曰後園驢喫草山然之後至雪豆豆與語喜其超邁目曰海上橫行暹道者遂命分座四方英衲敬異之智岩懸囊牛頭融法嗣會元二牛頭山智岩禪師者曲河人也姓華氏弱冠智勇過人身長七尺六寸隋大業中為郎將常以弓挂漉濾水囊隨行所至汲用纍從大將往討頻立戰功唐武德中年四十遂乞出家惠忠掛鐺牛頭智威嗣會元二惠忠禪師平生一衲一鐺常有供僧穀兩廩三虎為之守靈異甚夥度人亦甚衆佛日豆𪹼雲居膺法嗣傳燈二十佛日禪師參夾山山問什麼處來師曰雲居來山曰即今在什麼處師云在夾山頂上山曰老僧行年在坎五鬼臨身師上階禮拜山問闍梨與什麼人同行師云木上坐山曰何不來相看師云和尚看他有分山曰在什麼處師云在堂中山相共下堂師乃取拄杖擲山前曰莫從天台得來否師云非五嶽之所生山曰莫從須彌山得來否師云月宮亦不逢山曰恁麼即從人得也師曰自己尚是冤家從人得堪作什麼山曰冷灰裏有一粒豆𪹼喚維那來明窗下安排著典座蟲生傳燈十五石霜諸禪師初造大溈願藉名役作勤勞杵臼間甚久祐見之簸處曰檀信物不可拋撒曰不敢祐俯拾得一粒曰此非拋撒者耶師擬對之祐曰勿輕此一粒百千粒從此粒生曰即如是此粒從何生乎祐為大笑明日升座曰大衆米裡有蟲惠可了了傳燈三初祖初居少林寺九年為惠可說法祇教曰外息諸緣內心無喘心如墻壁可以入道師種種說心性理道未契祖祇遮其非不為說無念心體師云我已息諸緣祖曰莫不成斷滅去否師云不成斷滅祖云何以驗之去不斷滅師曰了了常知故言之不可及祖云此是諸佛所傳心體更勿疑也瑞岩惺惺台州瑞岩彥禪師一生常坐喚主人公復自應諾乃云惺惺著向後莫被人欺瞞後有僧到玄沙舉似沙云一等是精靈也甚奇怪沙復云何不且在彼中僧云已遷化了沙云而今喚應否僧無對沙云蒼天蒼天慈道罐破文悅盆傾大愚守芝嗣僧寶傳下雲峯文悅禪師坐後架架下東破桶盆自架而墮忽開悟頓見芝從前用處走搭伽梨上𥨊堂芝迎笑云維那且喜大事了畢師再拜汗下不及吐一詞而去服勤八年官人千衆惠安單丁清凉十願華嚴第四之祖和補曰清凉國師澄觀字大休會稽人姓夏侯氏即以十事自勵曰休不損沙門之表心不違如來之制坐不背法界之經性不染情礙之境足不履尼寺之塵脅不觸居士之榻目不視非義之綵舌不味過午之肴手不釋圓明之珠宿不離衣鉢之側云云見六學僧傳達磨四行傳燈三十達磨大師略辨大乘入道四行夫入道多途要而言之不出二種一是理入二是行入理入者謂藉教悟宗深信含生同一真性但為客塵妄想所覆不能顯了若也捨妄歸真凝住壁觀無自無他凡聖等一堅住不移更不隨於文教此即與理冥符無有分別寂然無為名之理入行入者謂四行其餘諸行悉入此中何等四耶一報冤行二隨緣行三無所求行四稱法之行云何報冤行謂修道行人若受苦時當自念言我從往昔無數劫中棄本從末流浪諸有多起冤憎違害無限今雖無犯是我宿殃惡業果熟非天非人所能見知甘心忍受都無冤訴經云逢苦不受何以故識達故此心生時與理相應體冤進道故說言報冤行二隨緣行者衆生無我並緣業所傳苦樂齊受皆從緣生若得勝報榮譽等事是我過去宿因所感今方得之緣盡還無何喜之有得失從緣心無增減真風不動冥順於道是故說言隨緣行也三無所求行者世人長迷處處貪著名之為求智者悟真理將俗反安心無為形隨運轉萬有斯空無所願樂功德黑暗常相隨逐三界久居猶如火宅有身皆苦誰得而安了達此處故舍諸有息想無求經云有求皆苦無求乃樂判知無求真為道行故言無所求行也四稱法行者性淨之理目之為法此理衆相斯空無染無著無此無彼經云法無衆生離衆生垢故法無有我離我垢故智者若能信解此理應當稱法而行法體無慳於身命財行檀捨施心無吝惜達解三空不倚不著但為去垢稱化衆生而不取相此為自行復能利他亦能莊嚴菩提之道檀施既爾餘五亦然為除妄想修行六度而無所行是為稱法行長髭功德傳燈十四長髫曠禪師初參石頭頭問甚麼處來曰大庾嶺頭來曰嶺頭一鋪功德成就也未曰成就了只缺點眼曰莫點眼否曰便請石頭垂下一足師便禮拜曰見什麼道理禮拜曰如紅爐一點雪黃梅佛性傳燈十三五祖大滿禪師因有一居士姓盧名惠能自蘄州來參師云汝自何來曰嶺南師曰欲須何事曰唯求作佛師云嶺南人無佛性若為得佛曰人有南北佛性豈然師知是異人乃呵曰著槽廠去能禮足而退便入於杵臼之間服勞善財採藥會元二文殊令善財採藥云是藥採將來善財拈起一枝草度與文殊文殊接得示衆云此藥亦能殺人亦能活人大慈識病百丈法嗣會元四杭州大慈寰中禪師示衆云山僧不解答話只是識病時有僧出師便歸方丈馬祖展足傳燈八鄧隱峯一日推車次馬祖展腳在路上坐峯云請師收足祖云已展不縮峯云已進不退乃推車碾損祖腳祖歸法堂執斧子云適來碾損老僧腳底出來峯便出於祖前引頸祖乃置斧大覺引頸禪林類聚十七和補曰魏府大覺禪師僧問學人仗鏌鎁劒擬取師頭時如何師便引頸僧云斬便打露祐踢瓶會元九百丈海禪師因司馬頭陀自湖南來謂丈曰頃在湖南尋得一山名大溈是一千五百人善知識所居之處丈曰老僧住得否陀曰非和尚所居丈曰何也陀曰和尚是骨人彼是肉山居徒不盈千丈曰吾衆中莫有人住得否陀曰待歷觀之時華林覺為第一座丈令侍者請至問曰此人如何陀請謦咳一聲行數步陀曰不可丈又令喚靈祐禪師師時為典座陀一見乃曰此正是溈山主人也丈是夜召師入室囑曰吾化緣在此溈山勝境汝當居之嗣續吾宗廣度後學而華林聞之曰某甲恭居上首典座何得住持丈曰若能對衆下得一語出格當與住持即指淨瓶問曰不得喚作淨瓶汝喚作什麼林曰不可喚作木揬也丈乃問師師踢倒淨瓶便出去丈笑曰第一座輸却山子也師遂往焉是山峭絶敻無人煙猿猱為伍橡栗充食經于五七載絶無來者師自念言我本住持為利益於人既絶往還自善何濟即捨庵而欲他往行至山口見蛇虎狼豹交橫在路師云汝等諸獸不用攔吾行路吾若於此山有緣汝等各自散去吾若無緣汝等不用動吾從路過一任喫言訖蟲虎四散去師乃回庵未及一載安上座即懶安也同數僧從百丈來輔佐於師安曰某與和尚作典座待僧及五百人不論時節即不造粥便放某甲下自後山下居民稍稍知之率衆共營梵字連師李景讓奏號同慶寺相國裴公休嘗咨玄奧繇是天下禪學輻輳焉寂子撲鏡仰山名惠寂傳燈十一仰山因溈山送一面鏡來接得上堂云且道是溈山鏡仰山鏡若道是溈山又在仰山手裡若道是仰山底又是溈山送來道得即不打破道不得即打破三問衆無對遂撲破悟本钁頭曇晟之法嗣會元十三洞山與密師佰鉏茶園師擲下钁頭曰我今日一點氣力也無密曰若無氣力爭解恁麼道師曰汝將謂有氣力底是烏臼杓柄馬祖法嗣會元三烏臼和尚問僧近離甚處曰定州師云定州悟道何似這裡曰不別師云若不別更轉彼中去便打僧曰棒頭有眼不得草草打人師云今日打著一箇也打三下僧便出去師云屈棒元來有人喫在曰爭奈杓柄在和尚手裏師云汝若要山僧回與汝僧近前奪棒打師三下師曰屈棒屈棒曰有人喫在師曰草草打著箇漢僧禮拜師云却與麼去也僧大笑而出師曰消得恁麼良禪破關傳燈十七良禪客問欽山一鏃破三關時如何山曰放出關中主看良云恁麼則知過必改山云更待何時良云好箭放著所在便出山云且來闍梨良回首山把住云一鏃破三關即且止試與欽山發箭看良擬議山打七棒云且聽這漢疑三十年女子出定會元一諸佛要集經文殊尸利欲見佛集不能得到諸佛各還本處文殊尸利到諸佛集處有一女人近彼佛坐入三昧文殊尸利入禮佛足已白佛言云何此女人得近佛坐而我不得佛告文殊尸梨汝覺此女人令從三昧起汝自問之文殊尸梨即彈指覺之而不可覺以大聲喚亦不可覺投手牽亦不可覺又以禪足動三千大千世界猶亦不覺文殊尸利白佛言我不令覺是時佛放大光明照下方世界是中有一菩薩名棄諸蓋即時從下方來到佛所頭面禮足一面而立佛告棄諸蓋菩薩汝覺此女人即時彈指此女從三昧起文殊尸利白佛以何因緣我動三千大千世界不能令此女起棄諸蓋菩薩一彈指便從三昧起佛告文殊尸利汝因此女初發阿耨多羅三藐三菩提是女人因棄諸蓋菩薩發阿耨多羅三藐三菩提以是故汝不能令覺頌家謂綱明菩薩乃傳燈録所載未詳按何經論撿藏乘不見所出祖庭事苑文名也曇照呌苦南泉法嗣會元四荊南白馬曇照禪師常云快活快活及臨終呌苦苦閻羅老子來取我也院主問曰和尚當時被節度使拋向水中神色不動如今何得恁麼地師舉枕子云汝道當時是如今是院主無對亡僧索命聯燈五鹽官會下有一主事僧將死鬼使來取僧告曰某甲身為主事未暇修行乞容七日得否使曰待為白王若許即七日後來不然須臾便至言訖去至七日後方來覔其僧不見後有人舉問一僧若來時如何擬抵他洞山代云被他覔得也大容林蟬古德爛杏禪林類聚十七僧問白兆和尚如何是萬行兆云今年桃核也無說什麼爛杏翠岩把梢慈明法嗣林間録下和補曰福州海善侍者慈明高弟當時龍象數道吾真楊岐會然皆推服之嘗至金鑾真點胸云云開法於翠岩嘗曰天下佛法如一隻船大寧道寬師兄坐頭南褊頭在其中可真把梢去東也由我去西也由我善公尋還七閩云云風穴據令石鞏趂鹿會元三石鞏昔為戈者因逐群鹿從馬祖庵前過問祖曰和尚見鹿過不祖匿曰汝是何人曰獵者祖曰汝解射曰解射祖曰汝一箭射幾箇曰一箭射一箇祖曰汝不解射曰和尚莫解射不祖曰解射曰一箭射幾箇曰一箭射一群曰彼此是命何用射他一群祖曰汝既知如是何不自射曰若教某甲自射直是無下手處祖曰者漢曠却無明煩惱今日頓息師即毀弓箭截髮投祖出家南泉斬猫傳燈八南泉一日東西兩堂爭猫兒師見提起云道得即不斬衆無對師斬猫兒為兩段祇林揮劒永泰湍法嗣湖南祇林和尚每叱文殊普賢皆為精魅手持木劒自謂降魔才有僧參禮便云魔來也魔來也以劒亂揮歸方丈如是十二年後置劒無言僧問十二年前為甚麼降魔師云賊不打貧兒家十二年後為甚麼不降魔師曰賊不打貧兒家藥嶠抽刀石頭法嗣會元五藥山與雲岩遊山腰間刀響岩問甚麼物作聲師抽刀驀口作斫勢實際頂笠馬祖法嗣務州金華俱胝禪師初住菴有尼名實際到菴戴笠子執錫繞師三匝云道得即拈下笠子三問師皆無對尼便去師云日勢稍晚且留一宿尼曰道得即宿師又無對尼去惠圓腰包惠圓上坐開封酸棗于氏子世業農少依邑之建福寺德光為師性椎魯然勤渠祖道堅坐不臥居數歲得度出游廬山至東林寺每以己事請問朋輩見其㒵陋舉止乖踈皆戲侮之一日行殿庭中忽足顛而仆了然開悟作偈俾行者書於壁曰這一交這一交萬兩黃金也合消頭上笠腰下包清風明月杖頭挑即日離東林衆傳至照覺覺大喜曰衲子參究若此善不可加令人迹其所往竟無知者照覺東林寺長老上座鼻孔鼓山問孚上座父母未生前鼻孔在甚麼處孚云師兄先道山云只今生也鼻孔在甚麼處孚不肯山云你作麼生孚云將手中扇來山以扇度與之再問孚點置之山遂打一拳翠岩眉毛雪峯存法嗣會元八翠岩夏末示衆云一夏已來為兄弟說話看翠岩眉毛在麼杉山拈尺禪林類聚十七杉山禪師一日與龐居士坐次師拈起尺子云居士還見麼士云見師云見箇什麼士杉山師云不得道著云爭得不道師拋下尺子居士云有頭無尾得憎師云不是者老子今日還道不及什麼處師云有頭無尾處士云強中覔弱即得弱中覔強即無師把住云這老漢就中無活處無活處義存斫槽會元七洞山一日問雪峯作甚麼來峯曰斫槽來山曰幾斧斫成峯曰一斧斫成山曰猶是這邊事那邊事作麼生峯休去汾陽代云某甲且囷也座主鬼窟傳燈十六鹽官因有講僧來參師問云坐主蘊何事業對云講華嚴經師云有幾種法界對云廣說則重重無盡略說則有四種法界師竪起拂子云遮箇是第幾種法界坐主沈吟徐思其對師云思而知慮而解是鬼家活計日下孤燈果然失照果然失照夾嶺鳳巢龍潭信法嗣傳燈十六澧州樂普山元安禪師至夾山庵于冢巔夾山訝之以書抵安誡使者曰此僧得書不發明日當來發之不來也安得書果置之不答使者具以告夾山夾山曰旦暮必至矣俄報安至夾山望見呵曰雞棲鳳巢非其同類出去安乃問曰自遠趨風請師一接夾山曰目前無闍梨此間無老僧安曰錯夾山曰住住且莫草草忩忩雲月是同溪山各異截斷天下舌頭則不無闍梨爭救無舌人解語乎安茫然不知答夾山以杖擊之安因茲服膺數歲泐潭苦瓜龍潭信法嗣傳燈十五洪州泐潭寶峯和尚有僧新到師謂曰其中事即易不落其中事始終難道僧曰某甲在途時便知有此一問師曰更與二十年行腳也不較多曰莫不契和尚意麼師云苦瓜那堪待客香林甜桃義玄拄钁傳燈十一臨濟普請鋤地次見黃蘗來拄钁而立蘗云這漢困那師云钁也未舉困箇什麼蘗便打師接住棒一送送倒蘗喚維那維那扶起我維那近前扶云和尚爭容得這風顛漢無禮蘗才起打維那師钁地云諸方火葬我這裡一時活埋惠寂插鍬傳燈十一溈山忽問仰山甚麼處來仰曰田中來溈曰田中多少人仰插鍬而立溈曰今日南山大有人刈茆仰舉鍬而去靈源真告黃龍祖心法嗣普燈六黃龍佛壽禪師名惟清字覺天號靈源叟臨終前十日自作無生常住真歸告銘曰賢劫第四尊釋迦文佛直下第四十八世孫惟清雖從本覺應緣出生而了緣即空初無自性氏旌親里莫得而詳但以正因一念為所宗承是廁釋迦之遠孫其號靈源叟據自了因所了妙性無名字中示稱謂耳爾臨濟無位真人傅大士之心王類矣亦正法眼藏涅槃妙心唯證乃知餘莫能測者歟所以六祖問讓和尚什麼處來曰嵩山來祖曰什麼物恁麼來曰說似一物即不中祖曰還假修證否曰修證即不無污染即不得祖曰即此不污染是諸佛之所護念汝既如是吾亦如是茲蓋獨摽清淨法身以遵教外別傳之宗而揀云報化非真佛亦非說法者然非無報化大功大用謂若解通報化而不頓見法身則滯污染緣乖護念旨理必警省耳夫少室道行光騰後裔則有雲門偃奮雄音絶唱於國中臨濟玄振大用大機於天下皆得正傳世咸宗奉惟清望臨濟九世孫也今宗教衰喪其未盡絶滅者唯二家微派斑斑有焉然名多愧實顧適當危奇而朝露身緣勢迫晞墜因力病釋俗從真敘如上事以授二三子吾委真後當用依稟觀究即不違先聖法門而自見深益慎勿隨末法所尚乞空文於有位求為銘志張飾說以浼吾至囑至囑因自所敘曰無生常住真歸告且繫之以銘銘曰無涯湛海瞥起一漚亘乎百年曷浮曷休廣莫清漢歘生片雲有無起滅隱顯何分了茲二者即見實相十世古今始終現量吾銘此旨昭告汝曹泥多佛大水長船高玄泰山謠石霜諸法嗣傳燈十六泰南衲所居蘭若在衡山之東號七寶臺誓不立門徒四方後進依附皆用交友之禮嘗以衡山多被山民斬木燒為害滋甚乃作畬山謠遠邇傳播達于九重有詔禁止故嶽中蘭若無復延燎師之力也畬山謠畬山兒無所知年年斫斷青山嵋就中最好衡嶽色杉松利斧摧貞枝靈禽野鶴無因依白雲回避青煙飛猿猱路絶岩崖出芝术失根茆草肥年年斫罷仍栽鋤千秋終是難復初又道今年種不多來年更斫當陽坡國家壽嶽當如此不知此理如之何紹銑設館北禪賢法嗣僧寶中潭州奧化紹銑禪師時南禪師道價方增荊湖衲子奔趍入江南者出長沙百里無託宿所多為盜劫掠路因不通師半五十為館請僧主之以接納使得宿食而去諸方高其為人福國戕橋六祖負金傳燈五江西志徹禪師者江西人也姓張氏名行昌少任俠自南北分化二宗主雖亡彼我而徒侶競起愛憎時北宗門人自立秀師為第六祖而忌能大師傳衣為天下所聞然祖是菩薩預知其事即置金十兩於方丈時行昌受北宗門人之囑懷刃入祖室將欲加害祖舒頸而就行昌揮刃者三都無所損祖曰正劒不邪邪劒不正只負汝金不負汝命行昌驚仆久而方蘇求哀悔過即願出家祖遂與金云汝且去恐徒衆翻害於汝汝可他日易形而來吾當攝受行昌稟旨宵遁終捉僧出家具戒精進一日憶祖之言遠來禮勤問答機緣相契祖曰汝今徹也宜名志徹師禮謝而去神光償債會元一二祖者武牢人也姓姬氏父寂未有子時嘗自念言我家崇善豈令無子禱之既久一夕感異光照室其母因而懷妊及長遂以照室之瑞名之曰光自幼志氣不群博涉詩書尤精玄理而不事家産好遊山水後覽佛書超然自得即抵洛陽龍門香山依室靜禪師出家受具於永穆寺浮游講肆遍學大小乘義年三十二却返香山終日宴坐又經八載於寂默中倐見一神人謂曰將欲受果何滯此耶大道匪遙汝南矣祖知神助因改名神光翌日覺頭痛如刺其師欲治之空中有聲曰此乃換骨非常痛也祖遂以見神事白于師師視其頂骨即如五峯秀出矣乃曰汝相吉祥當有所證神令汝南者斯則少林達磨大士必汝之師也祖受教造于少室達磨遂因與易名曰惠可傳授之後於管城縣匡救寺之三門談無上道聽者林會時辨和法師於其寺講涅槃經其徒聞師闡法稍稍引去和不勝其憤乃興謗于邑寄翟仲侃侃惑其說加師以非法債師以怡然委順識真者謂之償債皓月供奉問長沙岑云了即業障本來空未了應須償宿債師子尊者二祖大師為甚麼却償債岑云大德不識本來空如何是本來空云業障是如何是業障是云本來空是供奉無語長沙乃示偈云假有元非有假滅亦非無涅槃償債義一性更無殊洛浦投師傳燈十六見前夾嶺鳳巢之處和補曰會元第六云師游歷罷直往夾山卓庵經年不訪夾山山乃修書令僧馳往師接得便坐却再展手索僧無對師便打曰歸去舉似和上僧回舉似山曰這僧若開書三日內必來若不開書斯人救不救也師果三日後到見夾山不禮拜乃當面叉手而立山曰雞栖鳳巢非其同類出去自遠趨風請師一接山曰目前無闍梨此間無老僧師便喝山曰住住且莫草草忩忩雲月是同溪山各異沙彌求戒傳燈十四高沙彌初參藥山山問甚麼處來曰南嶽來山云何處去曰江陵受戒去山云受戒圖箇甚麼曰圖免生死曰有一人不受戒亦免生死汝還知否曰恁麼則佛戒何用山曰猶掛唇齒在便召維那云者跛腳沙彌不任僧務安排向後庵著山謂道吾雲岩曰適來一箇沙彌却有來由道吾曰也須勘過始得山乃再問諦云見說長安甚閙曰我國晏然山曰汝徒看經得請益得曰總不與麼山曰大有人不與麼不得曰不道他無只是不肯承當蔣山三障慈明圓法嗣傳燈草三舒王初丁大母夫人憂讀經山中與蔣山贊元禪師游如昆弟問祖師意旨師不答王益扣之師曰公般若有障三有近道之質一更一兩生來恐純熟王曰願聞其說師云公受氣剛大世緣深以剛大氣遭深世緣必以身任天下之重懷經濟之志用舍不能必則心未平以未平之心持經世之志何時能一念萬年哉一又多怒二而學問尚理於道為所知愚三此其三也特視名利如脫髮有擔薄如頭陀此為近道且當以教乘滋茂之可也王再拜受教華藏四㝵鎮州蘿蔔會元四僧問趙州承聞和尚親見南泉是否州曰鎮州出大蘿蔔頭普化生菜傳燈十普化一日在僧堂前喫生菜臨濟見云大似一頭驢普化便作驢鳴濟云這賊普化云賊賊便出去永嘉一宿會元二溫州玄覺禪師詣曹溪初到振錫携瓶繞祖三匝卓然而立祖曰夫沙門者具三千威儀八萬細行大德自何方而來生大我慢師云生死事大無常迅速祖曰何不體取無生了無速乎云體即無生了本無速祖曰如是如是于時大衆愕然師方具威儀參禮須臾告辭祖曰返太速乎師云本自非動豈有速耶祖曰汝甚得無生之意師曰無生豈有意耶祖曰無意誰當分別師云分別亦非意祖歎曰善哉善哉少留一宿時謂之一宿覺翌日回永嘉雲蓋半載石霜諸法嗣會元六潭州雲蓋山志元圓淨禪師遊方時問雲居曰志元不奈何時如何居曰祇為闍梨功力不到師不禮拜直造石霜亦如前問霜云非但闍梨老僧亦不奈何師云和尚為甚麼不奈何霜曰老僧若奈何拈過汝不奈何師便禮拜僧問石霜萬戶俱閉即不問萬戶俱開時如何霜云堂中事作麼生僧無對經半年方始下一點語曰無人接得渠師去乃禮拜乞為舉霜不肯師乃抱霜上方丈曰和尚若不道打和尚去在霜曰得在師頻禮拜霜曰無人識得渠師於言下頓省王嶽四玄溈仰三昧人天眼目朗州古堤和尚仰山到參堤曰去汝無佛性山叉手近前三步應諾堤笑曰子甚麼處得此三昧來山曰我從耽源處得名溈山處得地堤曰莫是溈山的子麼山曰世諦即不無佛法即不敢山却問和尚從甚處得此三昧堤曰我從章敬處得此三昧山歎曰不可思議來者難為湊伯義海仰山坐次有僧來作禮山不顧其僧乃問師識字否山曰隨分僧右旋一匝曰是甚麼字山於地上書十字酬之僧又左旋一匝曰是甚麼字山改十字作字僧乃劃此相以兩手拓如修羅掌日月勢曰是甚麼字山乃劃此卍相對之僧乃作婁至德勢山曰如是如是此是諸佛之所護念汝亦如是吾亦如是善自護持其僧禮謝騰空而去時有一道者見經五日後遂問山山曰汝還見否道者曰某甲見出門騰空而去山曰此是西天羅漢故來探吾道道者曰某雖覩此三昧不辨其理山曰吾以義為汝解釋此是八種三昧是覺海變為義海躰則同然此義合有因有果即時異時總別不離隱身三昧也桐峯虎聲臨濟法嗣傳燈僧到桐峯主處便問這裡忽逢大蟲時又作麼生庵主作虎聲僧作怕勢庵主呵呵大笑僧云這老賊庵主云爭奈老僧何僧便休去投子牛在舒州投子山大同禪師因一婆上山云家中失却牛請師一卜師召婆婆應諾師云牛在婆乃歡喜而去鏡清失利雪峰法嗣會元七越州鏡清寺道怤順德禪師新到參師拈起拂子僧曰久響鏡清猶有這箇在師曰鏡清今日失利師問荷玉甚處來曰天台來師曰阿誰問汝天台曰和尚何得龍頭蛇尾師云鏡清今日失利師看經次僧問和尚看甚麼經師云我與古人鬪百草師却問汝會麼曰少年也曾恁麼來師云如今作麼生僧舉拳師云我輸汝也問辨不得提不起時如何師曰爭得到這裏曰恁麼則禮拜去也師云鏡清今日失利師見僧學書乃問學甚麼書曰請和尚鑑師云一點未分三分著地曰今日又似遇人又似不遇人師云鏡清今日失利問新年頭還有佛法也無師曰有曰如何是新年頭佛法師云元正啓祚萬物咸新曰謝師答話師曰鏡清今日失利上堂衆集定師拋下拄杖曰大衆動著也二十棒不動著也二十棒時有僧出拈得頭上戴出去師曰鏡清今日失利趙州下載會元四趙州上堂兄弟若從南方來者即與下載若從北方來者即與上載所以道近上人問道即失近下人問道即得道歸宗插標禪林類聚十八和補曰歸宗常禪師因普請入園取菜乃畫一圓相圍却一株菜以標插之語首座大衆云輒不得動著每人下一轉語來是時一衆各呈見解未嘗有契師以棒趂云這一隊漢無一箇有智惠喫欲我多少菜不能與圓頭出氣乃蹈倒標子拽著菜而歸興化擲拐會元四興化到法堂令維那聲鐘集衆師云還識老僧麼衆無對師擲下拐子端然而逝清豁歸山泉州睡龍溥禪師嗣傳燈二十三漳州保福院清豁禪師將順世捨衆欲入山待滅過苧溪石橋乃遺偈曰世人休說路行難鳥道羊腸咫尺間珍重苧溪溪畔水汝歸滄海我歸山即往貴湖卓庵未幾謂門人曰吾滅後將遺躰施諸蟲蟻勿置墳塔言訖潛入湖頭山坐盤石儼然長往弟子戒因入山尋見稟遺命延留七日竟無蟲蟻之所侵食遂就闍維散於林野今泉州開元寺淨土院影堂存焉性空沒海黃龍怨梧禪師嗣普燈十蜀僧普首座自號性空菴主因欲泛海辭別緇素而說偈言坐脫立亡不若水葬一省柴燒一免開擴撒手便行不妨懌暢誰是智音船子和尚高風難繼百千年一曲漁歌少人唱由是登漆盆張布帆舉手以謝四衆乃吹鐵笛至洪波中而自沒矣三日後潮退於沙洲上跏趺而坐神色不動道友幾萬人迎歸青龍供養五日荼毗舍利五色如珠無數雙鸖盤旋竟日火盡而去黃龍三關會元十七黃龍室中常問僧曰人人盡有生緣上座生緣在何處正當問答交鋒却復伸手曰我手何似佛手又問諸方參請宗師所得却復垂腳曰我腳何似驢腳三十餘年示此三問學者莫有契其旨脫有酬者師未嘗可否斂目危坐人莫測其意延之又問其故師云已過關者掉臂徑往安知有關吏問可否此未透關者也叢林目之為黃龍三關師自頌曰生緣有語人皆識水母何曾離得蝦但見日頭東畔上誰能更喫趙州茶我手佛手兼舉禪人直下薦取不動干戈道出當處超佛越祖我腳驢腳並行步步蹈著無生會得雲收月卷方知此道縱橫總頌曰生緣斷處伸驢腳驢腳伸時佛手開為報五湖參學者三關一一透將來浮山九帶人天眼目浮山遠既老退休於會聖嵓因閲斑固九流儒流道流陰陽流法流名流墨流縱橫流離流農流遂擬之作九帶敘佛祖教義博採先德機語參同印證其一曰佛正法眼帶其二曰佛法藏帶其三曰理實帶其四曰事實帶其五曰理事縱橫帶其六曰屈曲帶其七曰妙挾兼帶其八曰金針雙鎖帶其九曰平懷常實帶學者既已傳誦青州正座舒州投子義青禪師青社李氏參浮山嗣洞下宗山遂書偈送曰須彌立虗空日月輔而轉群峯漸倚化白雲方改變少林風起叢曹溪洞簾卷金鳳宿龍巢宸苔豈車輾令依圓通透禪師師至彼無所參問唯嗜睡而已執事白通曰堂中有僧日睡當行規法通曰是誰曰青上座通曰未可待與按過通即曳杖入室見師正睡乃擊床呵曰我這裏無間飯與上坐喫了打眠師云和尚教某何為通曰何不參禪去師云美食不中飽人喫通曰爭奈大有人不肯上座師云待肯堪作甚麼通曰上座曾見甚麼人來師云浮山通曰怪得恁麼頑賴遂握手相笑歸方丈由是道聲籍甚初住白雲次遷投子寺名也普明不拜仁儉短偈傳燈四洛京福先寺仁儉禪師自嵩山罷問放矌郊𨞬時謂之騰騰和尚唐天𠕋間天后詔入內至殿前仰視天后良久曰會麼后曰不會師云老僧持不語戒言訖而出翌日晉短歌十九首天后覽而嘉之永嘉長歌會元二永嘉大師作證道歌泳潘天下西竺謂之震旦聖者經即曹溪末後之旨老龐及第碧巖五龐居士曰十方同聚會箇箇學無為此是選佛場心空及第歸慶諸登科道吾智法嗣禪林類聚十七許州金明上坐曾問石霜一毫穿衆穴時如何師云直須萬年後問萬年後如何師云登科任汝登科萃任汝拔萃後問經山諲云一毫穿衆穴時如何諲曰先靴任汝先靴結褁任汝結褁陳操驗僧傳燈十二陳操尚書與僧齊次忽拈起胡餅問僧曰江西湖南還有這箇麼僧曰尚書適來喫什麼尚書曰敲鐘謝響又一日齊僧次躬行餅僧展手欲接尚書乃縮手僧無語尚書曰果然果然異日問僧曰有箇事與上座商量得麼僧曰合取狗口尚書自摑口曰操罪過僧曰知過必改尚書曰恁麼即乞上座口喫飯又齊僧自行食次曰上坐施食上坐曰三德六味尚書曰錯上座無對真際勘婆傳燈十五臺山有一婆子接待凡有僧問臺山路甚處去婆子云驀直去僧才行婆云好箇師僧又與麼去如是既久游僧傳到趙州州聞得乃云待老僧為汝去勘破州往彼便問臺山路向甚處去婆云驀直去州才行婆云好箇師僧又與麼去州回升座舉示大衆云已為諸人勘破婆子了也道士背坐傳燈草七昔有道流在佛殿前背佛而坐僧曰道士莫背佛道流曰大德本教中道佛身充滿於法界向甚麼處坐得僧無對法眼代云識得汝踈山倒屙傳燈十七香嚴禪師因僧問不慕諸聖不重己靈時如何嚴曰萬機休罷千聖不携踈山在衆作嘔聲曰是何言歟嚴問阿誰衆曰師叔嚴曰不諾老僧那師出云是嚴曰汝莫道得曰道得嚴曰汝試道看曰若教某甲道須還師資禮始得嚴乃下座禮拜躡前問師云何不道肯重不得全嚴曰饒汝恁麼也須三十年倒屙設住山無柴燒近水無水喫分明記取後住踈山果如嚴記至二十七年病愈自云香嚴師兄記我三十年倒屙今少三年每食畢以手抉而吐之以應前記義存漆桶會元七投子指庵前一片石謂雪峯曰三世諸佛總在裏許峯曰須知有不在裡許者子曰不快漆桶投子與雪峯遊龍眠有兩路問那箇是龍眠路子以杖指之峯云東去西去子曰不快漆桶問一槌便就時如何子曰不是性燥漢曰不假一槌時如何子曰不快漆桶問此間還有人參也無子將钁頭拋向峯面前峯曰恁麼則當處掘去也子曰不快漆桶雪峯上堂盡大地撮來如粟米粒大拋向面前漆桶不會打鼓普請看長慶問雲門曰雪峯與麼道還有出頭不得處麼門曰有曰作麼生門曰不可總作野狐精見解又曰狼籍不少師備飯籮和補曰禪林類聚云玄沙備禪師因雪峯垂語云飯籮邊坐餓死漢臨河渴死漢師云飯籮裡坐餓死漢水裡沒頭浸渴死漢安國折筯玄沙法嗣傳燈草一福州安國院惠球寂照禪師亦曰中塔上堂我此間粥飯因緣各兄弟舉唱終是不常欲得省要却是山河大地與汝發明其道現常亦能究竟若從文殊門入者一切無為土木瓦礫助汝發機若從觀音門入者一切音響蝦蟇蚯蚓助汝發機若從普賢門入者不動步而到以此三門方便示汝如將一隻折著攪大海水令彼魚龍知水為命會麼若無智眼而審諦之任汝百般巧妙不為究竟鹿門破鍋雲岩出糞會元五藥山問雲岩作什麼岩云擔屎山曰那箇聻岩曰在師曰汝來去為誰曰替他東西岩曰何不教並行曰和尚莫謗他岩曰不合恁麼道曰如何是道岩曰還曾擔麼寂子擔禾傳燈十一溈山問仰山何處來仰云田中來溈曰禾好刈也未仰云好刈也溈曰作青見作黃見作不青不黃見仰云和尚背後是什麼溈曰子還見麼仰拈起禾穗云和尚何曾問這箇溈曰此是鵝王擇乳雲門花欄雲門録僧問雲門如何是清淨法身門云花藥欄陸亘瓶鵝傳燈十陸亘大夫問南泉曰古人瓶中養一鵝鵝漸漸長大出瓶不得如今不得毀瓶不得損鵝和尚作麼生出得泉召曰大夫陸應諾泉曰出也從此開解即禮謝石室蹈碓碧岩三六祖初謁五祖於黃梅法乳相投遂負石於腰以供簸舂之務後僧問臨濟云石室行者蹈碓為什麼忘移却腳濟曰沒溺深坑石室曰善道天目撞羅雲門偃法嗣會元十五和補曰奉先深禪師因同明和尚到淮河見人牽網有魚從網透出師曰明兄俊哉一似箇衲僧相似明曰雖然如是爭如當時不撞入網羅好師曰明兄你缺悟在明至中夜方省雪竇按劒會元十五明州雪豆重顯明覺大師上堂僧問如何吹毛劒師云苦曰還許學人用也無師噓一噓乃曰大衆前共相酬唱也須是箇漢始得若也未有奔流度刃底眼不勞拈出所以道如大火聚近著即燎却面門亦如按大阿寶劒衝前即喪身失命師云大阿橫按祖堂寒千里應須息萬端莫待冷光輕閃爍復曰看看便下座韶山亞戈夾山法嗣會元六洛京韶山寰普禪師遵布衲訪師在山下相見遵問韶山路向甚麼處去師以手指曰嗚那青青黯黯處去遵近前把住曰久響韶山莫便是否師云是即是闍梨有甚麼事遵曰擬伸一問師還答否韶山曰看君不是金牙作爭解彎弓射尉遲遵曰鳳凰直入煙霄去誰怕林間野兒師云當軒𦘕鼓從君擊試展家風似老僧遵曰一句逈超千聖外松蘿不與月輪齊師云饒君直出威音外猶較韶山半月程遵曰過在甚處師曰倜儻之辭時人知有遵曰恁麼則真玉泥中異不撥萬機蓙師云魯般門下徒施巧妙遵曰學人即恁麼未審師意如何師曰玉女夜拋梭織於西舍遵曰莫便是和尚家風也無師曰耕夫製玉漏不是行家作遵曰此猶是文言如何是和尚家風師云橫身當宇宙誰是出頭人遵無語師遂同皈山才人事了師召近前曰闍梨有衝天之氣老僧有入地之謀闍梨橫吞巨海老僧背負須彌闍梨按劒上來老僧掗鎗相待向上一路速道速道遵曰明鏡當臺請師一鑑師云不鑑遵曰為甚不鑑師云水淺無魚徒勞下釣遵無對師便打古靈揩背百丈法嗣會元四福州古靈神讚禪師因受業師問汝離吾在外得何事業讚曰並無事業遂遣執役一日因澡浴命讚去垢讚乃拊背好箇佛堂只是佛不聖其師回首視之讚曰雖然不聖却解放光從諗洗腳會元十一趙州行腳時參臨濟遇濟洗腳次州便問如何是祖師西來意濟曰恰值老僧洗腳州近前作聽勢濟云更要第二杓惡水潑在州便下去青林死蛇洞山價法嗣會元十三青林虔禪師問千差路別如何頓曉師曰足下背驪珠空怨長天月問學人徑往時如何師曰死蛇當大路勸子莫當頭曰當頭者如何師云喪子命根曰不當頭者如何師云亦無回避處曰正當恁麼時如何師云失却也曰向甚麼處去師曰草深無覔處曰和尚也須隄防始得師拊掌曰一等是箇毒氣泐潭活九峯䖍法嗣傳燈十七洪州泐潭明禪師僧問碓摶磨磨不得忘却此意如何師云猛虎口裡活省兒玄沙三病會元七玄沙有時垂語曰諸方老宿盡道接物利生且問汝只如盲聾啞三種病人汝作麼生接若拈槌竪拂他眼且不見共他說話耳又不聞曰復啞若接不得佛法盡無靈驗時有僧出曰三種病人和尚還許商量否師云許汝作麼生商量其僧珍重出師曰不是不是天平兩錯清溪山主洪進法嗣傳燈天平和尚行腳時參西院常云莫道會佛法覔箇舉話人也無一日西院遙見召云從平舉頭西院曰錯平行三兩步西院曰錯平近前西院云適來這兩錯是西院錯是上坐錯平云從西院曰錯平休去水蓮池趙州略彴傳燈十僧問趙州久響趙州石橋到來只見略彴州曰汝只見略彴不見石橋僧云如何是石橋州曰渡驢渡馬大陽錢財會元十三郢州大陽惠堅禪師僧問如何是玄旨師曰壁上挂錢財清平杓索會元五清平和尚僧問如何是大乘師云井索曰如何是小乘師云錢貫問如何是有漏師曰笊篱曰如何是無漏師曰木杓白犬銜書會元三和補曰見下之注青猿洗鉢會元二千歲寶掌和尚中印度人也周威烈十二年丁卯降神受質左手握拳七歲祝髮乃展因名寶掌魏晉間東遊此土入蜀禮普賢留大慈常不食日誦般若等經千餘卷有詠之者曰勞勞玉齒寒似迸岩泉急有時中夜坐階前神鬼泣一日謂衆曰吾有願住世千歲今年六百二十有六故以千歲稱之次遊五臺徙居祝融峯之華嚴黃梅之雙峯廬山之東林尋抵建鄴會達磨入梁師就扣其旨開悟武帝高其臘延入內庭未幾如吳有偈曰梁城遇道師參禪了心地飄零二浙遊更盡佳山水順流東下由千頃至天竺往鄮峯登太白穿鴈蕩盤磚於翠峯七十二庵回赤城憩雲門法華諸暨漁浦赤符大岩等處返飛來接之石竇有行盡支那四百州此中遍稱道人遊之句貞觀十五年也後居浦江之寶嚴與朗禪師友善每通問遣白犬馳往朗亦以青猿為使令故題朗壁曰白犬銜書至青猿洗鉢回師所經處後皆成寶坊顯慶二年正旦手塑一像至九日像成問其徒惠雲曰此肖誰雲曰與和尚無異即澡浴易衣趺坐謂雲曰吾住世已一千七十二年今將謝世聽吾偈曰本來無生死今亦示生死我得去往心他生復來此頃時囑曰吾滅後六十年有僧來取吾骨勿拒言訖而逝入滅五十四年有刺浮長老自雲門至塔所禮曰冀塔洞開少選塔戶果啓其骨連環若黃金浮即持往秦望山建窣堵波奉藏以周威烈丁卯至唐高宗顯慶丁巳考之實一千七十二年抵此土歲歷四百餘僧史皆失載開元中惠雲門人宗一者嘗勒石識之飲光坐禪梵曰迦葉波此言飲光姓也或云身光殊特能飲諸天及日月等光皆悉不見故曰飲光黃龍南譏泉大道怛率戲酬以偈曰飲光論劫坐禪布袋經年落魄疥狗不願生天却笑雲中白鶴和補曰涅槃經云爾時世尊欲涅槃時迦葉不在衆會佛告諸大弟子迦葉來時可令宣揚正法眼藏爾時迦葉在耆闍崛山畢鉢羅窟覩勝光明即入三昧以淨天眼觀見世尊於凞連河側入般涅槃乃告其徒曰如來涅槃也何其駛哉即至雙樹間悲戀號泣布袋落魄會元二和補曰飲光論劫坐禪布袋經年落魄疥狗不願生天却笑雲中白鶴明州奉化縣布袋和尚自稱契此形裁腲脮蹙額皤腹出語無定寢臥隨處常以杖荷一布囊并破廗凡供身之具盡貯囊中入肆聚落見物則乞佛祖統紀云布袋背上有目水戲之時人知之推倒回頭僧寶傳中和補曰下注兼之躍翻不托端師子者吳興人也始見弄師子者發明心要則以綵帛像其皮時時著之因以為號住西余山有狂僧號回頭和尚以左道鼓動流俗士大夫亦安其妄方對丹陽守呂公肉食端徑至指曰正當與麼時如何是佛回頭不能遽對端捶其頭推倒乃行又有夭人號不托掘秀州城外地有佛像建塔其上傾城信敬端見揕住曰如何是佛不托擬議端躍之而去章丞相子厚請舛座使俞秀老撰疏敘其事曰推倒回頭躍翻不托道者休休鏡清在帳中坐有僧問訊師撥帳開曰當斷不斷反招其亂僧曰既是當斷為什麼不斷師云我若盡法直恐無民曰不怕無民請師盡法師云維那拽出此僧著又曰休休我在南方識伊和尚來錢王欲廣府中禪會命居天龍寺始見師乃曰真道人也致禮勤厚由是吳越盛於玄學其後又創龍𠕋寺延請居焉高安白水本仁禪師謂鏡清曰時寒道者清曰不敢仁曰還有臥單也無曰設有亦無展底工夫仁曰直饒道者滴水氷生亦不干他事曰滴水氷生事不相涉仁曰是曰此人意作麼生仁曰此人不落意曰不落意此人聻仁曰高山頂上無可與道者啖也塔主莫莫雲門法嗣會元十五薦福承古禪師因遊廬山登歐峯愛宏覺塔院間寂求居之清規凜然過者肅恭時叢林號古塔主僧問如何是佛主云莫莫又問如何是祖師西來意主曰莫莫大守病痊傳燈草七閭丘台州守也因丘臥病不起或人勸云可見高僧因見豐干於鴈蕩干呪水與丘飲之病了愈君王臂落傳燈二罽賓國王問師子尊者曰師得蘊空不者曰已得曰離生死不者曰已離曰既離生死可施我頭者曰非我有何吝於頭王揮劒斷者頭白乳湧高數尺王臂自墮次公點眼駙馬索藥石門聰弟子會元十二駙馬都尉李遵勗居士臨終時膈胃躁熱有尼道堅謂曰衆生見劫盡大火所燒時都尉切宜照管主人公公曰大師與我煎一服藥來堅無語公曰這師姑藥也不會煎得
