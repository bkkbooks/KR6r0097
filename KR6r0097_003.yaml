body:
  text: 隱峯倒化馬祖法嗣傳燈錄八鄧隱峯將示滅先問眾云諸方遷化坐去臥去吾賞見之還有立化也無眾云有師問還有倒立而化者無眾云未有師乃倒立而化亭亭然其衣順體時眾議舁就茶毗屹然不動遠近瞻視驚歎無已師有妹為尼時亦在彼乃俯近而咄曰老兄疇昔不循法律死更熒惑於人於是以手推之僨然而踣遂就闍維領眾坐亡石霜諸歿時九峰道䖍禪師作侍者眾請堂中第一座嗣諸住持方議次虔犯眾曰未可須明先師意旨乃可耳眾曰先師何意䖍曰只如道古庿香爐一條白練如何會第一座曰是明一色邊事䖍曰果不會先師意於是第一座者起炷香誓曰我若會先師意香煙滅則我脫去不然煙滅不能脫言卒而脫去䖍拊其背曰坐脫立亡不無首座會先師意即未也歸宗拽杖馬祖法嗣皈宗入園取菜次師畫圓相圍却一株語眾曰輙不得動著遮箇眾不敢動少頃師復來見菜猶在便以棒趂眾普化踢床盤山寶積法嗣會元十一臨濟同普化赴施主家齋次濟問毛吞巨海芥納須彌為是神通妙用本體如然化蹈倒飯床濟云太生化云這裏是什麼所在說說細濟來日又同化赴齋問今日供養何似昨日化依前蹈倒飯床濟云得即得太生化云瞎驢佛法說什麼細濟乃吐舌雪峰過嶺會元七雪峯辭洞山山曰子甚處去師曰皈嶺中去山曰當時從甚麼路去師云從飛猿嶺出山曰今回向甚麼路去師曰從飛猿嶺去山曰有一人不從飛猿嶺去子還識麼曰不識山曰為甚麼不識師云他無面目山曰子既不識爭知無面目師無對師甞有頌曰人生倐忽暫須臾浮世那能得久居出嶺始年三十二入閩早是四旬餘他非不用頻頻舉己過應須旋旋除為報滿朝朱紫道閻王不怕佩金魚洛浦還鄉夾山法嗣會元六僧問洛浦學人擬歸鄉時如何師云家破人亡子歸何處曰恁麼則不歸去也師云庭前殘雪日輪消室內游塵遣誰掃乃有偈云決志歸鄉去乘船渡五湖舉篙星月隱停棹日輪孤解離邪岸張帆出正途到來家蕩盡免作屋中愚法遠繡毬葉縣歸省法嗣會元十二僧問浮山師唱誰家曲宗風嗣阿誰師曰八十翁翁輥繡毬僧云與麼則一句逈然開祖胄三玄戈甲振叢林師曰李陵元是漢朝臣文邃香囊洞山价法嗣傳燈七僧問徑山如何是和尚家風師云錦帳銀香囊風吹滿路香鵝湖比較信州鵝湖大義禪師李翱甞問大悲用千手眼作麼師曰今上用公作麼唐憲宗甞詔入內於麟德殿論議有一法師問如何是四諦師曰聖上一帝三帝何在佛日抑揚崇壽登子桂琛法嗣普燈廿一法眼初住臨川崇壽院師指登子曰識得登子周匝有餘雲門云識得登子天地懸殊守芝石幢汾陽昭法嗣會元十二瑞州大愚山守芝禪師陞座僧問如何是城裡佛師曰十字街頭石幢子羅山飯石頭法嗣會元七明招到招慶有度上座問羅山尋常道諸方盡是飯惟有羅山是白飯上座從羅山來却展手示白飯請些子招打兩掌度云將謂是白飯元來只是飯招云癡人棒下打不死度至夜間舉似諸禪客次招近前云不審度云今日便是這箇上座下兩掌有瑫上座云不用下掌就裏許作麼生招云就裏許也道道瑫無對招云是你諸人一時縛作一束倒卓向尿闥下來日相見珍重白雲蒿湯慈明詐病會元十二慈明禪師有詔賜官舟南歸中途謂侍者曰我忽得風痺疾視之口吻已喎斜侍者以足頓地曰當奈何平生呵佛罵祖今乃爾師云無憂為汝正之以手整之如故曰而今而後不鈍置汝法華佯狂會元二言法華獨語笑多行市里蹇裳而趍或舉手𦘕空佇立良久從屠沽游啖無所擇道俗共目為狂僧方會雪屋會元十九揚岐方會禪師初住楊岐老屋敗椽僅蔽風雨適臨冬暮雪霰滿床居不遑處衲子投誠願充修造師却之曰我佛有言時當滅却高峯深谷遷變不常安得圓滿如意自求稱足汝等出家學道做手脚未穩已是四五十歲詎有閑工夫事豐屋耶竟不從翌日上堂曰楊歧乍住屋壁踈滿床盡撒雪珍珠縮却項暗嗟噓翻憶古人樹下居倚遇煙房北禪智賢法嗣僧寶傳中法昌倚遇禪師方韜藏西山雲蓋守智禪師聞其飽參詣之至双嶺寺寺屋多僧少草棘滿庭山雪未消智見一室邃僻試揚簾聞叱詬曰誰故出我煙蓋師方附濕薪火藉煙為暖耳智反走師呼曰來汝何所來對曰大寧又問三門夜來倒知否智愕曰不知師云吳中石佛大有人不曾得見智不敢犯其詞知其為遇也乃敷坐具願親炙之師使往謁真点胸平終虎嚙大陽平侍者預明安之室有年雖得其旨惟以生滅為己任擠陷同列忌出其右者瑯琊廣照公安圓鑒居眾時汾陽禪師令其探明安宗旨在大陽因平密授明安甞云興洞上一宗非遠即覺也二師云有平侍者在明安以手指胸云平此處不佳又揑拇指叉中示之云平向去當死於此耳暨明安遷寂遺囑云瘞全身十年無難當為大陽山打供入塔時門人恐平將不利於師遂作李和文都尉所施黃白器物書於塔銘而實無也平後住大陽忽云先師靈塔風水不利取而焚之山中老宿切諫平平曰於我有妨遂發塔顏貌如生薪盡儼然悉皆驚異平乃钁破其腦益油薪俄成灰爐眾以其事聞于官坐平課謀塔中物不孝還俗平自稱黃秀才謁瑯琊瑯琊云昔日平侍者今朝黃秀才我在大陽時見儞做處遂不納又謁公安公安亦不顧平流浪無所依後於丫叉路口遭大虫食之竟不免大陽丫叉之記悲哉僧被蛇傷雲居悟和尚在龍門時有僧被虵傷佛眼問曰既是龍門為什麼被蛇咬悟即噟曰果然現大人相後傳此語到昭覺圓悟云龍門有此僧耶東山法道未寂寥爾一本作被犬傷和補曰禪林類聚十五云昔有僧持鉢到一長者家偶為犬傷長者因問龍被一縷金翅不吞被法服為甚却被犬齩古紹雲門雲門法嗣會元十五古塔主初說法於芝山嗣雲門和補曰薦福承古禪師操行高潔稟性虗明參大光警玄禪師乃曰祇是箇草裡漢遂參福嚴稚和尚又曰祇是箇脫洒衲僧由是終日嘿然深究先德洪規一日覧雲門語忽然發語自此韜藏不求名聞棲止雲居弘覺禪師塔所四方勞者奔湊因稱古塔主也青續大陽大陽警玄法嗣會元十四投子青七齡頴異往妙相寺出家試經得度習百法論未幾歎曰三祇塗遠自困何益乃入洛聽華嚴義若貫珠甞讀諸林菩薩偈至即心自性猛省曰法離文字寧可講乎即棄游宗席先是浮山圓鑒禪師因至大陽機語與明安延公相契延嘆曰吾老矣洞上一宗遂竟無人耶以平生所著直裰皮履示之遠曰當為持此衣履求人付之如何延許之曰他日果得人出吾偈為證偈曰楊廣山前草憑君待價焞異苗翻茂處深密固靈根其尾云得法者潛眾十年方可闡揚遠拜受辭去後住浮山既老退休於會聖岩一夕夢畜青色鷹為吉徵屆旦師來遠禮延之令看外道問佛不問有言不問無言因緣經三載一日問曰汝記得話頭麼試舉看師擬對遠掩其口師了然開悟遂禮拜遠曰汝妙悟玄機耶師曰設有也須吐却時資侍者在旁曰青華嚴今日如病得汗師回顧曰合取狗口若更忉忉我便即打服勤又三年遠出洞下宗旨示之悉皆妙契付以大陽頂相皮履直裰曰代吾續洞上之風吾住世非久善自護持無留此間師遂辭出山多羅轉經禪林類聚一第二十六祖不如蜜多受度得法至東印土為王演說法要俾趣真乘又謂王曰此國當有聖人而繼於我是時有婆羅門子年二十許幼失父母不知名氏或自言瓔珞故人謂之瓔珞童子遊行閭里丐求度日若常不輕之類人問汝何行急即答云汝何行慢我問何姓乃云與汝同姓莫知其故後王與尊者同車而出見瓔珞童子稽首於前尊者曰汝憶往事否曰我念遠劫中與師同居師演摩訶般若我轉甚深修多羅今日之事盖契昔因尊者又謂王曰此童子非他即大勢至菩薩是也此聖之後出二人一人化南印度一人緣在震旦四五年內却返此方遂以昔因故名般若多羅般若多羅因東印度國王請祖齋次王乃問諸人盡轉經唯師為甚不轉祖曰貧道出息不墮眾緣入息不居蘊界常轉如是經百千萬億卷非但一卷兩卷俱胝誦呪天龍法嗣會元八俱胝只念三行呪便得名超一切人神會義解會元二西京荷澤神會禪師年十四為沙彌謁六祖祖曰知識遠來大艱辛將本來否若有本則合識主試說看師曰以無住為本見即是主祖曰遮沙彌爭合取次語便以杖打師於杖下思惟曰大善知識歷劫難逢今既得遇豈惜身命自此給侍他日祖告眾曰吾有一物無頭無尾無名無字無背無面諸人還識否師乃出曰是諸佛之本源神會之佛性祖曰向汝道無名無字便喚作本源佛性師禮拜而退祖曰此子向後設有把茆蓋頭也只成得箇知解宗徒法眼曰古人授記人終不錯如今立知解為宗即荷澤也石頭真吼林間錄上和補曰曹溪大師將入滅方敢全提此令者至江西馬祖南岳石頭則火振輝之故号石頭為真吼馬祖為全提惟儼不為會元五藥山謁石頭密領玄旨一日山坐次石頭觀之問曰汝在這裡作甚麼曰一切不為石頭曰恁麼即閑坐也曰若閑坐即為也石頭曰汝道不為且不為箇什麼曰千聖亦不識以偈贊曰從來共住不知名任運相將只麼行自古上賢猶不識造次凡流豈可明從諗仍舊林間錄上趙州曰莫費力也大好言語何不仍舊去世間法尚有門法豈無門自是不仍舊故老讓開胸羅山道閑嗣傳燈廿三江西北蘭讓禪師湖塘亮長老問伏承師兄𦘕得老師真暫請瞻禮師以兩手撥胸開示之亮便禮拜師云莫禮莫禮亮云師兄錯也某甲不禮師兄師云汝禮先師真亮云因什麼教某甲莫禮師云何曾錯道符縮手雪峰法嗣會元七鏡清有僧引童子到曰此兒子常愛問僧佛法請和尚驗看師乃令点茶童子點茶來師啜訖過盞托與童子童子近前接師却縮手曰還道得麼童子曰問將來僧問和尚此兒子見解如何師云也只是一兩生持戒僧豐干饒舌傳燈廿七閭丘徹請豐干欲住持干不從丘云若然彼處可拜誰師乎干曰彼有寒拾者則文殊普賢化身也可拜彼丘行天台興聖寺拜寒拾寒拾曰因何拜我丘云豐干和尚曰寒拾者文殊普賢化身也行可拜彼故來拜寒拾笑曰豐干饒舌豐干饒舌汝何不拜豐干豈不知阿彌陀如來憩鶴多口韶山普法嗣會元六和補曰一日僧參韶山山問曰莫是多口白頭困麼曰不敢師曰有多少口曰通身是師曰尋常向甚麼處屙曰向韶山句裡屙師曰有韶山口即得無韶山口向甚麼處屙因無語師便打雲岳殘羹臨濟法嗣傳燈十二雲山和尚有僧從西京來師問還將得西京主人書來否曰不敢妄通消息師云作家師僧天然有在曰殘羹餿飯誰喫師云獨有闍梨不甘喫其僧乃作吐勢師喚侍者曰扶出這病僧著僧便出去泐潭酸酒真淨文法嗣會元十七隆興府泐潭湛堂文準禪師僧問如何是道師云蒼天蒼天曰學人特伸請問師曰十字街頭吹尺八村酸冷酒兩三巡谷泉巴鼻汾陽法嗣南岳芭蕉庵主世呼為泉大道以其歌頌間有大道為題如六巴鼻頌曰大道巴鼻問著瞌睡背負葫蘆任歌逸戲散聖巴鼻逢場作戱東湧西沒南州北里禪師巴鼻有利無利碧嶽崔嵬龍行虎視衲僧巴鼻坐具尺二休尋短長風高雲起座主巴鼻懸河無滯地湧金蓮手擎如意山童巴鼻金將火試客問山居遠來不易真歇筋斗丹霞子淳嗣惠可斷臂會元一初祖因有僧神光來參祖端坐莫聞誨厲立庭下遲明積雪齊腰祖憫而問曰汝久立雪中當求何事師悲淚曰唯願慈悲聞甘露門廣度群品祖曰諸佛無上妙道曠劫精勤難行能行豈以小德小智輕心慢心冀真乘哉師聞已取利刀自斷左臂置于祖前師廼曰諸佛法印可得聞乎祖曰諸佛法印匪從人得曰我心未安乞師安心祖曰將心來與汝安心曰覔心不可得祖曰與汝安心竟又記之曰汝但外息諸緣內心無喘心如墻壁可以入道神觀安頭和補曰真淨留贈香城淳長老頌曰簾捲西山色禪心共月華香城深處寺靈觀上人家絕頂壇猶在盈頭乳已賒而今淳道者經誦白蓮花王老水牯馬祖法嗣傳燈八南泉因僧問和尚百年後向什麼處去師云作一頭水牯牛去僧云某甲隨和尚去得否云汝若來衘取一枝草來中邑獼猴馬祖法嗣傳燈六朗州中邑洪思禪師因仰山為新戒時到謝戒師見來於禪床上拍手云和和仰山即東邊立又西邊立又中心立然後謝戒了却退後立師云什麼處得此三昧山云曹溪脫印子學來師云汝道曹溪用此三昧接什麼人山云接一宿覺却云和尚什麼處得此三昧師曰馬大師處學得問如何得見性師云譬如有屋屋有六窓內有一獼猴東邊喚山山山山應如是六窓俱應仰山禮謝起云蒙和尚譬喻無不了知更有一事只如內獼猴困睡外獼猴欲與相見時如何師下禪床執仰山手作舞云山山與汝相見了譬如蟭螟虫在蚊子眼睫上作窠向十字街頭呌喚云土矌人希相逢者少茱萸釘橛南泉法嗣鄂州茱萸山和尚初住隨州護國院為第一世金輪可觀和尚問如何是道師云莫向虗空裡釘橛觀云虗空是橛師乃打之觀捉住云莫打某甲已後錯打人在師便休象骨輥毬會元七玄沙謂雪峯曰某甲如今大用去和尚作麼生師將三箇木毬一時拋出沙作斫牌勢師云你親在靈山方得如此沙曰也是自家事一日陞座眾集定師輥出木毬玄沙遂捉來安舊處師凡有僧來參輥出示之龍潭送餅天皇道悟法嗣會元七龍潭未出家時為餅鋪住在天皇寺前每日常供餅十枚上天皇皇受了却一餅與之曰惠汝以蔭子孫潭云是某將來何以返云惠汝皇云是汝將來復汝何咎潭因有悟入遂投出家投子沽油翠微無學嗣傳燈錄投子悟翠微宗旨結茆而居一日趙州至桐城縣途中相遇乃逆而問曰莫是投子山主麼師云茶鹽錢乞一文州無語先到庵中坐師携油瓶皈州曰久響投子到來只見箇賣油翁師云汝只見賣油翁亦不識投子如何是投子師云油油嚴陽飼虎趙州法嗣傳燈十一嚴陽尊者初參趙州問一物不將來時如何州云放下着者云一物不將來放下箇什麼州曰與麼則擔取去者於言下大悟後住山有一虵一虎就手而食惠藏牧牛傳燈六撫州石鞏惠藏禪師一日在廚作務馬祖曰作什麼生曰牧牛祖曰作麼生牧曰一回入草去驀鼻拽將回祖曰子真牧牛也宣鑒出浴龍潭法嗣傳燈六守廓侍者問德山曰從上諸聖向甚麼處去山曰作麼作麼廓曰勑点飛龍馬跛鼈出頭來山便休去來日浴出廓過茶與山山於背上拊一下曰昨日公案作麼生廓曰這老漢今日方始瞥地山又休去師鼎登樓雪峯法嗣傳燈十九越州諸暨縣越山師鼎號鑒真禪師初參雪峯而染指後因閩王請於清風樓齋坐久舉目忽覩日光豁然頓曉而有偈曰清風樓上赴官齋此日平生眼豁開方識普通年遠事不從葱嶺路將來皈呈雪峯峯然之雲庵奪席黃龍南法嗣僧寶傳下雲庵真淨克文禪師年二二十五試所習剃髮受具足戒學經論無不臻妙奪京洛講席自為主客而發奧義者數矣淨照隨舟浮山遠法嗣僧寶廿六浮因淨照禪師名道臻字伯祥一日行江上顧舟默計曰當隨所住信吾緣也問舟師曰載我船尾可乎舟師笑曰師欲何之我入汴船也師云吾行游京師因載之而北國師三喚六祖法嗣會元二南陽惠忠國師一日三喚侍者三應師曰將謂吾孤負汝却是汝孤負吾趙州一掐會元四趙州尼問如何是密密意州以手掐之尼曰和尚猶有這箇在州曰却是你有這箇在大隋蓋龜傳燈十一益州大隋法真禪師庵側有一龜僧問一切眾生皮褁骨這箇眾生為什麼骨褁皮師拈鞋履盖龜背上僧無語日丈野鴨會元三見上卷百丈捲席處和補曰百丈侍馬祖行次見一群埜鴨飛過祖曰是甚麼丈曰野鴨子祖曰甚麼處去也丈曰飛過去祖遂把鼻扭百丈痛失聲祖曰又道飛過去也師於言下有省曹嶠靈衣洞山价法嗣會元十三僧問曹山靈衣不挂時如何師曰曹山孝滿曰孝滿後如何師曰曹山好顛酒踈山壽塔會元十三踈山因有僧為師造壽塔畢白師師曰將多少錢與匠人曰一切在和尚師云為將三錢與匠人為將兩錢與匠人為將一錢與匠人若道得與吾親造塔來僧無語後僧舉似大嶺庵閑和尚即羅山也嶺曰還有人道得麼僧曰未有人道得嶺曰汝皈與踈山道若將三錢與匠人和尚此生決定不得塔若將兩錢與匠人和尚與匠人共出一隻手若將一錢與匠人累他匠人眉鬚墮落僧回如教而說師具威儀望大嶺作禮嘆曰將謂無人大嶺有古佛放光射到此間雖然如是也是臘月蓮華大嶺後聞此語曰我恁麼道早是龜毛長三尺百會不會會元七洛京南院和尚有儒者愽覽古今時呼為張百會謁師師問莫是張百會麼曰不敢師以手於空畫一畫曰會麼曰不會師曰一尚不會甚麼處得百會來法達不達六祖法嗣傳燈五洪州法達禪師者洪州豐城人也七歲出家誦法華經進具之後來禮六祖頭不至地祖訶曰禮不投地何如不禮汝心中必有一物蘊習何事耶師云念法華經已及三千部祖曰汝若念至萬部不得其經意不以為勝則與吾偕行汝今負此事即生亡功福無比祖又曰汝名什麼對曰名法達祖曰汝名法達何曾達法復說偈曰汝今名法達勤誦未休歇空誦但循聲明心號菩薩汝今有緣故吾今為汝說但信佛無言蓮華從口發師聞偈悔過曰而今而後當謙恭一切唯願和尚大慈略說經中義理祖曰汝念此經以何為宗師云學人愚鈍從來但依文誦念豈知宗趣祖曰汝試為吾念一編吾當為汝解說師即高聲念經至方便品祖曰止此經元來以因緣出世為宗縱說多種譬喻亦無越於此何者因緣唯一大事一大事即佛知見也汝慎勿錯解經意見他道開示悟入自是佛之知見我輩無分若作此解乃是謗經毀佛也彼既是佛已具知見何用更開汝今當信佛知見者只汝自心更無別體盖為一切眾生自蔽光明貪受塵境外緣內擾甘受驅馳便勞他從三昧起種種苦口勸令𥨊息莫向外求與佛無二故云開佛知見故但勞勞孰念謂為功課者何異𤛆牛愛尾也師云若然者俱得解義不勞誦經耶祖曰經有何過豈障汝念只為迷悟在人損益由汝聽吾偈曰心迷法華轉心悟轉法華誦久不明己與義作讎家無念念即正有念念成邪有無俱不計長御白牛車師聞偈再啟曰經云諸大聲聞乃至菩薩皆盡思度量尚不能測於佛智今令凡夫但悟自心便名佛之知見自非上根未免疑謗又經說三車大牛之車與白牛車如何區別願和尚再垂宣說祖曰經意分明汝自迷背諸三乘人不能測佛智者患在度量也饒伊盡思共推轉加懸遠佛本為凡夫說不為佛說此理若不肯信者從他退席殊不知坐却白牛車更於門外覔三車況經文明向汝道無二亦無三汝何不省三車是假為昔時故一乘是實為今時故只教汝去假歸實歸實之後實亦無名應知所有珍財盡屬於汝由汝受用更不作父想亦不作子想亦無用想是名持法華經從劫至劫手不釋卷從晝至夜無不念時也師既蒙啟發踊躍歡喜以偈贊曰經誦三千部曹溪一句亡未明出世旨寧歇累生狂羊鹿牛權設初中後善揚誰知火宅內元是法中王祖曰汝今後方可名為念經僧也師從此領玄旨亦不輟誦持揚岐八棒臨濟四喝黃檗法嗣臨濟謂僧曰有時一喝如金剛王寶劒有時一喝如踞地師子有時一喝如探竿影草有時一喝不作一喝用汝作麼生會僧擬議師便喝匾頭被罵會元十七黃龍惠南禪師叢林目曰南匾頭因趍詣慈明之室曰惠南以闇短望道未見此聞夜參如迷行得指南之車然唯大慈更施法施使盡餘疑慈明笑曰書記已領徒游方名聞叢林借有疑不以襄陋鄙棄坐而商略顧不可哉呼侍者進榻且使坐師固辭哀懇愈切慈明曰書記學雲門禪必善其旨如曰放洞山三頓棒洞山于時應打不應打師云應打慈明色壯而言聞三頓棒聲便是喫棒則汝自旦及暮聞鵶鳴鵲噪鐘魚鼓板之聲亦應喫棒何時當已哉師瞠而却慈明云吾始疑不堪汝師今可也即使拜師拜起慈明理前語曰脫如汝會雲門意旨則趙州嘗言臺山婆子被我勘破試指其可勘處師面熱汗下不知答趨出明日詣之又遭詬罵師慙見左右即曰政以未解求決耳罵豈慈悲法施之式慈明笑曰是罵耶師於是默悟其旨失聲曰泐潭果是死語献語曰傑出叢林是趙州老婆勘破沒來由而今四海清如鏡行人莫以路為讎慈明以手點沒字顧師師即易有之字而心服其妙密留月餘辭去水潦遭蹈傳燈八水潦和尚參馬祖禮拜起欲伸問祖一蹈蹈倒師忽然大悟起來呵呵大笑云也太奇也太奇百千三昧無量妙義只向一毫端上識得根源去便禮拜死心下火黃龍法嗣會元十七寶覺禪師將入滅命門人黃太史庭堅主後事荼毗日隣峯為康炬火不續黃顧師之得法上首死心新禪師曰此老師有待於吾兄也新以喪拒黃強之新執炬召眾曰不是餘殃累及我彌天罪過不容誅而今兩脚捎空去不作牛號定作驢以火炬打一圓相祗向這裡雪屈擲炬應手而爇自禪掛塔五祖演法嗣蘄州五祖表自禪師嗣祖席衲子四至不可遏師榜侍者門曰東山有三句若人道得掛塔衲子皆披靡一日有僧携坐具徑造丈室謂師曰某甲道不得祗要掛塔師大喜呼維那於明窓下安排天然口啞石頭迁法嗣會元三龐居士一日見丹霞來遂不語亦不起霞廼拈起手中拂子士便拈起鎚子霞曰只恁麼別更有在士曰此回見兄不似於前霞云不妨減人聲價士曰本來要折倒汝一上霞曰恁麼則啞却天然口也士曰汝啞却本分猶累我啞却霞乃擲却拂子去士曰然闍梨然闍梨霞不顧士曰不唯患啞兼亦患聾大耳心通會元二唐肅宗詔南陽惠忠國師試驗西天大耳三藏他心通師到三藏作禮立左邊師問曰汝得他心通耶曰不敢師曰汝道老僧只今在何處曰和尚是一國之師却去西川看競渡又問汝道只今又在何處曰天津橋上看弄胡孫又問汝道只今聻三藏罔然師叱曰者野狐精他心通在何處文益書字桂琛法嗣會元六和補曰昔有一老宿住菴於門上書心字於窓上書心字於壁上書心字法眼云門上但書門字窓上但書窓字壁上但書壁字玄覺云門上不要書門字窓上不要書窓字壁上不要書壁字何故字義炳然曉聰栽松文殊應天真嗣五燈十五洞山曉聰禪師手植萬松於東嶺而誦金剛般若經山中人名其嶺曰金剛方植松而寶禪師至時親自五祖來師問上嶺一句作麼生道寶曰氣急殺人師拄钁呵曰從何得此隨語生解阿師見問上嶺便言氣急佛法却成流布寶請代語師曰何不道氣喘殺人逍遙問嶺在此金剛在什麼處師指曰此一株松是老僧親栽初比部郎中許公式出守南昌過蓮華峯聞祥公曰聦道者在江西試尋訪之此僧人天眼目也許公既至聞聰住山家風作詩寄之曰語言渾不滯高躡祖師蹤夜坐連雲石晝栽帶雨松鏡分金殿燭山荅月樓鐘有問西來意靈堂對遠峰禾山義虎黃龍南法嗣僧寶傳下禾山普禪師初秀出講席解唯識起信論兩川無敢難詰者號義虎瑞岩臥龍岩頭法嗣傳燈十七台州瑞岩師彥禪師謁夾山會和尚會問什麼處來曰臥龍來會曰來時龍還起未師乃顧視之會曰灸瘡上更著艾燋曰和尚苦如此作什麼會便休翠岩唾地石霜法嗣會元十七蘄州開元子琦禪師謁翠岩真禪師問佛法大意唾地曰這一滴落在甚麼處琦捫膺曰學人今日脾疼師解顏寶壽釘空臨濟法嗣傳燈十二鎮州寶壽沼和尚胡釘鉸來參師問汝莫是胡釘鉸曰不敢師曰還解釘得虗空否曰請和尚打破某甲與釘師以拄杖打之胡曰和尚莫錯打某甲師云向後有多口阿師與點破在一城人瞎傳燈十二寶壽開堂三聖推出一僧在寶壽前壽便打其僧聖云長老若恁麼為人瞎却鎮州一城人眼在三日耳聾會元三見前黃蘗吐舌處東山餕餡五祖錄和補曰法演遊方十餘年海上參尋見數人尊宿乃到浮山圓鑑會下直是開口不得後到白雲門下咬破一箇䥫餕餡直得百味具足且道饀子一句作麼生道乃有偈花發雞冠媚早稱誰人能染紫絲頭有時風動頻相倚似向階前鬪不休揚岐栗蓬會元十九楊岐問僧栗棘蓬作麼生吞金剛圈作麼生透惠南主法僧寶傳下黃龍南曰住持要在得眾得眾要在見情先師言人情者為世之福田盖理道所由生也故時之否泰事損益必因人情情有時通塞則否泰生事有時厚薄則損益至唯聖人能通天下之情故易之別卦乾下坤上則曰泰乾上坤下則曰否其取象損上益下則曰益損下益上則曰損夫乾為天坤為地天在下而地在上位故乖矣而返謂之泰者上下交故也主在上而賓處下義故順矣而返謂之否者上下不交故也是以天地不交庶物不育人情不交萬事不和損益之義亦由是矣夫在人上者能約己以裕下下必悅而奉上矣豈不謂之益乎在上者蔑下而肆諸己下必怨而叛上矣豈不謂之損乎故上下交則泰不交則否自損者人益自益者人損情之得失豈容易乎先聖甞喻人為舟情為水水能載舟亦能覆舟水順舟浮違則沒矣故住持得人情則興失人情則廢全得而全興全失而全廢故同善則福多同惡則禍甚善惡同類端如貫珠興廢象行明若觀日斯歷代之元龜也居訥扶宗延慶榮法嗣會元十六圓通居訥禪師仁宗皇帝聞其名皇祐初詔住十方淨因禪院師稱目疾不能奉詔有旨令舉自代遂舉僧懷璉禪學精深在居訥之右於是詔璉璉至引對問佛法大意稱旨天下賢師知人洪濟師子遼陽大虫趙州探水傳燈十趙州一日訪茱萸將拄杖於法堂上東行西行萸云作什麼州云探水萸云我這裡一滴也無州將拄杖靠壁便出百丈夾火傳燈九溈山一日侍百丈次丈問誰山曰靈祐丈曰汝撥爐中有火否山撥之無火丈躬自深撥得栗火舉以似山云你道無者箇聻山忽然契悟遂禮拜陳其所解丈云此迺暫時岐路耳欲識佛性義當觀時節因緣時節若至如迷忽悟如忘忽憶方省己物不從他得故祖師云悟了同未悟無心亦無法只是無虗妄凡聖等心本來心法元自具足汝今既是善自護持次日同百丈入山作務丈曰將得火來麼山曰將得來丈曰在甚處山乃拈一枝柴吹兩吹度與百丈丈曰如蟲禦木金峰行餅禪林類聚十八金峰一日於僧堂內喫餬餅次自拈一枚餅從上板頭轉一匝大眾見一時合掌峰云假使你十分擡起手也祇得一半至晚有僧請益云今日行餅見僧合掌和尚道假饒十分擡起手也祇得一半請和尚全道峯作拈餅勢復云會麼僧云不會峯云金峯也祇得一半布袋拈果傳燈廿七布袋在通衢立有僧云作什麼布袋云等箇人僧云來也布袋取一橘子與僧僧纔接布袋縮手云你不是者箇人中邑鳴㖿中邑每見僧拍手皷唇曰㖿鳴㖿鳴青山骨剉黃蘗法嗣傳燈十二杭州羅漢院宗徹禪師僧問如何是西來意師云骨剉也師對機多用此語時人因號骨剉和尚明招目眇羅山道閑法嗣會元十三務州明招謙和尚眇一目叢林號獨眼龍雲門脚跛會元五雲門初參睦州方扣門州揕之曰道道門驚不暇答乃推出曰秦時𨍏轢鑽隨掩其扉損門右足四處謾人傳燈十九漳州保福從展禪師四謾人一問僧殿裏是甚麼佛僧曰和尚定當看師曰釋迦佛僧云莫謾人好師云却是你謾我二問僧作甚麼業喫得與麼大僧云和尚也不少師作蹲勢僧云和尚莫謾人好師云却是你謾我三問僧汝名甚麼僧云咸澤師云忽遇枯涸看如何僧云誰是枯涸者師云我是僧云和尚莫謾人好師云却是你謾我四問浴主湯鍋濶多少主云請師量師便作量勢主云和尚莫謾人好師云却是你謾我三翻懡㦬傳燈隋州護國院守澄淨果禪師僧問鶴立枯松時如何師云地下底一場懡㦬問會王沙汰時護法善神向甚麼處去師云三門前兩箇一場懡㦬問滴水滴凍時如何師云日出後一場懡㦬韶陽九九雲門錄事苑三僧問雲門如何是向上一竅門云九九八十一又僧問如何是最初一句門云九九八十一又僧問以字不是八字不成未審是甚麼字門云九九八十一文殊三三杭州無著文喜禪師初謁大慈山性空禪師空曰子何不徧參乎師直往五臺山華嚴寺至金剛窟禮謁遇一老翁牽牛而行邀師入寺翁呼均提有童子應聲出迎翁縱牛引師陞堂堂宇皆耀金色翁踞床指繡𫄃命坐翁曰近自何來師云南方翁曰南方佛法如何住持師云末法比丘少奉戒律翁曰多少眾師曰或三百或五百師却問此間佛法如何住持翁曰龍蛇混雜凡聖同居師云多少眾翁曰前三三後三三翁呼童子致茶并進酥酪師納其味心意豁然翁拈起玻璃盞問曰南方還有這箇否師曰無翁曰尋常將甚麼喫茶師無對師視日色稍晚遂問翁擬投一宿得否翁曰汝有執心在不得宿師曰某甲無執心翁曰汝曾受戒否師曰受戒久矣翁曰汝若無執心何用受戒師辭退翁令童子相送師問童子前三三後三三是多少童召大德師應諾童曰是多少師復問曰此為何處童曰此金剛窟般若寺也師悽然悟彼翁者即文殊也不可再見即稽首童子願乞一言為別童說偈曰面上無嗔供養具口裏無嗔吐妙香心裏無嗔是珍寶無垢無染是真常言訖均提與寺俱隱但見五色雲中文殊乘金毛師子往來忽有白雲自東方來覆不見時有滄州菩提寺僧修政等至尚聞山石震吼之聲師因駐錫五臺見會元二金牛飯桶馬祖法嗣會元三金牛和尚每至齋時自將飯桶於僧堂前作舞呵呵大笑云菩薩子喫飯來靈照菜籃傳燈十四丹霞訪龐居士門前見女子靈照去洗菜霞問居士在否照放下菜籃斂手而立霞曰居士在否照提起菜籃而去霞便回居士從外歸靈照舉似居士居士云丹霞在否照云已去也居士云赤土塗牛妳丹霞燒佛傳燈十四丹霞甞到洛古惠林寺值天寒取木佛燒之院主呵之霞曰吾燒取舍利主云木佛豈有舍利霞曰若爾何責我乎院主後眉鬚墮落婆子焚庵會元六昔有婆子供養一庵主經二十年常令一二八女子送飯給侍一日令女子抱定曰正恁麼時如何主曰枯木倚寒岩三冬無暖氣女子舉似婆婆曰我二十年祇供養得箇俗漢遂遣出燒却庵雲盖論義石霜諸法嗣會元六雲盖元禪師因潭州道正表聞馬王乞師論義王請師上殿相見茶罷師就王乞劒師握劒問道正曰你本教中道恍恍惚惚其中有物是何物杳杳冥冥其中有精是何精道得不斬道不得即斬道正茫然便禮拜懺悔師謂王曰還識此人否王曰識師曰是誰王曰道正師曰不是道若正合對得臣僧此祇是箇無主孤魂因茲道士更不紛紜德山小參傳燈十五德山小參示眾云今夜小參不答話問話者三十棒時有僧出禮拜師便打僧云某甲話也未問在師云你是什麼處人僧云新羅人師云未跨船舷子好與三十棒芙蓉妙唱投子青法嗣人天眼目芙蓉楷禪師妙唱不干舌頌曰剎剎塵塵處處談不勞彈指善財參空生也解通消息花雨岩前鳥不𭊷空生者須菩提也常察玄談九峯䖍法嗣傳灯廿九同安常察禪師十玄談心印祖意玄機塵異佛教還鄉曲破還鄉曲轉位歸回機正位前二祖安心在前惠可斷臂之處洞山見影雲岩晟法嗣會元十三洞山問雲岩和尚百年後忽有人問還貌得師真如何祇對雲岩曰祖向伊道即遮箇是師良久雲岩曰承當遮箇事大須審細師猶涉疑復因過水覩影大悟前旨因有一偈曰切忌從他覔迢迢與我疎我今獨自往處處得逢渠渠今正是我我今不是渠應須恁麼會方得契如如藥嶺榮枯石頭法嗣會元五藥山一日與道吾雲岩高沙彌遊山見兩樹一榮一枯山問曰榮者是枯者是吾曰枯者是山曰酌然一切處令教枯淡去又問岩岩曰榮者是山曰酌然一切處令光明燦爛去復問沙彌彌曰枯者從佗枯榮者從他榮山回顧道吾雲岩曰不是不是夾山人境華亭法嗣會元五僧問夾山如何是夾山境山曰猿抱子歸青嶂後鳥啣花落碧岩前香嚴上樹溈山法嗣傳燈十一香嚴一日上堂示眾如人上樹口㗸一樹枝脚不蹈枝手不攀枝忽有人問祖師西來意若答他即喪身失命不答他又違他所問時有虎頭上坐出云樹上即不問樹下一句道將來嚴呵呵大笑仰山出井傳燈十一潭州石霜山性空禪師因僧問如何是西來空曰如人在千尺井中不假一寸繩得出此人即答汝西來意僧云近日湖南鳴和尚出世亦為人東語西話空喚沙彌拽出者死漢著仰山沙彌也沙彌後舉問耽源如何出得井中人源曰咄癡漢誰在井中仰山後問溈山如何出得井中人溈山廼呼惠寂寂應諾溈山曰出也及住仰山甞舉前話謂眾曰我於耽源處得體溈山處得地趙州接客南泉法嗣會元真定師王携諸子入院趙州坐而問曰大王會麼王云不會師云自少持齋身已老見人無力下禪床王尤嘉禮重翌日令客將傳語師下禪床受之少間侍者問云和尚見大王來不下禪床今日將軍來為什麼却下禪床師曰非汝所知第一等人來禪床上接中等人來下禪床接末等人來三門外接師寄拂子與大王若問何處得來但道老僧平日用不盡者价老看病雲岩晟法嗣洞山僧問和尚遺和還有不病者也無師曰有僧曰不病者還看和尚否師曰老僧看他有分曰和尚爭得看他師曰老僧看時即不見有病南泉油餈禪林類聚九和補曰南泉願禪師一日不赴堂侍者請赴堂師云我今日在莊上喫油糍飽者云和尚不曾出入師云汝去問莊主者方出門忽見莊主歸謝和尚云云韶陽胡餅雪峰法嗣雲門錄僧問雲門如何是超佛越祖之談門云餬餅德山托鉢傳燈十五雪峰在德山作飯頭一日飯遲德山擎鉢下法堂雪峯廼曰鐘未鳴皷未響老和尚托鉢向什麼處去德山却歸方丈岩頭在堂中聞得拊掌曰大小德山未會末後句德山聞舉令侍者喚頭上問你不肯老僧耶頭密啟其意德山來日上堂說話異於每常頭到僧堂前撫掌大笑曰且喜堂頭老漢會末後句他後天下人不奈何雖然如是只得三年話後三年果化象骨覆盆傳燈七雪峯在洞山作飯頭淘米次山問淘沙去米淘米去沙師曰沙米一時去山曰大眾喫箇甚麼師遂覆却米盆山曰據子因緣合在德山婆子眷屬傳灯六昔有一僧參米胡路逢一婆住庵僧問婆有眷屬否曰有僧曰在甚麼處曰山河大地若草若木皆是我眷屬僧曰婆莫作師姑來否曰汝見我是甚麼僧曰俗人婆曰汝不可是僧僧曰婆莫混濫佛法好婆曰我不混濫佛法僧曰汝恁麼豈不是混濫佛法婆曰你是男子我是女人豈曾混濫王老兒孫馬祖法嗣傳燈八黃蘗在南泉為首座一日捧鉢於南泉位上坐泉入堂見乃問長老甚年中行道蘗曰威音王佛已前泉曰猶是王老師兒孫蘗遂過第二位雲居送袴良价法嗣會元三洪州雲居道膺禪師曾令侍者送袴與一住庵道者道者曰自有娘生袴竟不受師再令侍者問娘未生時著箇甚麼道者無語後遷化有舍利持似於師師曰直饒得八斛四斗不如當時下得一轉語好道吾得裩藥山法嗣傳燈十四有施主施裩藥山提起示眾曰法身具四大否有人道得與他一腰裩潭州道吾山宗智禪師云性地非空空非性地此是地大三大亦然藥山不違前言乃與吾裩九峰頭尾九峰禪師僧問如何是頭師曰