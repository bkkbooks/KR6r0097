墮在毒海二情滲漏謂智常向背見處偏枯三語滲漏謂體妙失宗機暗終始學者濁智流轉不出此三種克符料揀臨濟法嗣會元十一臨濟初至河北住院見普化克符二上座乃謂曰我欲於此建立黃檗宗旨汝且成褫我二人珍重下去三日後普化却上來問和尚三日前說甚麼濟便打三日後克符上來問和尚前日打普化作什麼濟亦打至晚小參曰有時奪人不奪境有時奪境不奪人有時人境兩俱奪有時人境俱不奪有僧問如何是奪人不奪境臨濟之曰煦日發生鋪地錦孾兒垂髮白如絲如何是奪境不奪人濟云王令已行天下徧將軍塞外絕烟塵如何是人境兩俱奪濟曰并汾絕信獨處一方如何是人境俱不奪濟云王登寶殿野老謳歌克符頌奪人不奪境緣自帶誵訛擬欲求玄旨思量反責麼驪珠光燦爛蟾桂影婆娑覿面無差互還應滯網羅奪境不奪人尋言何處真問禪禪是妄究理理非親日照寒光澹山遙翠色新直饒玄會得也是眼中塵人境兩俱奪從來正令行不論佛與祖那說聖凡情擬犯吹毛劒還如值木盲進前求妙會特地斬精靈人境俱不奪思量意不徧主賓言不異問答理俱全蹈破澄潭月穿開碧落天不能明妙用淪溺在無緣佛日體盆國師水枕祖庭事苑曰未見出處祖心背觸會元十七黃龍祖心室中常舉拳問僧曰喚作拳頭則觸不喚作拳頭則背喚作甚麼道一長短南岳讓法嗣傳燈六有僧於馬祖前作四𦘕上一𦘕長下三𦘕短問曰不得道一長三短離此四句外請和尚答師乃𦘕一𦘕云不得道長短答汝了也石樓無耳石頭法嗣會元五汾州石樓和尚因僧問未識本來性乞師方便指師云石樓無耳朵僧云某甲自知非師云老僧還有過僧云和尚過在甚麼處師云過在汝非處僧禮拜師便打真溪具眼曹溪法嗣會元十三處州廣利容禪師初住真溪有僧來參師竪起拂子云真溪老漢還具眼麼僧云某甲不敢見和尚過師云老僧死在闍梨手裡僧以手指胸便出師云闍梨見先師來至晚師喫茶僧拈起盞曰者箇是諸佛出世邊事作麼生是未出世邊事師以手撥却盞云到闍梨死在老僧手裏僧云五里牌在郭門外師云無故惑亂師僧僧便起謝茶師云特謝相訪可真點胸慈明法嗣普灯三翠岩可真禪師到慈明大師慈明看便問曰如何是佛法大意可真曰無雲生嶺上有月落波心明曰頭白齒黃猶作這見解可真垂淚求指示明云你可問我可真以前語問之明曰無雲生嶺上有月落波心即於其所頓明大法住翠岩世推為天下法窟昌禪擔板德山招扇傳燈十六襄州高亭簡禪師初隔江見德山遙合掌呼云不審德山以手中扇再招之簡忽開悟乃橫趨而去更不迴顧後於襄州開法嗣德山迦葉剎竿會元一阿難問迦葉云師兄世尊傳金襴袈裟外別傳何物迦葉召阿難難應諾葉云倒却門前剎竿著佛光錦帳佛光無礙禪師自蘇州永安赴詔住大相國寺惠林禪院惠恭皇后甞於簾下見登對罷乘空而去自爾以太宮所進御膳供養復令取禪師所食之餘還宮又以地錦製法衣自綴禪牌賜之以表奉法之誠冬月賜紅錦帳子乃至服飾器皿之類光遂以宮中所賜法衣回施法雲佛照禪師法雲復寄與洪州寶峯湛堂和尚書云地錦法衣與師弟行先師之道湛堂示寂留山門至今猶存祐國金襴湑終海嶋亮隱西山會元三洪州西山亮座主棄經論因參馬祖祖問曰見說座主大講得經論是否亮曰不敢祖曰將甚麼講亮曰將心講祖曰心如工伎兒意如和伎者爭解講得亮抗聲云心既講不得莫是虗空講得麼祖曰却是虗空講得師拂袖而出祖乃召云座主師回首祖曰從生至老只是者箇師豁然大悟遂禮拜祖曰者鈍根阿師禮作麼亮歸告眾曰某甲所講經論謂無人及得今日被馬祖一問平生工夫氷釋已而乃隱西山更無消息至今西山中人往往見之政和中有士人姓熊失其名世為陽人遊洪之諸山道過翠岩時長老思文即其鄉人遣二力荷轎舁至空相所經林壑隱翳忽覩一僧㒵古神清龐眉雪頂編葉為衣坐於磐石如壁間𦘕佛圖澄像心疑其異人自惟亮公隱於西山恐或是也踧踖而問曰莫是亮公不僧以手向東指熊隨手回顧失僧所在時小雨新霽熊撫其坐處而石猶溫回顧躊躇大息曰夙緣不厚遇猶不遇也大道松妖汾陽法嗣僧寶傳下泉大道住保真庵蓋衡湘至險絕處夜地坐祝融峯下有大蠎盤繞之泉解衣帶縛其腰中夜不見明日杖䇿徧山尋之衣帶纏枯松上盖松妖也黃龍赤斑傳燈廿一福州皷山智岳了宗大師至鄂州黃龍問曰久響黃龍到來只見赤斑蛇黃龍曰汝只見赤斑蛇且不識黃龍宗曰如何是黃龍曰滔滔地宗曰忽遇金翅鳥來又作麼生曰性命難存宗曰恁麼即被他吞却也曰謝闍梨供養黃牛拒戒會元十政黃牛者錢塘人住餘杭功臣山幼孤為童子有卓識詞語皆出人意表其師稱於人有大檀越奇之以度牒施之跪捧謝而不受其師問故曰恩不可輕受彼非知我者特以師之言施百千於一童子保其終身能施物不責報乎如來世尊大願度生則有慈廕今妙法蓮華經是當折節誦持恩併歸一於義為當師自是益奇之年八十果以其志為大僧游方問道三十年乃罷師子遇姦會元一端師子錢穆父赴官浙東見之約明日飯端黎明獨往避雨入道傍人家幼婦出迎俄其夫至詬逐竟為羅卒所收穆父吏速客見之問故曰煩寄聲錢公本來赴齋中塗奸情事發請自飯穆父聞之驚且笑顧客曰此僧胸中無一點疑事石頭路滑青原思法嗣會元三鄧隱峯辭馬祖祖云什麼處去峯云石頭去祖云石頭路滑峯云竿木隨身逢場作戲遂到石頭繞繩床三匝振錫而立云是何宗旨頭云蒼天蒼天峯無語回舉似祖祖云更去問他待他有語汝便噓二聲峯去依前問石頭廼噓兩聲峯又無語回舉似祖祖云向汝道石頭路滑馬祖問丹霞從甚麼處來霞曰石頭祖曰石頭路滑還躂倒汝麼霞曰若躂倒即不來也五祖機峻普燈十一蘄州五祖法演禪師自海會遷東山太平佛鑑龍門佛眼三人詣山頭省覲祖集耆舊主事備湯菓夜話祖問佛鑑舒州熟否對曰熟祖曰太平熟否對曰熟祖曰諸莊共収稻多少佛鑑籌慮間祖正色厲聲曰汝濫為一寺之主事無巨細悉要究心常住出計一眾所係汝猶罔知其他細務不言可見山門執事知因識果若師翁輔慈明祖師乎汝不思常住物重如山乎盖演祖尋常機辨峻據如是明招虎尾羅山道閑法嗣會元十三明招問疎山虎生七子第那箇無尾巴山云第七箇無尾巴老宿鼠糞傳燈廿七昔有老宿一夏並不為師僧說話有僧自歎曰我只與麼空過一夏不敢望和尚說佛法得聞正因兩字也老宿聊聞曰闍梨莫𧬊速若論正因一字也無道了乃扣齒曰適來無端與麼道隣壁有老宿聞得乃曰好一釜羹被兩顆鼠糞污却法演四戒佛鑑和尚初受舒州太平請禮辭五祖祖曰大凡住院為已戒者有四第一勢不可使盡第二福不可受盡第三規矩不可行盡第四好語不可說盡何故好語說盡人必易之規矩行盡人必繁之福若受盡緣必孤勢若使盡禍必至鑑再拜服膺而退守初三頓雲門法嗣傳燈廿三洞山守初詣雲門門問近離何處對曰查渡又問夏在何處對曰湖南報慈又問幾時離對曰八月二十五門曰放汝三頓棒山罔然良久又申問曰適來祇對不見有過乃蒙賜棒實所不曉門呵曰飯袋子江西湖南便爾商略山悟其旨曰他日正當於無人煙處不畜一粒米飯十方僧即日辭去成禪一喝埜錄上淨因成禪師同法真圓悟慈受并十大法師齋于太尉陳公良弼府第時徽宗私幸觀其法會善華嚴者對眾問諸禪師曰吾佛設教自小乘至圓頓掃除空有獨證真常然後萬德莊嚴方名為佛禪師一喝轉凡成聖與諸經論似相違背今一喝若能入五教是為正說若不能入是為邪說諸禪師顧成成曰如法師所問不足三大禪師之酬淨因小長老可以使法師無惑也成召善善應諾成曰法師所謂佛之小乘教者乃有義也大乘始教者乃空義也大乘終教者乃不有不空義也大乘頓教者乃即有即空義也一乘圓教者乃不空而不有不有不空義也如我一喝非惟能入五教至於百工伎藝諸子百家悉皆能入成乃喝一喝問善曰還聞麼善曰聞成曰汝既聞則此一喝是有能入小乘教成須臾又召善曰還聞麼曰不聞成曰汝既不聞則適來一喝是無能入始教成又顧善曰我初一喝汝既道有喝久聲消汝復道無道無則元初實有道有則于今實無不有不無能入終教成又曰我有一喝之時有非是有因無故有無一喝之時無非是無因有故無即有即無能入頓教成又曰我此一喝不作一喝用有無不及情解俱忘道有之時纖塵不立道無之時橫徧虗空即此一喝入百千萬億喝入此一喝是能入圓教善不覺身起于座再拜於成之前成復為善曰非惟一喝為然乃至語默動靜一切時一切處一切物一切事契理契機周遍無餘於是四眾歡喜聞所未聞龍顏大悅太宗十問會元六太宗皇帝一日幸相國寺見僧看經問曰是甚麼經僧曰仁王經帝曰既是寡人經因甚却在卿手裡僧無對雪竇代曰皇天無親唯德是輔幸開寶塔問僧卿是甚人對曰塔主帝曰朕之塔為甚麼卿作主僧無對雪竇代曰合國咸知一日因僧朝見帝問甚處來對曰廬山臥雲庵帝曰朕聞臥雲深處不朝天為甚到此僧無對雪竇代曰難逃至化僧入對次奏曰陛下還記得麼帝曰甚處相見來奏曰靈山一別直至如今帝曰卿以何為驗僧無對雪竇代云貧道得得來京寺回祿藏經悉為煨燼僧欲乞宣賜召問昔日摩騰不燒如今為甚却燒僧無對雪竇代云陛下不忘付屬帝甞夢神人報曰請陛下發菩提心因早朝宣問左右街菩提心作麼生發街無對雪竇代云實謂今古罕聞智寂大師進三界圖帝問朕在那一界中寂無對保寧勇代云陛下何處不稱尊一日朝罷帝擎鉢問丞相王隨曰既是大庾嶺頭提不起為甚麼却在朕手裡隨無對耽章寶鏡洞山法嗣僧寶傳曹山寶鏡三昧其詞曰如是之法佛祖密付汝今得之其善保護銀盃盛雪明月藏鷺類之弗齊混則知處意不在言來機亦赴動成窠臼差落顧佇背觸俱非如大火聚但形文彩即屬染污夜半正明天曉不露為物作則用拔諸苦雖非有為不是無語如臨寶鏡形影相視汝不是渠渠正是汝如世嬰兒五相完具不去不來不起不住婆婆和和有句無句終必得物語未正故重离六父徧正回互疊而為三變盡成五如荎徒結反具五味草也草味如金剛杵正中妙挾敲唱双舉通宗通塗挾帶挾路錯然則吉不可犯忤天真而妙不屬迷悟因緣時節寂然昭著細入無間大絕方所毫忽之差不應律呂今有頓漸緣立宗趣宗趣分矣即是規矩宗通趣極真常流注外寂中搖係駒伏鼠先聖悲之為法檀度隨其顛倒以緇為素顛倒相滅肯心自許要合古轍請觀前古佛道垂成十劫觀樹如虎之缺如馬之𮩴以有下劣寶几珍御以有驚異黧奴白牯羿以巧力射中百步箭鋒相直巧力何預木人方歌石兒起舞非情識到寧容思慮臣奉於君子順於父不順於母不孝不奉非輔潛行密用如愚若魯但能相續名主中主南衙題辭新開鷄鴨巴陵新開顥鑒大師傳燈廿二僧問巴陵祖意教意是同是別陵曰鷄寒上樹鴨寒下水石門鈎錐首山念法嗣會元十一石門蘊聰慈照禪師上堂十五日已前諸佛生十五日已後諸佛滅十五日已前諸佛生你不得離我這裡若離我這裡我有鈎子鈎你十五日已後諸佛滅你不得住我這裡若住我這裡我有錐子錐你且道正當十五日用鈎即是用錐即是遂有偈曰正當十五日鈎錐一時息更擬問如何回頭日又出無餘喝道萬卦題詩蚊鑽鐵牛會元九泉州招慶院道匡禪師僧問如何是西來意師曰蚊子上銕牛溈山一日問雲岩聞汝久在藥山是否岩云是山曰藥山大人相如何岩云涅槃後有山曰涅槃後有作麼生岩云水灑不著雲岩却問溈山百丈大人相如何山曰巍巍堂堂煒煒煌煌聲前非聲色後非色蚊子上鐵牛無汝下觜處踞解秤槌會元十二僧問大愚如何是佛愚曰鋸解秤槌龐蘊是非傳燈八龐居士問本溪和尚丹霞打侍者意在何處溪曰大老翁見人長短在士曰為我與師同參方敢借問溪曰若恁麼從頭舉來共你商量士曰大老翁不可共你說人是非溪曰念翁年老士曰罪過罪過清平豐儉翠微無學法嗣傳燈十五鄂州清平山令遵禪師上堂曰諸上坐夫出家人須會佛意始得若會佛意不在僧俗男女貴賤但隨家豐儉安樂便得諸上坐盡是久處叢林徧參尊宿且作麼生會佛意試出來大家商量莫空氣高至後一事無成一生空度若未會佛意直饒頭上出水足下出火燒身鍊臂聰惠多辨聚徒一千二千說法如雲如雨講得天華亂墜只成箇邪說爭競是非去佛法大遠在諸人幸值色身安健不值諸難何妨近前著此工夫體取佛意好大顛佛光石頭迁法嗣事苑四韓愈至潮州聆大顛禪師之名累邀之不至一日大顛特往謁之愈曰三請不來不召何來曰三請不來為侍郎不召而來為佛光愈曰如何是佛光顛曰看看雪峰火焰會元七玄沙因雪峯指火曰三世諸佛在火焰裡轉大法輪沙曰近日王令稍嚴峯曰作麼生沙曰不許攙奪行市雲門曰火焰為三世諸佛說法三世諸佛立地聽大惠還僧圓悟勤法嗣會元十九臨安府徑山宗杲大惠普覺禪師道法之盛冠于一時眾二千餘皆諸方俊乂侍郎張公九成亦從之游灑然契悟一日因議及朝政與師連禍紹興辛酉五月毀衣牒屏居衡陽乃裒先德機語間與拈提離為三帙目曰正法眼藏凡十年移居梅陽又五年高宗皇帝特恩放還明年春復僧伽梨四方虗席以邀率不就後奉朝命居育王逾年有旨改徑山道俗歆慕如初寂音遭貶真淨文法嗣僧寶傳十九清源惠供覺範號寂音尊者崇寧元年反於長沙雲盖是時陳公瓘瑩中謫嶺外以偈見寄且欲其為負華嚴經入嶺偈曰大士遊方興盡回家山風月絕纖埃杖頭多少閑田地挑取華嚴入嶺來師和之曰因法相逢一笑開俯看人世過飛埃湖湘嶺外休分別圓寂光中共往來其後師坐與公遊而獲譴首山竹篦風穴沼法嗣會元十一首山拈竹篦問僧喚作竹篦則觸不喚作竹篦則背且道喚作甚麼玄冥木劒
